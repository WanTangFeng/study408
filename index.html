    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var uidN = 0;
  function uid() { uidN++; return 'fg' + uidN; }

  function defs(id) {
    return '<defs>' +
      '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>';
  }

  function svgOpen(w, h) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" ' +
      'style="width:100%;height:auto;display:block;font-family:var(--sans)">';
  }

  /* ---------------------------------- bits ---------------------------------- */
  function rBits(fig, id) {
    var W = fig.w || 660;
    var segs = fig.segs || [];
    var total = segs.reduce(function (a, s) { return a + (s.bits || 0); }, 0) || 1;
    var x0 = 30, x1 = W - 30, avail = x1 - x0;
    var unit = Math.min(avail / total, fig.unit || 26);
    var bw = total * unit;
    var sx = x0 + (avail - bw) / 2;
    var barY = fig.showBits ? 46 : 30;
    var barH = 44;
    var H = barY + barH + (fig.foot ? 30 : 14);
    var out = svgOpen(W, H) + defs(id);

    var x = sx;
    segs.forEach(function (s, i) {
      var w = (s.bits || 0) * unit;
      var col = C(s.c || 'blue');
      out += '<rect x="' + x.toFixed(1) + '" y="' + barY + '" width="' + (w - 1.5).toFixed(1) +
        '" height="' + barH + '" rx="4" fill="' + col + '" fill-opacity="' + (s.dim ? '.05' : '.10') +
        '" stroke="' + col + '" stroke-width="1.1" ' + (s.dash ? 'stroke-dasharray="4 3"' : '') + '/>';
      var cx = x + w / 2;
      if (w >= 44) {
        out += '<text x="' + cx.toFixed(1) + '" y="' + (barY + 18) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + col + '">' + X(s.t) + '</text>';
        if (s.v) out += '<text x="' + cx.toFixed(1) + '" y="' + (barY + 34) + '" text-anchor="middle" font-size="11.5" font-family="var(--mono)" fill="var(--ink-2)">' + X(s.v) + '</text>';
      } else {
        out += '<text x="' + cx.toFixed(1) + '" y="' + (barY - 8) + '" text-anchor="middle" font-size="10.5" fill="' + col + '">' + X(s.t) + '</text>';
        if (s.v) out += '<text x="' + cx.toFixed(1) + '" y="' + (barY + 28) + '" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink-2)">' + X(s.v) + '</text>';
      }
      if (w >= 44) {
        out += '<text x="' + cx.toFixed(1) + '" y="' + (barY + barH + 14) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + s.bits + ' 位</text>';
      }
      if (fig.showBits) {
        out += '<text x="' + x.toFixed(1) + '" y="' + (barY - 8) + '" font-size="10" font-family="var(--mono)" fill="var(--faint)">' + (total - (segs.slice(0, i).reduce(function (a, z) { return a + z.bits; }, 0))) + '</text>';
        if (i === segs.length - 1) {
          out += '<text x="' + (x + w).toFixed(1) + '" y="' + (barY - 8) + '" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--faint)">0</text>';
        }
      }
      x += w;
    });
    if (fig.foot) {
      out += '<text x="' + (W / 2) + '" y="' + (barY + barH + 30) + '" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">' + X(fig.foot) + '</text>';
    }
    return out + '</svg>';
  }

  /* ---------------------------------- flow ---------------------------------- */
  function rFlow(fig, id) {
    var W = fig.w || 660;
    var nodes = fig.nodes || [];
    var cols = fig.cols || Math.min(3, nodes.length);
    var padX = 14, gapX = 18, boxH = fig.boxH || 52, gapY = fig.gapY || 30;
    var boxW = (W - padX * 2 - gapX * (cols - 1)) / cols;
    var rows = Math.ceil(nodes.length / cols);
    var H = 12 + rows * boxH + (rows - 1) * gapY + 12;
    var out = svgOpen(W, H) + defs(id);
    var pos = [];
    nodes.forEach(function (n, i) {
      var r = Math.floor(i / cols), c = i % cols;
      var x = padX + c * (boxW + gapX);
      var y = 12 + r * (boxH + gapY);
      pos.push({ x: x, y: y, w: boxW, h: boxH, c: c, r: r });
    });
    // 箭头
    for (var i = 0; i + 1 < pos.length; i++) {
      var a = pos[i], b = pos[i + 1];
      var col = C(nodes[i].c || 'blue');
      if (a.r === b.r) {
        var x1 = a.x + a.w, x2 = b.x;
        var yy = a.y + a.h / 2;
        out += '<line x1="' + x1 + '" y1="' + yy + '" x2="' + (x2 - 3) + '" y2="' + yy + '" stroke="' + col + '" stroke-opacity=".55" stroke-width="1.4" marker-end="url(#' + id + ')"/>';
      } else {
        var cx1 = a.x + a.w / 2, cy1 = a.y + a.h;
        var cx2 = b.x + b.w / 2, cy2 = b.y;
        var midY = (cy1 + cy2) / 2;
        out += '<path d="M' + cx1 + ',' + cy1 + ' L' + cx1 + ',' + midY + ' L' + cx2 + ',' + midY + ' L' + cx2 + ',' + (cy2 - 3) + '"' +
          ' fill="none" stroke="' + col + '" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#' + id + ')"/>';
      }
    }
    nodes.forEach(function (n, i) {
      var p = pos[i];
      var col = C(n.c || 'blue');
      out += '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="8" fill="' + col +
        '" fill-opacity=".07" stroke="' + col + '" stroke-width="1.2"/>';
      out += '<text x="' + (p.x + p.w / 2) + '" y="' + (p.y + (n.s ? 21 : p.h / 2 + 4)) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="' + col + '">' + X(n.t) + '</text>';
      if (n.s) {
        out += '<text x="' + (p.x + p.w / 2) + '" y="' + (p.y + 37) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">' + X(n.s) + '</text>';
      }
    });
    return out + '</svg>';
  }

  /* ----------------------------------- seq ---------------------------------- */
  function rSeq(fig, id) {
    var W = fig.w || 660;
    var actors = fig.actors || [];
    var msgs = fig.msgs || [];
    var top = 34, step = 34;
    var H = 12 + top + msgs.length * step + 18;
    var out = svgOpen(W, H) + defs(id);
    var n = actors.length;
    var xs = actors.map(function (_, i) { return 70 + (W - 140) * (n === 1 ? 0.5 : i / (n - 1)); });
    actors.forEach(function (a, i) {
      var w = Math.min(140, 150);
      out += '<rect x="' + (xs[i] - w / 2) + '" y="10" width="' + w + '" height="26" rx="13" fill="var(--panel-3)" stroke="var(--line-strong)"/>';
      out += '<text x="' + xs[i] + '" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">' + X(a) + '</text>';
      out += '<line x1="' + xs[i] + '" y1="38" x2="' + xs[i] + '" y2="' + (H - 16) + '" stroke="var(--line-strong)" stroke-dasharray="3 4"/>';
    });
    msgs.forEach(function (m, i) {
      var y = top + 30 + i * step;
      var a = m[0], b = m[1], lab = m[2] || '', opts = m[3] || {};
      var col = C(opts.c || (b > a ? 'blue' : 'rust'));
      if (a === b) {
        out += '<path d="M' + xs[a] + ',' + y + ' C' + (xs[a] + 46) + ',' + y + ' ' + (xs[a] + 46) + ',' + (y + 16) + ' ' + (xs[a] + 4) + ',' + (y + 16) + '" fill="none" stroke="' + col + '" stroke-width="1.4" marker-end="url(#' + id + ')"/>';
        out += '<text x="' + (xs[a] + 54) + '" y="' + (y + 6) + '" font-size="11" fill="' + col + '">' + X(lab) + '</text>';
      } else {
        var dir = b > a ? 1 : -1;
        out += '<line x1="' + xs[a] + '" y1="' + y + '" x2="' + (xs[b] - dir * 4) + '" y2="' + y + '" stroke="' + col +
          '" stroke-width="1.5" ' + (opts.dash ? 'stroke-dasharray="5 3"' : '') + ' marker-end="url(#' + id + ')"/>';
        var mx = (xs[a] + xs[b]) / 2;
        var anchor = 'middle';
        out += '<text x="' + mx + '" y="' + (y - 7) + '" text-anchor="' + anchor + '" font-size="11" fill="' + col + '">' + X(lab) + '</text>';
      }
    });
    return out + '</svg>';
  }

  /* ---------------------------------- graph --------------------------------- */
  function rGraph(fig, id) {
    var W = fig.w || 660, H = fig.h || 300;
    var nodes = fig.nodes || [], edges = fig.edges || [];
    var mp = {};
    nodes.forEach(function (n) { mp[n.id] = n; });
    var out = svgOpen(W, H) + defs(id);
    edges.forEach(function (e) {
      var a = mp[e[0]], b = mp[e[1]];
      if (!a || !b) return;
      var col = C(e[3] || 'gray');
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var rx = (a.w || 86) / 2 + 6, ry = (a.h || 32) / 2 + 5;
      var ux = dx / len, uy = dy / len;
      var pad = Math.min(rx * Math.abs(ux) + ry * Math.abs(uy), len - 8);
      var x1 = a.x + ux * pad, y1 = a.y + uy * pad;
      var x2 = b.x - ux * (pad + 2), y2 = b.y - uy * (pad + 2);
      out += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
        '" stroke="' + col + '" stroke-opacity=".7" stroke-width="1.3" ' + (e[4] ? 'stroke-dasharray="4 3"' : '') +
        (fig.undirected ? '' : ' marker-end="url(#' + id + ')"') + '/>';
      if (e[2]) {
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        var tw = e[2].length * 11 + 8;
        out += '<rect x="' + (mx - tw / 2) + '" y="' + (my - 19) + '" width="' + tw + '" height="16" rx="8" fill="var(--panel)"/>';
        out += '<text x="' + mx + '" y="' + (my - 7) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">' + X(e[2]) + '</text>';
      }
    });
    nodes.forEach(function (n) {
      var col = C(n.c || 'blue');
      var w = n.w || 86, h = n.h || 32;
      if (n.round) {
        var r = n.r || 26;
        out += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" fill="' + col + '" fill-opacity=".08" stroke="' + col + '" stroke-width="1.5"/>';
        out += '<text x="' + n.x + '" y="' + (n.y + 4) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="' + col + '">' + X(n.t) + '</text>';
      } else {
        out += '<rect x="' + (n.x - w / 2) + '" y="' + (n.y - h / 2) + '" width="' + w + '" height="' + h + '" rx="8" fill="' + col +
          '" fill-opacity=".08" stroke="' + col + '" stroke-width="1.4"/>';
        out += '<text x="' + n.x + '" y="' + (n.y + (n.s ? -2 : 4)) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + col + '">' + X(n.t) + '</text>';
        if (n.s) out += '<text x="' + n.x + '" y="' + (n.y + 12) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-2)">' + X(n.s) + '</text>';
      }
    });
    return out + '</svg>';
  }

  /* ---------------------------------- curve --------------------------------- */
  function rCurve(fig, id) {
    var W = fig.w || 660, H = fig.h || 280;
    var x0 = 54, x1 = W - 24, y0 = 22, y1 = H - 42;
    var xmax = fig.xmax || 10, ymax = fig.ymax || 10;
    var out = svgOpen(W, H) + defs(id);
    function px(x) { return x0 + (x / xmax) * (x1 - x0); }
    function py(y) { return y1 - (y / ymax) * (y1 - y0); }
    // 网格
    (fig.yticks || []).forEach(function (t) {
      var v = t[0], lab = t[1];
      out += '<line x1="' + x0 + '" y1="' + py(v) + '" x2="' + x1 + '" y2="' + py(v) + '" stroke="var(--line)" stroke-width="1"/>';
      out += '<text x="' + (x0 - 8) + '" y="' + (py(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--faint)">' + X(lab == null ? v : lab) + '</text>';
    });
    (fig.xticks || []).forEach(function (t) {
      var v = t[0], lab = t[1];
      out += '<line x1="' + px(v) + '" y1="' + y0 + '" x2="' + px(v) + '" y2="' + y1 + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>';
      out += '<text x="' + px(v) + '" y="' + (y1 + 15) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + X(lab == null ? v : lab) + '</text>';
    });
    // 轴
    out += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="var(--line-strong)" stroke-width="1.3" marker-end="url(#' + id + ')"/>';
    out += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x0 + '" y2="' + y0 + '" stroke="var(--line-strong)" stroke-width="1.3" marker-end="url(#' + id + ')"/>';
    if (fig.xlab) out += '<text x="' + (x1 - 2) + '" y="' + (y1 + 30) + '" text-anchor="end" font-size="10.5" fill="var(--muted)">' + X(fig.xlab) + '</text>';
    if (fig.ylab) out += '<text x="' + (x0 - 4) + '" y="' + (y0 - 8) + '" font-size="10.5" fill="var(--muted)">' + X(fig.ylab) + '</text>';
    // 标线
    (fig.vlines || []).forEach(function (v) {
      out += '<line x1="' + px(v[0]) + '" y1="' + y0 + '" x2="' + px(v[0]) + '" y2="' + y1 + '" stroke="' + C(v[2] || 'red') + '" stroke-width="1.1" stroke-dasharray="4 3"/>';
      out += '<text x="' + (px(v[0]) + 4) + '" y="' + (y0 + 12) + '" font-size="10" fill="' + C(v[2] || 'red') + '">' + X(v[1]) + '</text>';
    });
    // 系列
    (fig.series || []).forEach(function (s) {
      var col = C(s.c || 'blue');
      var pts = s.pts.map(function (p) { return px(p[0]).toFixed(1) + ',' + py(p[1]).toFixed(1); }).join(' ');
      out += '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ' + (s.dash ? 'stroke-dasharray="5 4"' : '') + '/>';
      if (s.dots) {
        s.pts.forEach(function (p) {
          out += '<circle cx="' + px(p[0]) + '" cy="' + py(p[1]) + '" r="2.6" fill="' + col + '"/>';
        });
      }
      if (s.label) {
        var last = s.pts[s.pts.length - 1];
        out += '<text x="' + (px(last[0]) - 4) + '" y="' + (py(last[1]) - 8) + '" text-anchor="end" font-size="11" font-weight="600" fill="' + col + '">' + X(s.label) + '</text>';
      }
    });
    return out + '</svg>';
  }

  /* ---------------------------------- stack --------------------------------- */
  function rStack(fig) {
    var W = fig.w || 660;
    var items = fig.items || [];
    var padTop = 16, gap = 5, rowH = fig.rowH || 34;
    var H = padTop + items.length * (rowH + gap) + 12;
    var maxW = W - 150, minW = 110;
    var out = svgOpen(W, H);
    items.forEach(function (it, i) {
      var w = minW + (maxW - minW) * (it.w == null ? (i + 1) / items.length : it.w);
      var x = (W - w) / 2, y = padTop + i * (rowH + gap);
      var col = C(it.c || 'blue');
      out += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + rowH + '" rx="6" fill="' + col +
        '" fill-opacity=".10" stroke="' + col + '" stroke-width="1.2"/>';
      out += '<text x="' + (x + 14) + '" y="' + (y + rowH / 2 + 4.5) + '" font-size="12.5" font-weight="600" fill="' + col + '">' + X(it.t) + '</text>';
      if (it.s) out += '<text x="' + (x + w - 12) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" font-size="10.5" fill="var(--ink-2)">' + X(it.s) + '</text>';
    });
    return out + '</svg>';
  }

  /* ---------------------------------- bars ---------------------------------- */
  function rBars(fig) {
    var W = fig.w || 660;
    var items = fig.items || [];
    var rowH = 30, gap = 10, labelW = 92;
    var H = 10 + items.length * (rowH + gap) + 6;
    var maxV = Math.max.apply(null, items.map(function (x) { return x.v || 0; })) || 1;
    var avail = W - labelW - 130;
    var out = svgOpen(W, H);
    items.forEach(function (it, i) {
      var y = 10 + i * (rowH + gap);
      var w = Math.max(4, (it.v / maxV) * avail);
      var col = C(it.c || 'blue');
      out += '<text x="' + (labelW - 10) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" font-size="11.5" fill="var(--ink)">' + X(it.t) + '</text>';
      out += '<rect x="' + labelW + '" y="' + (y + 5) + '" width="' + avail + '" height="' + (rowH - 12) + '" rx="4" fill="var(--panel-3)"/>';
      out += '<rect x="' + labelW + '" y="' + (y + 5) + '" width="' + w + '" height="' + (rowH - 12) + '" rx="4" fill="' + col + '" fill-opacity=".72"/>';
      if (it.s) out += '<text x="' + (labelW + w + 8) + '" y="' + (y + rowH / 2 + 4) + '" font-size="10.5" fill="var(--ink-2)">' + X(it.s) + '</text>';
    });
    return out + '</svg>';
  }

  /* ---------------------------------- array --------------------------------- */
  function rArray(fig) {
    var W = fig.w || 660;
    var cells = fig.cells || [];
    var cw = Math.min(52, (W - 40) / Math.max(cells.length, 1));
    var ch = 38;
    var x0 = (W - cw * cells.length) / 2;
    var y0 = 34;
    var H = y0 + ch + (fig.ptr ? 52 : 26);
    var out = svgOpen(W, H) + defs('none');
    cells.forEach(function (c, i) {
      var x = x0 + i * cw;
      var col = C(c.c || 'blue');
      out += '<rect x="' + x + '" y="' + y0 + '" width="' + (cw - 2) + '" height="' + ch + '" rx="3" fill="' +
        (c.hl ? col : 'var(--panel)') + '" fill-opacity="' + (c.hl ? '.16' : '1') + '" stroke="' + (c.hl ? col : 'var(--line-strong)') + '" stroke-width="' + (c.hl ? 1.6 : 1) + '"/>';
      out += '<text x="' + (x + cw / 2 - 1) + '" y="' + (y0 + ch / 2 + 4.5) + '" text-anchor="middle" font-size="12.5" font-family="var(--mono)" fill="' + (c.hl ? col : 'var(--ink)') + '">' + X(c.v) + '</text>';
      out += '<text x="' + (x + cw / 2 - 1) + '" y="' + (y0 - 8) + '" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--faint)">' + i + '</text>';
    });
    (fig.ptr || []).forEach(function (p) {
      var x = x0 + (p.i + 0.5) * cw - 1;
      out += '<path d="M' + x + ',' + (y0 + ch + 26) + ' L' + (x - 5) + ',' + (y0 + ch + 16) + ' L' + (x + 5) + ',' + (y0 + ch + 16) + ' z" fill="' + C(p.c || 'rust') + '"/>';
      out += '<text x="' + x + '" y="' + (y0 + ch + 40) + '" text-anchor="middle" font-size="10.5" fill="' + C(p.c || 'rust') + '">' + X(p.t) + '</text>';
    });
    return out + '</svg>';
  }

  /* ---------------------------------- grid ---------------------------------- */
  function rGrid(fig) {
    var W = fig.w || 660;
    var rows = fig.rows || [], head = fig.head || null;
    var all = head ? [head].concat(rows) : rows;
    var cols = Math.max.apply(null, all.map(function (r) { return r.length; }));
    var cw = (W - 20) / cols, ch = fig.ch || 30;
    var H = 10 + all.length * ch + 8;
    var out = svgOpen(W, H);
    all.forEach(function (row, r) {
      row.forEach(function (cell, c) {
        var x = 10 + c * cw, y = 10 + r * ch;
        var isHead = head && r === 0;
        var hl = isHead || /^★/.test(cell);
        var txt = String(cell).replace(/^★/, '');
        out += '<rect x="' + x + '" y="' + y + '" width="' + cw + '" height="' + ch + '" fill="' + (isHead ? 'var(--panel-3)' : (hl ? 'var(--ink-blue-soft)' : 'transparent')) + '" stroke="var(--line)" stroke-width="1"/>';
        out += '<text x="' + (x + cw / 2) + '" y="' + (y + ch / 2 + 4) + '" text-anchor="middle" font-size="11" ' +
          (isHead ? 'font-weight="600"' : '') + ' fill="' + (isHead ? 'var(--ink)' : 'var(--ink-2)') + '">' + X(txt) + '</text>';
      });
    });
    return out + '</svg>';
  }

  window.renderFig = function (fig) {
    if (!fig || !fig.kind) return '';
    var id = uid();
    var body = '';
    try {
      if (fig.kind === 'bits') body = rBits(fig, id);
      else if (fig.kind === 'flow') body = rFlow(fig, id);
      else if (fig.kind === 'seq') body = rSeq(fig, id);
      else if (fig.kind === 'graph') body = rGraph(fig, id);
      else if (fig.kind === 'curve') body = rCurve(fig, id);
      else if (fig.kind === 'stack') body = rStack(fig);
      else if (fig.kind === 'bars') body = rBars(fig);
      else if (fig.kind === 'array') body = rArray(fig);
      else if (fig.kind === 'grid') body = rGrid(fig);
    } catch (e) {
      return '<div style="font-size:.8rem;color:var(--red)">图渲染失败：' + X(e.message) + '</div>';
    }
    var cap = '';
    if (fig.cap) cap = '<div class="cap">' + X(fig.cap) + '</div>';
    return '<div class="fig">' + body + cap + '</div>';
  };
})();

</script>
<script>
/* ==========================================================================
   408 高效学习台 · 应用逻辑
   纯原生 JS，无外部依赖；localStorage 持久化
   ========================================================================== */
(function () {
  'use strict';

  var D = window.__DATA__ || {};
  var META = D.meta || { subjects: [] };
  var CARDS = (D.cards || []).slice();
  var PV = D.pv || { method: [], skeletons: [], problems: [] };
  var INSTR = D.instr || { method: [], problems: [] };
  var FLOWS = D.flows || [];

  /* ------------------------------ 基础工具 ------------------------------ */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function md(s) {
    var x = esc(s);
    x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
    return x;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function addDays(str, n) {
    var p = str.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function daysBetween(a, b) {
    var pa = a.split('-'), pb = b.split('-');
    var da = Date.UTC(+pa[0], +pa[1] - 1, +pa[2]);
    var db = Date.UTC(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }
  function subMeta(key) {
    for (var i = 0; i < META.subjects.length; i++) if (META.subjects[i].key === key) return META.subjects[i];
    return { key: key, name: key, color: '#666', short: key };
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }
  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 600);
  }

  /* ------------------------------ 状态 ------------------------------ */
  var KEY = 'wb408.study.v1';
  var DEF = {
    v: 1,
    marks: {},   // id -> 2 已掌握 / 1 模糊
    box: {},     // id -> { b: 0..5, due: 'YYYY-MM-DD', n: 次数 }
    days: {},    // 'YYYY-MM-DD' -> { r: 复习张数, m: 新掌握数 }
    cfg: { theme: 'light', fs: 16, dailyNew: 12, mask: true, interleave: false }
  };
  var ST = loadST();

  function loadST() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEF));
      var o = JSON.parse(raw);
      var s = JSON.parse(JSON.stringify(DEF));
      s.marks = o.marks || {}; s.box = o.box || {}; s.days = o.days || {};
      if (o.cfg) for (var k in o.cfg) s.cfg[k] = o.cfg[k];
      return s;
    } catch (e) {
      return JSON.parse(JSON.stringify(DEF));
    }
  }
  var saveTimer = null;
  function saveST() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(ST)); }
      catch (e) { toast('保存失败：浏览器存储空间不足'); }
    }, 120);
  }

  /* ------------------------------ 复习算法 ------------------------------ */
  var IVL = [0, 1, 3, 7, 16, 35];
  function markCard(id, kind) {
    var t = today();
    if (!ST.days[t]) ST.days[t] = { r: 0, m: 0 };
    if (kind === 'none') {
      delete ST.marks[id]; delete ST.box[id];
    } else if (kind === 'ok') {
      if (!ST.marks[id]) ST.days[t].m++;
      ST.marks[id] = 2;
      var b = ST.box[id] ? Math.min(5, (ST.box[id].b || 0) + 1) : 1;
      ST.box[id] = { b: b, due: addDays(t, IVL[b]), n: (ST.box[id] ? ST.box[id].n : 0) + 1 };
    } else {
      ST.marks[id] = 1;
      ST.box[id] = { b: 1, due: addDays(t, 1), n: (ST.box[id] ? ST.box[id].n : 0) + 1 };
    }
    if (kind !== 'none') ST.days[t].r++;
    saveST();
    paintBadge();
  }
  function dueCards() {
    var t = today(), out = [];
    CARDS.forEach(function (c) {
      var b = ST.box[c.id];
      if (b && b.due <= t) out.push(c);
    });
    out.sort(function (a, b) { return ST.box[a.id].due < ST.box[b.id].due ? -1 : 1; });
    return out;
  }
  function newCards() {
    var out = [];
    CARDS.forEach(function (c) { if (!ST.box[c.id]) out.push(c); });
    return out;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function buildQueue() {
    var due = dueCards();
    var need = Math.max(0, (ST.cfg.dailyNew || 12) - Math.min((ST.days[today()] || { r: 0 }).r, ST.cfg.dailyNew || 12));
    var nw = newCards().slice(0, Math.max(0, need));
    var q = due.concat(nw);
    // 交错练习：把四科打散，逼大脑每次重新「选方法」，而不是顺着同一章的惯性走
    if (ST.cfg.interleave) q = shuffle(q);
    return q;
  }

  /* ------------------------------ 主题 / 字号 ------------------------------ */
  function applyCfg() {
    document.documentElement.setAttribute('data-theme', ST.cfg.theme || 'light');
    document.documentElement.style.setProperty('--fs-base', (ST.cfg.fs || 16) + 'px');
  }
  function toggleTheme() {
    ST.cfg.theme = ST.cfg.theme === 'dark' ? 'light' : 'dark';
    applyCfg(); saveST();
  }
  var FSS = [15, 16, 17.5, 19];
  function cycleFS() {
    var i = FSS.indexOf(ST.cfg.fs);
    ST.cfg.fs = FSS[(i + 1) % FSS.length];
    applyCfg(); saveST();
    toast('字号 ' + ST.cfg.fs + 'px');
  }

  /* ------------------------------ 路由 ------------------------------ */
  var ROUTES = { today: '今日回顾', pv: 'PV 大题工作台', instr: '指令系统工作台', cards: '知识卡片', atlas: '图解速览', flows: '常考过程推演', stats: '进度与数据' };
  var cur = { name: 'today', arg: '' };
  function parseHash() {
    var h = location.hash.replace(/^#\/?/, '');
    if (!h) return { name: 'today', arg: '' };
    var parts = h.split('/');
    return { name: parts[0] || 'today', arg: parts.slice(1).join('/') };
  }
  function go(h) { location.hash = h; }
  function onRoute() {
    var r = parseHash();
    if (!ROUTES[r.name]) { r = { name: 'today', arg: '' }; }
    cur = r;
    $$('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-r') === r.name); });
    $('#pageTitle').textContent = ROUTES[r.name];
    $('#side').classList.remove('open');
    window.scrollTo(0, 0);
    render();
  }

  /* ------------------------------ 视图：今日 ------------------------------ */
  // 复习会话：list 固定（本轮队列），i 当前位置，done 本轮已处理数
  var RS = { list: [], i: 0, done: 0, revealed: false, built: false };

  function renderToday() {
    var t = today();
    var due = dueCards().length;
    var nw = Math.min(newCards().length, Math.max(0, (ST.cfg.dailyNew || 12) - ((ST.days[t] || { r: 0 }).r)));
    var total = CARDS.length;
    var mastered = Object.keys(ST.marks).filter(function (k) { return ST.marks[k] === 2; }).length;
    var pct = total ? Math.round(mastered / total * 100) : 0;
    var hour = new Date().getHours();
    var greet = hour < 6 ? '还在写代码？' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : hour < 23 ? '晚上好' : '夜深了';
    var done = (ST.days[t] || { r: 0 }).r;
    var streak = calcStreak();

    if (!RS.built) { RS.list = buildQueue(); RS.built = true; RS.i = 0; }

    var h = '';
    h += '<div class="hero">';
    h += '<div class="hero-main"><div class="greet">' + greet + ' · 距考试还有 <b id="dday">—</b> 天</div>';
    h += '<h2>今天只做三件事：回顾、拆题、记账。</h2>';
    h += '<p>今日待复习 <b>' + due + '</b> 张，新卡 <b>' + nw + '</b> 张。复习按 1→3→7→16→35 天的间隔推送，答不上来的第二天必回。</p>';
    h += '<div class="hero-stats">';
    h += '<div class="s"><b>' + mastered + '</b><span>已掌握</span></div>';
    h += '<div class="s"><b>' + total + '</b><span>知识卡片</span></div>';
    h += '<div class="s"><b>' + streak + '</b><span>连续打卡</span></div>';
    h += '<div class="s"><b>' + done + '</b><span>今日已回顾</span></div>';
    h += '</div></div>';
    h += '<div class="hero-side"><div class="ringbox">' + ring(pct, 96) +
         '<div class="lab">总掌握率</div></div></div>';
    h += '</div>';

    h += '<div class="quick">';
    h += qlink('#/pv', '⚙', 'PV 六步法', '16 道真题 · 分步拆解 · 代码自检');
    h += qlink('#/instr', '▤', '指令系统四步法', '8 道真题 · 三个计算器');
    h += qlink('#/cards', '▦', '知识卡片', total + ' 张 · 按科目章节');
    h += qlink('#/flows', '⇄', '常考过程', FLOWS.length + ' 条全流程推演');
    h += '</div>';

    var left = Math.max(0, RS.list.length - RS.i);
    h += '<div class="sec-h"><div class="t">今日回顾</div><div class="l"></div><div class="n">' +
         (left ? ('还剩 ' + left + ' 张 · 本轮已处理 ' + RS.done) : '已完成') + '</div></div>';

    if (!left) {
      h += '<div class="empty-state panel"><div class="e1">这一轮的额度已经清空</div>' +
           '<div class="e2">按间隔重复的规则，明天会推送新的到期卡片。<br>想多刷几张，可以再来一轮新卡，或去 <a href="#/cards">知识卡片</a> 手动过一遍。</div>' +
           '<div class="mt16"><button class="btn" id="moreBtn">再来 10 张新卡</button> ' +
           '<button class="btn ghost" id="toStats">看进度</button></div></div>';
    } else {
      h += reviewBlock();
    }

    h += '<div class="sec-h"><div class="t">六种学法，在这个站里怎么用</div><div class="l"></div><div class="n">都有实证支持</div></div>';
    h += '<div class="panel small methodbox">' +
      mline('检索练习', '先遮住答案，自己说一遍再点开。比反复阅读有效得多——「想不起来」的那一下，才是记忆真正发生的地方。', '今日回顾默认开启回忆模式') +
      mline('间隔重复', '在快要忘的那一刻复习一次。答不上的明天必回，答得上的间隔越拉越长（1→3→7→16→35 天）。', '每天推送的队列') +
      mline('交错练习', '四科打散，逼大脑每次重新判断「这题该用哪招」，而不是顺着同一章的惯性走。', '「交错混合」开关') +
      mline('双重编码', '同一件事，用文字记一遍、用图再记一遍。两条通路互为索引，想起来的机会翻倍。', '知识卡片里的图与图解速览') +
      mline('精细提问', '每张卡末尾的「多问一句」，逼你回答「为什么」而不是「是什么」。能答上为什么，才记得住。', '卡片里的追问区块') +
      mline('费曼技巧', '合上卡，对着图用自己的话把过程讲一遍。讲卡住的地方，就是你真正的漏洞。', '过程推演的逐步解锁') +
      '<div class="mnote">建议一轮 25 分钟：先过今日队列，再挑一张图讲一遍，最后点开两张卡的「多问一句」。</div>' +
      '</div>';

    h += '<div class="sec-h"><div class="t">复习规则</div><div class="l"></div><div class="n">间隔重复</div></div>';
    h += '<div class="panel small" style="color:var(--ink-2)">' +
         '<p style="margin:0 0 8px">每张卡有两个按钮：<b>没记住</b>（明天再来）与 <b>已掌握</b>（按 1→3→7→16→35 天逐步拉长）。' +
         '这不是「背单词」，是让你在<b>快要忘的那一刻</b>被迫回忆一次——回忆本身才是记忆。</p>' +
         '<p style="margin:0">每日新卡上限 <b>' + (ST.cfg.dailyNew || 12) + '</b> 张，可以在下面调：</p>' +
         '<div class="row mt8" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
         [6, 12, 20, 30].map(function (n) {
           return '<button class="fbtn' + (ST.cfg.dailyNew === n ? ' on' : '') + '" data-dn="' + n + '">' + n + ' 张/天</button>';
         }).join('') +
         '<span style="flex:1"></span>' +
         '<button class="btn sm' + (ST.cfg.mask ? ' green' : '') + '" id="maskToggle">' +
         (ST.cfg.mask ? '回忆模式：开' : '回忆模式：关') + '</button>' +
         '<button class="btn sm' + (ST.cfg.interleave ? ' green' : '') + '" id="intToggle">' +
         (ST.cfg.interleave ? '交错混合：开' : '交错混合：关') + '</button>' +
         '</div></div>';

    return h;
  }

  function mline(t, d, where) {
    return '<div class="ml"><div class="mlt">' + t + '</div><div class="mld">' + d +
      (where ? '<span class="mlw">→ ' + where + '</span>' : '') + '</div></div>';
  }

  function qlink(href, ic, t, d) {
    return '<a href="' + href + '"><div class="qi">' + ic + '</div><div class="qt">' + t + '</div><div class="qd">' + d + '</div></a>';
  }

  function reviewBlock() {
    var c = RS.list[RS.i];
    if (!c) return '';
    var sm = subMeta(c.sub);
    var isNew = !ST.box[c.id];          // 第一次见：直接给内容，不要求「回忆没学过的东西」
    var show = RS.revealed || !ST.cfg.mask || isNew;
    var h = '<div class="review-wrap">';
    h += '<div class="rhead"><div style="flex:1" class="progressbar"><i style="width:' +
         Math.round(RS.i / RS.list.length * 100) + '%"></i></div>' +
         '<div class="info">' + (RS.i + 1) + ' / ' + RS.list.length + '</div></div>';
    h += '<div class="rcard" id="rcard">';
    h += '<div class="rmeta"><span class="chip solid" style="background:' + sm.color + '1a;color:' + sm.color + '">' + sm.name + '</span>';
    h += '<span class="chip">' + esc(c.ch) + '</span>';
    if (c.star === 3) h += '<span class="chip rust">高频</span>';
    if (isNew) h += '<span class="chip blue">新卡</span>';
    h += '<span class="rch">' + (c.freq && c.freq.length ? '真题 ' + c.freq.slice(0, 3).join(' · ') : '') + '</span></div>';
    h += '<h2>' + md(c.t) + '</h2>';
    h += '<div class="rbody' + (show ? '' : ' masked') + '" id="rbody">' + cardCore(c) + '</div>';
    if (!show) {
      h += '<div class="maskhint" id="maskHint"><div class="big">先自己说一遍</div><div class="small">想不起来也没关系 —— 想不起来的那一下才有用</div><div class="small" style="margin-top:6px">点这里或按空格显示</div></div>';
    }
    h += '<div class="ractions">';
    h += '<button class="btn" data-mk="mid">没记住 <span class="dim small">1</span></button>';
    h += '<button class="btn green" data-mk="ok">已掌握 <span class="small" style="opacity:.7">2</span></button>';
    h += '<button class="btn ghost" data-mk="skip">跳过 <span class="dim small">3</span></button>';
    h += '</div></div></div>';
    return h;
  }

  function figHTML(fig) {
    if (!fig || !window.renderFig) return '';
    return window.renderFig(fig);
  }

  function cardCore(c) {
    var h = '', placed = false;
    (c.core || []).forEach(function (p) {
      if (p === '@fig') {
        if (c.fig) { h += figHTML(c.fig); placed = true; }
        return;
      }
      if (/^###\s/.test(p)) h += '<div class="sb-h" style="margin-top:14px">' + md(p.replace(/^###\s/, '')) + '</div>';
      else h += '<p>' + md(p) + '</p>';
    });
    if (c.fig && !placed) h += figHTML(c.fig);
    return h;
  }

  function bindReview() {
    var card = $('#rcard');
    if (!card) return;
    var hint = $('#maskHint');
    if (hint) hint.onclick = reveal;
    $$('[data-mk]', card).forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-mk');
        var c = RS.list[RS.i];
        if (!c) return;
        if (k !== 'skip') markCard(c.id, k);
        RS.i++;
        RS.done++;
        RS.revealed = false;
        render();
      };
    });
  }
  function reveal() {
    RS.revealed = true;
    var b = $('#rbody'); if (b) b.classList.remove('masked');
    var h = $('#maskHint'); if (h) h.remove();
  }

  function ring(pct, size) {
    var r = size / 2 - 7, c = 2 * Math.PI * r;
    var off = c * (1 - pct / 100);
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--panel-3)" stroke-width="8"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--green)" stroke-width="8" ' +
      'stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" ' +
      'transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      '<text x="50%" y="50%" text-anchor="middle" dy=".36em" font-size="' + (size * 0.23) + '" font-family="var(--serif)" fill="var(--ink)">' + pct + '%</text></svg>';
  }

  function calcStreak() {
    var n = 0, d = today();
    if (!(ST.days[d] && ST.days[d].r > 0)) d = addDays(d, -1);
    while (ST.days[d] && ST.days[d].r > 0) { n++; d = addDays(d, -1); }
    return n;
  }

  /* ------------------------------ 视图：知识卡片 ------------------------------ */
  var CF = { sub: 'all', st: 'all', ch: 'all', q: '' };

  function renderCards() {
    var subs = META.subjects;
    var h = '';
    h += '<h1 class="vt">知识卡片</h1>';
    h += '<div class="vsub">共 <b>' + CARDS.length + '</b> 张。每张都是「一整段能读懂的解释」，不是提纲。点标题展开，展开后可直接标记掌握状态。</div>';

    h += '<div class="filters">';
    h += '<span class="fl">科目</span>';
    h += '<button class="fbtn' + (CF.sub === 'all' ? ' on' : '') + '" data-fs="all">全部<span class="c">' + CARDS.length + '</span></button>';
    subs.forEach(function (s) {
      var n = CARDS.filter(function (c) { return c.sub === s.key; }).length;
      h += '<button class="fbtn' + (CF.sub === s.key ? ' on' : '') + '" data-fs="' + s.key + '">' + s.name + '<span class="c">' + n + '</span></button>';
    });
    h += '</div>';

    h += '<div class="filters">';
    h += '<span class="fl">状态</span>';
    var sts = [['all', '全部'], ['new', '未学'], ['fuzzy', '模糊'], ['ok', '已掌握'], ['due', '待复习']];
    sts.forEach(function (x) {
      var n = countByState(x[0]);
      h += '<button class="fbtn' + (CF.st === x[0] ? ' on' : '') + '" data-fst="' + x[0] + '">' + x[1] + '<span class="c">' + n + '</span></button>';
    });
    h += '<span style="flex:1"></span>';
    h += '<select class="sel" id="chSel"><option value="all">全部章节</option>';
    var chs = chaptersOf(CF.sub);
    chs.forEach(function (x) {
      h += '<option value="' + esc(x) + '"' + (CF.ch === x ? ' selected' : '') + '>' + esc(x) + '</option>';
    });
    h += '</select></div>';

    var list = filterCards();
    h += '<div class="small dim" style="margin-bottom:10px">筛出 <b style="color:var(--ink-2)">' + list.length + '</b> 张' +
         (CF.q ? '（关键词：' + esc(CF.q) + '）' : '') + '</div>';

    if (!list.length) {
      h += '<div class="empty-state panel"><div class="e1">没有符合条件的卡片</div><div class="e2">换个科目或状态试试。</div></div>';
      return h;
    }

    h += '<div class="clist">';
    var lastCh = '';
    list.forEach(function (c, i) {
      if (CF.sub === 'all' && c.ch !== lastCh) {
        if (lastCh) h += '</div>';
        var sm0 = subMeta(c.sub);
        h += '<div class="subblock" style="margin-top:26px"><div class="sb-h" style="color:' + sm0.color + '">' +
             esc(sm0.name) + ' · ' + esc(c.ch) + '</div><div class="clist" style="margin-top:-2px">';
        lastCh = c.ch;
      } else if (CF.sub !== 'all' && c.ch !== lastCh) {
        if (lastCh) h += '</div>';
        h += '<div class="subblock" style="margin-top:10px"><div class="sb-h">' + esc(c.ch) + '</div><div class="clist" style="margin-top:-2px">';
        lastCh = c.ch;
      }
      h += cardHTML(c, i);
    });
    h += '</div></div>';

    return h;
  }

  function countByState(st) {
    if (st === 'all') return CARDS.length;
    if (st === 'new') return CARDS.filter(function (c) { return !ST.box[c.id]; }).length;
    if (st === 'fuzzy') return CARDS.filter(function (c) { return ST.marks[c.id] === 1; }).length;
    if (st === 'ok') return CARDS.filter(function (c) { return ST.marks[c.id] === 2; }).length;
    if (st === 'due') return dueCards().length;
    return 0;
  }
  function chaptersOf(sub) {
    var seen = [], out = [];
    META.subjects.forEach(function (s) {
      if (sub !== 'all' && s.key !== sub) return;
      (s.chapters || []).forEach(function (ch) { if (seen.indexOf(ch) < 0) { seen.push(ch); out.push(ch); } });
    });
    return out;
  }
  function filterCards() {
    var t = today();
    return CARDS.filter(function (c) {
      if (CF.sub !== 'all' && c.sub !== CF.sub) return false;
      if (CF.ch !== 'all' && c.ch !== CF.ch) return false;
      if (CF.st === 'new' && ST.box[c.id]) return false;
      if (CF.st === 'fuzzy' && ST.marks[c.id] !== 1) return false;
      if (CF.st === 'ok' && ST.marks[c.id] !== 2) return false;
      if (CF.st === 'due' && !(ST.box[c.id] && ST.box[c.id].due <= t)) return false;
      if (CF.q) {
        var hay = (c.t + ' ' + c.ch + ' ' + (c.core || []).join(' ') + ' ' + (c.points || []).join(' ') + ' ' + (c.trap || []).join(' ')).toLowerCase();
        if (hay.indexOf(CF.q.toLowerCase()) < 0) return false;
      }
      return true;
    });
  }

  function cardHTML(c, i) {
    var sm = subMeta(c.sub);
    var mk = ST.marks[c.id];
    var box = ST.box[c.id];
    var h = '<div class="kcard" data-id="' + c.id + '" style="--sc:' + sm.color + '">';
    h += '<div class="kh" data-toggle="' + c.id + '">';
    h += '<div class="kt">' + md(c.t) + '</div>';
    h += '<div class="kidx">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</div></div>';
    h += '<div class="kmeta">';
    if (c.star === 3) h += '<span class="chip rust">高频</span>';
    (c.tags || []).forEach(function (tg) {
      if (tg === '高频') return;                       // star 已经显示「高频」，避免重复
      h += '<span class="chip">' + esc(tg) + '</span>';
    });
    if (c.freq && c.freq.length) h += '<span class="chip gold">真题 ' + c.freq.length + ' 次</span>';
    if (mk === 2) h += '<span class="chip green">已掌握</span>';
    else if (mk === 1) h += '<span class="chip gold">模糊</span>';
    else h += '<span class="chip">未学</span>';
    if (box) h += '<span class="chip" style="margin-left:auto">下次 ' + box.due.slice(5) + '</span>';
    h += '</div>';
    h += '<div class="kbody">';
    h += cardCore(c);
    if (c.points && c.points.length) {
      h += '<div class="subblock"><div class="sb-h">速记</div><ul>' +
           c.points.map(function (p) { return '<li>' + md(p) + '</li>'; }).join('') + '</ul></div>';
    }
    if (c.why && c.why.length) {
      h += '<div class="subblock"><div class="sb-h">多问一句（自己先答，再看）</div><div class="whybox">';
      c.why.forEach(function (w) {
        h += '<div class="wq">' + md(w[0]) + '</div><div class="wa">' + md(w[1]) + '</div>';
      });
      h += '</div></div>';
    }
    if (c.links && c.links.length) {
      var lk = '';
      c.links.forEach(function (l) {
        var rc = cardById(l[0]);
        if (!rc) return;
        lk += '<div class="lk"><a class="al" href="#/cards" data-jump="' + l[0] + '">' + esc(rc.t) + '</a>' +
              '<span class="lr">' + md(l[1]) + '</span></div>';
      });
      if (lk) h += '<div class="subblock"><div class="sb-h">和别的卡怎么连</div><div class="links">' + lk + '</div></div>';
    }
    if (c.trap && c.trap.length) {
      h += '<div class="trapbox"><div class="tb-h">易错</div><ul>' +
           c.trap.map(function (p) { return '<li>' + md(p) + '</li>'; }).join('') + '</ul></div>';
    }
    if (c.freq && c.freq.length) {
      h += '<div class="subblock"><div class="sb-h">真题出处</div><div class="flex wrap gap8">' +
           c.freq.map(function (f) { return '<span class="chip">' + esc(f) + '</span>'; }).join('') + '</div></div>';
    }
    if (!(c.links && c.links.length) && !(c.rel && c.rel.length)) {
      var sib = CARDS.filter(function (x) { return x.ch === c.ch && x.id !== c.id; }).slice(0, 3);
      if (sib.length) {
        h += '<div class="subblock"><div class="sb-h">同章还有</div><div class="flex wrap gap8">' +

      fld('opA', '一个地址码位数', '4') +
      fld('op2', '二地址指令条数', '15') +
      fld('op1', '一地址指令条数', '34') +
      fld('op0', '零地址指令条数', '16') +
      '</div><div class="row"><button class="btn primary" id="opRun">计算</button>' +
      '<button class="btn" id="opEx16">填入经典 16 位例子</button>' +

      '<div class="report" id="opOut"></div></div>';
  }
  function fld(id, label, val, type) {
    return '<div class="field"><label>' + label + '</label><input id="' + id + '" value="' + val + '"' + (type ? ' type="' + type + '"' : '') + '></div>';
  }

  function calcOpcode() {
    var L = parseInt($('#opL').value, 10), A = parseInt($('#opA').value, 10);
    var n2 = parseInt($('#op2').value, 10) || 0, n1 = parseInt($('#op1').value, 10) || 0, n0 = parseInt($('#op0').value, 10) || 0;
    var out = $('#opOut');
    if (!(L > 0) || !(A >= 0) || 2 * A >= L) {
      out.innerHTML = '<div class="rline err"><span class="ri">×</span><span>参数不合法：要求 2×地址码位数 &lt; 指令字长。</span></div>';
      return;
    }
    var o2 = L - 2 * A, o1 = L - A, o0 = L;
    var max2 = Math.pow(2, o2);
    var max1 = Math.pow(2, o1);
    var max0 = Math.pow(2, o0);
    var rem2 = max2 - n2;
    var cap1 = rem2 * Math.pow(2, A);
    var rem1 = cap1 - n1;
    var cap0 = rem1 * Math.pow(2, A);

    var h = '<table class="dt"><tr><th>格式</th><th>操作码位数</th><th>地址字段</th><th>编码空间</th><th>需要</th><th>结论</th></tr>';
    h += row3('二地址', o2, 2 * A + ' 位（' + A + '+' + A + '）', max2, n2, n2 <= max2);
    h += row3('一地址', o1, A + ' 位', cap1, n1, n1 <= cap1);
    h += row3('零地址', o0, '无', cap0, n0, n0 <= cap0);
    h += '</table>';

    if (n2 <= max2 && n1 <= cap1 && n0 <= cap0) {
      h += '<div class="rline ok"><span class="ri">✓</span><span><b>放得下。</b>还剩余：一地址可再加 ' + (cap1 - n1) + ' 条，零地址可再加 ' + (cap0 - n0) + ' 条。</span></div>';
    } else {
      h += '<div class="rline err"><span class="ri">×</span><span><b>放不下。</b>按这个方案，超出的部分是：' +
        (n2 > max2 ? '二地址超出 ' + (n2 - max2) + ' 条；' : '') +
        (n1 > cap1 ? '一地址超出 ' + (n1 - cap1) + ' 条；' : '') +
        (n0 > cap0 ? '零地址超出 ' + (n0 - cap0) + ' 条。' : '') + '</span></div>';
    }

    // 编码分配方案
    h += '<div class="subblock"><div class="sb-h">一种合法的编码分配</div><ul style="font-family:var(--mono);font-size:.82rem">';
    h += '<li>二地址：操作码 ' + hexPad(0, o2) + 'H ~ ' + hexPad(n2 - 1, o2) + 'H（共 ' + n2 + ' 条）</li>';
    if (n2 < max2) {
      var usedExt = Math.ceil(n1 / Math.pow(2, A));
      h += '<li>一地址：借用二地址剩下的 ' + (max2 - n2) + ' 个操作码做前缀，每条前缀可派生 ' + Math.pow(2, A) + ' 条' +
           ' → 需要 ' + usedExt + ' 个前缀，用操作码 ' + hexPad(n2, o2) + 'H ~ ' + hexPad(n2 + usedExt - 1, o2) + 'H</li>';
      h += '<li>零地址：再借一地址剩下的编码，每条可派生 ' + Math.pow(2, A) + ' 条</li>';
    }
    h += '</ul><div class="small dim" style="margin-top:6px">阅卷只看「位数对不对、够不够用」，具体把哪段编码分给谁不影响得分，写清楚就行。</div></div>';
    out.innerHTML = h;
  }
  function row3(name, bits, addr, space, need, ok) {
    return '<tr><td><b>' + name + '</b></td><td>' + bits + ' 位</td><td>' + addr + '</td><td>' + space +
      '</td><td>' + need + '</td><td style="color:' + (ok ? 'var(--green)' : 'var(--red)') + ';font-weight:600">' + (ok ? '够' : '不够') + '</td></tr>';
  }
  function hexPad(v, bits) {
    var s = v.toString(16).toUpperCase();
    var w = Math.ceil(bits / 4);
    while (s.length < w) s = '0' + s;
    return s;
  }

  /* -------- 计算器 2：相对寻址 -------- */
  function toolRel() {
    return '<div class="tool"><h3>② 相对寻址计算器</h3>' +
      '<div class="tool-d">转移指令的核心：<b>PC 已经指向下一条指令</b>，再用补码位移去加。这里可以做正反两个方向的计算。</div>' +
      '<div class="grid3">' +
      fld('rAddr', '本条指令地址（十六进制）', '2000') +
      fld('rLen', '指令长度（字节或字，看编址单位）', '2') +
      fld('rDisp', '位移量（十六进制补码）', 'FFF6') +
      '<div class="field"><label>编址单位</label><select id="rUnit"><option value="1">按字节编址</option><option value="2">按字编址（字长 16 位）</option><option value="4">按字编址（字长 32 位）</option></select></div>' +
      '</div><div class="row"><button class="btn primary" id="rRun">算目标地址</button>' +
      '<button class="btn" id="rRev">反推：给目标求位移</button>' +
      '<span class="sp"></span><span class="small dim">位移量按补码解释，负数表示往回跳</span></div>' +
      '<div class="report" id="rOut"></div></div>';
  }

  function calcRel(reverse) {
    var addr = parseHex($('#rAddr').value);
    var len = parseInt($('#rLen').value, 10) || 0;
    var disp = parseHex($('#rDisp').value);
    var unit = parseInt($('#rUnit').value, 10) || 1;
    var out = $('#rOut');
    if (addr == null || disp == null || !len) { out.innerHTML = '<div class="rline err"><span class="ri">×</span><span>参数填错了，地址和位移都要是十六进制。</span></div>'; return; }

    var dispW = (($('#rDisp').value.replace(/[^0-9a-fA-F]/g, '').length) * 4) || 16;
    var signed = toSigned(disp, dispW);
    var pc = addr + len;          // 下一条指令地址（以编址单位计）
    var ea = pc + signed;         // 目标地址

    var h = '<table class="dt"><tr><th>量</th><th>值</th><th>怎么来的</th></tr>';
    h += '<tr><td>本条指令地址</td><td class="mono">' + hexPad(addr, 16) + 'H</td><td>题目给的</td></tr>';
    h += '<tr><td>指令长度</td><td class="mono">' + len + ' ' + (unit === 1 ? '字节' : '字') + '</td><td>看指令格式或字节数</td></tr>';
    h += '<tr><td>PC（取下条后）</td><td class="mono">' + hexPad(pc, 16) + 'H</td><td>' + hexPad(addr, 16) + 'H + ' + len + '</td></tr>';
    h += '<tr><td>位移量真值</td><td class="mono">' + signed + '</td><td>' + dispW + ' 位补码，最高位为 ' + (signed < 0 ? '1 → 负数' : '0 → 正数') + '</td></tr>';
    h += '<tr><td><b>目标地址 EA</b></td><td class="mono"><b>' + hexPad((ea % 65536 + 65536) % 65536, 16) + 'H</b></td><td>PC + 位移量 = ' + hexPad(pc, 16) + 'H ' + (signed >= 0 ? '+' : '−') + ' ' + Math.abs(signed) + '</td></tr>';
    h += '</table>';

    h += '<div class="rline ' + (signed < 0 ? 'warn' : 'ok') + '"><span class="ri">' + (signed < 0 ? '↩' : '↪') + '</span><span>' +
      (signed < 0 ? '往回跳 ' + Math.abs(signed) + ' 个编址单位（向后转移）。' : '往后跳 ' + signed + ' 个编址单位（向前转移）。') +
      ' 注意不是从「本条地址」加，而是从「本条地址 + 指令长度」加。</span></div>';

    if (reverse) {
      h += '<div class="rline warn"><span class="ri">!</span><span>反推时请把上表最后的 EA 当作已知，位移 = 目标 − PC。上表已经给出正向结果，直接取负号即可。</span></div>';
    }
    out.innerHTML = h;
  }
  function parseHex(s) {
    if (s == null) return null;
    var t = String(s).replace(/0x/i, '').replace(/H$/i, '').replace(/[^0-9a-fA-F]/g, '');
    if (!t) return null;
    return parseInt(t, 16);
  }
  function toSigned(v, bits) {
    var half = Math.pow(2, bits - 1);
    return v >= half ? v - Math.pow(2, bits) : v;
  }

  /* -------- 计算器 3：机器码切分 -------- */
  function toolSplit() {
    return '<div class="tool"><h3>③ 机器码切分器</h3>' +
      '<div class="tool-d">把一条机器码按指令格式切开。字段用「名字:位数」写，空格分隔；不写名字就只写位数。' +
      '例如 <code>op:6 rs:5 rt:5 imm:16</code> 或 <code>4 3 3 6</code>。</div>' +
      '<div class="grid3">' + fld('sCode', '机器码（十六进制）', '01B2') +
      '<div class="field grow"><label>字段格式</label><input id="sFmt" value="op:4 rs:4 rd:4 imm:4"></div></div>' +
      '<div class="row"><button class="btn primary" id="sRun">切分</button>' +
      '<button class="btn" id="sEx">看一个例子</button>' +
      '<span class="sp"></span><span class="small dim">超过 32 位也能算（按字符串处理）</span></div>' +
      '<div class="report" id="sOut"></div></div>';
  }

  function calcSplit() {
    var code = ($('#sCode').value || '').replace(/0x/i, '').replace(/H$/i, '').replace(/[^0-9a-fA-F]/g, '');
    var fmt = ($('#sFmt').value || '').trim();
    var out = $('#sOut');
    if (!code || !fmt) { out.innerHTML = '<div class="rline err"><span class="ri">×</span><span>机器码和字段格式都要填。</span></div>'; return; }
    // hex -> binary
    var bin = '';
    for (var i = 0; i < code.length; i++) {
      var v = parseInt(code[i], 16);
      bin += ('0000' + v.toString(2)).slice(-4);
    }
    var parts = fmt.split(/[\s,，]+/).filter(Boolean);
    var fields = [], total = 0;
    for (var j = 0; j < parts.length; j++) {
      var p = parts[j], name, bits;
      if (p.indexOf(':') > 0) { var t = p.split(':'); name = t[0]; bits = parseInt(t[1], 10); }
      else { name = 'F' + (j + 1); bits = parseInt(p, 10); }
      if (!(bits > 0)) { out.innerHTML = '<div class="rline err"><span class="ri">×</span><span>字段「' + esc(p) + '」的位数不对。</span></div>'; return; }
      fields.push({ name: name, bits: bits });
      total += bits;
    }
    if (total !== bin.length) {
      out.innerHTML = '<div class="rline warn"><span class="ri">!</span><span>字段位数合计 ' + total + ' 位，但机器码是 ' + bin.length +
        ' 位（' + code.length + ' 个十六进制位）。已按字段合计截取/补齐，请自行核对。</span></div>' + splitTable(bin, fields, total);
      return;
    }
    out.innerHTML = '<div class="rline ok"><span class="ri">✓</span><span>合计 ' + total + ' 位，与机器码长度一致。</span></div>' + splitTable(bin, fields, total);
  }
  function splitTable(bin, fields, total) {
    if (bin.length < total) while (bin.length < total) bin = '0' + bin;
    if (bin.length > total) bin = bin.slice(bin.length - total);
    var pos = 0;
    var h = '<table class="dt"><tr><th>字段</th><th>位数</th><th>二进制</th><th>十六进制</th><th>无符号值</th><th>补码值</th></tr>';
    var slices = [];
    fields.forEach(function (f) {
      var s = bin.substr(pos, f.bits); pos += f.bits;
      slices.push({ f: f, s: s });
    });
    slices.forEach(function (x) {
      var u = parseInt(x.s, 2);
      h += '<tr><td><b>' + esc(x.f.name) + '</b></td><td>' + x.f.bits + '</td><td class="mono" style="letter-spacing:.06em">' +
        x.s.replace(/(.{4})/g, '$1 ').trim() + '</td><td class="mono">' + hexPad(u, x.f.bits) + 'H</td><td class="mono">' + u +
        '</td><td class="mono">' + toSigned(u, x.f.bits) + '</td></tr>';
    });
    h += '</table>';
    h += '<div class="small dim">切分示意：' + slices.map(function (x) { return x.f.name + '[' + x.s + ']'; }).join(' | ') + '</div>';
    return h;
  }

  /* ------------------------------ 视图：过程推演 ------------------------------ */

  function heat() {
    var weeks = 12, cells = [];
    var end = today();
    // 对齐到本周日
    var d = new Date();
    var dow = d.getDay(); // 0 Sun

    var h = '<div class="heat">';
    for (var w = 0; w < weeks; w++) {
      h += '<div class="hcol">';

        var day = addDays(start, w * 7 + k);
        var rec = ST.days[day];

    h += '</div>';

  /* ------------------------------ PV 自检器 ------------------------------ */
  function bindPVChecker() {
    var run = $('#pvRun'), demo = $('#pvDemo'), ta = $('#pvIn');
    if (!run) return;
    demo.onclick = function () {
      ta.value = [
        'semaphore mutex = 1;   // 缓冲区互斥',
        'semaphore empty = N;   // 空位数',
        'semaphore full  = 0;   // 产品数',
        '',
        'Producer() {',
        '  while (1) {',
        '    x = produce();',
        '    P(empty);',
        '    P(mutex);',
        '    put(x);',
        '    V(mutex);',
        '    V(full);',
        '  }',
        '}',
        '',
        'Consumer() {',
        '  while (1) {',
        '    P(full);',
        '    P(mutex);',
        '    y = get();',
        '    V(mutex);',
        '    V(empty);',
        '    consume(y);',
        '  }',
        '}'
      ].join('\n');
    };
    run.onclick = function () {
      var res = checkPV(ta.value || '');
      $('#pvOut').innerHTML = res;
    };
  }

  function checkPV(src) {
    var lines = src.split(/\r?\n/);
    var clean = src.replace(/\/\*[\s\S]*?\*\//g, function (m) { return m.replace(/[^\n]/g, ' '); })
                   .replace(/\/\/[^\n]*/g, '');
    var decl = {}, declLine = {};
    var re = /(?:semaphore|Semaphore|int)\s+([A-Za-z_]\w*)\s*=\s*([^;,\n]+)/g, m;
    while ((m = re.exec(clean))) {
      var raw = m[2].trim();
      var num = /^-?\d+$/.test(raw) ? parseInt(raw, 10) : null;   // N、M-x、x 这类符号值先记下原文
      decl[m[1]] = { raw: raw, num: num };
      declLine[m[1]] = lineOf(clean, m.index);
    }

    var pv = [];
    var re2 = /\b(P|V|wait|signal)\s*\(\s*([A-Za-z_]\w*)\s*\)/g;
    while ((m = re2.exec(clean))) {
      var op = (m[1] === 'P' || m[1] === 'wait') ? 'P' : 'V';
      pv.push({ op: op, name: m[2], idx: m.index, line: lineOf(clean, m.index) });
    }

    var out = [];
    if (!pv.length) {
      return '<div class="rline err"><span class="ri">×</span><span>没找到任何 P/V 调用。检查一下是不是用了别的写法（只认 P(x)/V(x)/wait(x)/signal(x)）。</span></div>';
    }

    // 1 未声明
    var undecl = {};
    pv.forEach(function (x) { if (!(x.name in decl)) undecl[x.name] = 1; });
    Object.keys(undecl).forEach(function (k) {
      out.push(['err', '信号量 <code>' + k + '</code> 没有声明初值。408 阅卷里「定义信号量并说明初值」本身就是得分点。']);
    });

    // 2 声明未用
    Object.keys(decl).forEach(function (k) {
      if (!pv.some(function (x) { return x.name === k; })) {
        out.push(['warn', '声明了 <code>' + k + '</code> 却一次都没用（第 ' + declLine[k] + ' 行）。多写的信号量会让人怀疑你没读懂题。']);
      }
    });

    // 3 计数
    var cnt = {};
    pv.forEach(function (x) {
      if (!cnt[x.name]) cnt[x.name] = { P: [], V: [] };
      cnt[x.name][x.op].push(x.line);
    });
    Object.keys(cnt).forEach(function (k) {
      var P = cnt[k].P, V = cnt[k].V;
      var init = decl[k] ? decl[k].num : null;
      if (P.length > V.length) {
        out.push(['err', '<code>' + k + '</code>：P 出现 ' + P.length + ' 次、V 只有 ' + V.length + ' 次。P 多 V 少 → 资源只减不增，进程迟早全部阻塞（第 ' + P.join('、') + ' 行）。']);
      } else if (V.length > P.length) {
        out.push(['warn', '<code>' + k + '</code>：V 出现 ' + V.length + ' 次、P 只有 ' + P.length + ' 次。多出来的 V 会让信号量虚增，互斥就失效了。']);
      } else if (init === 0 && P.length && V.length) {
        out.push(['ok', '<code>' + k + '</code>：P/V 各 ' + P.length + ' 次，初值 0（典型同步信号量，一放一取，配平正确）。']);
      } else if (init === 1) {
        out.push(['ok', '<code>' + k + '</code>：P/V 各 ' + P.length + ' 次，初值 1（典型互斥锁，配平正确）。']);
      } else if (init > 1) {
        out.push(['ok', '<code>' + k + '</code>：P/V 各 ' + P.length + ' 次，初值 ' + init + '（资源计数），配平正确。']);
      } else if (init === null && decl[k]) {
        out.push(['ok', '<code>' + k + '</code>：P/V 各 ' + P.length + ' 次，配平正确；初值是符号 <code>' +
          decl[k].raw + '</code>，记得在答案里说明它由题目哪个量决定。']);
      }
    });

    // 4 初值
    Object.keys(decl).forEach(function (k) {
      var v = decl[k].num;
      if (v !== null && v < 0) out.push(['err', '<code>' + k + '</code> 初值是负数，信号量不允许。']);
      if (/mutex|lock/i.test(k) && v !== null && v !== 1) {
        out.push(['err', '名字叫 <code>' + k + '</code> 的互斥锁初值应该是 1，你写的是 ' + v + '。']);
      }
      if (v === null) {
        out.push(['ok', '<code>' + k + '</code> 的初值写成表达式 <code>' + decl[k].raw +
          '</code>，这是题目给的值，没问题——但答题时一定要写一句「它等于题目中的哪个量」。']);
      }
    });

    // 5 P(mutex) 早于 P(资源)
    var blocks = splitFuncs(clean);
    blocks.forEach(function (b) {
      var seq = pv.filter(function (x) { return x.idx >= b.start && x.idx < b.end; });
      for (var i = 0; i + 1 < seq.length; i++) {
        var a = seq[i], c = seq[i + 1];
        if (a.op === 'P' && c.op === 'P' && /mutex|lock/i.test(a.name) && !/mutex|lock/i.test(c.name)) {
          out.push(['err', '函数 <code>' + b.name + '</code> 第 ' + a.line + ' 行：先 <code>P(' + a.name + ')</code> 再 <code>P(' + c.name + ')</code>。' +
            '这是死锁的标准写法——持有互斥锁去等资源。必须把资源 P 放前面。']);
        }
      }
      // 空临界区
      if (/mutex|lock/i.test(b.text || '')) {
        var mp = (b.text.match(/P\s*\(\s*mutex\s*\)/g) || []).length;
        var mv = (b.text.match(/V\s*\(\s*mutex\s*\)/g) || []).length;
        if (mp !== mv) out.push(['err', '函数 <code>' + b.name + '</code> 里 mutex 的 P 与 V 不成对（' + mp + ' : ' + mv + '）。']);
      }
    });

    // 6 while(1)
    if (!/while\s*\(\s*(1|true)\s*\)/.test(clean) && !/for\s*\(\s*;\s*;\s*\)/.test(clean)) {
      out.push(['warn', '没看到 <code>while(1)</code> / <code>for(;;)</code>。408 的 PV 题默认进程「不断重复」，不写循环一般要扣分。']);
    }

    // 7 进程函数数
    var fns = (clean.match(/\b[A-Za-z_]\w*\s*\(\s*(?:void)?\s*\)\s*\{/g) || []).filter(function (x) {
      return !/^(if|while|for|switch)\b/.test(x);
    });
    if (fns.length < 2) out.push(['warn', '只识别到 ' + fns.length + ' 个进程函数。多进程题通常每个进程写一个函数（P1/P2/P3 或 Producer/Consumer）。']);

    // 8 临界区里没有语句
    var emptyCrit = /P\s*\(\s*mutex\s*\)\s*;?\s*V\s*\(\s*mutex\s*\)/;
    if (emptyCrit.test(clean)) out.push(['warn', '有一处 <code>P(mutex)</code> 紧跟 <code>V(mutex)</code>，中间什么都没做——临界区是空的，多半是漏写了操作。']);

    // 汇总
    var errs = out.filter(function (x) { return x[0] === 'err'; }).length;
    var warns = out.filter(function (x) { return x[0] === 'warn'; }).length;
    var oks = out.filter(function (x) { return x[0] === 'ok'; }).length;

    var h = '<div class="rline ' + (errs ? 'err' : warns ? 'warn' : 'ok') + '" style="font-weight:600">' +
      '<span class="ri">' + (errs ? '×' : warns ? '!' : '✓') + '</span><span>' +
      (errs ? '发现 ' + errs + ' 处硬伤' : warns ? '没有硬伤，但有 ' + warns + ' 处可疑' : '结构上没问题') +
      (oks ? '；' + oks + ' 个信号量配平正确' : '') + '。</span></div>';

    h += out.map(function (x) {
      var ic = x[0] === 'err' ? '×' : x[0] === 'warn' ? '!' : '✓';
      return '<div class="rline ' + x[0] + '"><span class="ri">' + ic + '</span><span>' + x[1] + '</span></div>';
    }).join('');

    h += '<div class="small dim mt8">共识别到 ' + Object.keys(decl).length + ' 个信号量、' + pv.length + ' 处 P/V 调用。</div>';
    return h;
  }
  function lineOf(s, idx) { return s.slice(0, idx).split('\n').length; }
  function splitFuncs(s) {
    var out = [], re = /([A-Za-z_]\w*)\s*\(\s*(?:void)?\s*\)\s*\{/g, m;
    while ((m = re.exec(s))) {
      if (/^(if|while|for|switch)$/.test(m[1])) continue;
      var i = m.index + m[0].length, depth = 1, j = i;
      while (j < s.length && depth > 0) {
        if (s[j] === '{') depth++;
        else if (s[j] === '}') depth--;
        j++;
      }
      out.push({ name: m[1], start: m.index, end: j, text: s.slice(i, j) });
    }
    return out;
  }

    });
    FLOWS.forEach(function (f) {
      idx.push({ type: 'flow', id: f.id, t: f.t, s: '过程推演', hay: f.t + ' ' + f.intro + ' ' + f.steps.map(function (x) { return x.t + ' ' + (x.d || []).join(' '); }).join(' ') });

  var IDX = null;
  function doSearch(q) {
    if (!IDX) IDX = buildIndex();
    var box = $('#searchResults');
    q = (q || '').trim();
    if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    var hits = IDX.filter(function (x) { return x.hay.toLowerCase().indexOf(q.toLowerCase()) >= 0; }).slice(0, 14);
    if (!hits.length) { box.innerHTML = '<div class="empty">没有匹配的内容</div>'; box.classList.remove('hidden'); return; }
    box.innerHTML = hits.map(function (x, i) {
      return '<div class="sr" data-hit="' + i + '"><div class="st">' + esc(x.t) + '</div><div class="sm">' + esc(x.s) + '</div></div>';
    }).join('');
    box.classList.remove('hidden');
    $$('.sr', box).forEach(function (el2, i) {
      el2.onclick = function () {
        var x = hits[i];
        box.classList.add('hidden');
        $('#globalSearch').value = '';
        if (x.type === 'card') {
          go('#/cards');
          setTimeout(function () {
            CF.sub = 'all'; CF.ch = 'all'; CF.st = 'all'; CF.q = '';

      };
    });
  }

  function init() {
    applyCfg();
    $('#themeBtn').onclick = toggleTheme;
    $('#fsBtn').onclick = cycleFS;
    $('#menuBtn').onclick = function () { $('#side').classList.toggle('open'); };
    document.addEventListener('click', function (e) {
      var s = $('#side');
      if (window.innerWidth <= 900 && s.classList.contains('open') && !s.contains(e.target) && e.target.id !== 'menuBtn') s.classList.remove('open');
      if (!e.target.closest || !e.target.closest('.searchbox')) $('#searchResults').classList.add('hidden');
    });
    var si = $('#globalSearch');
    var tmr = null;
    si.addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(function () { doSearch(si.value); }, 140); });
    si.addEventListener('focus', function () { if (si.value) doSearch(si.value); });

    document.addEventListener('keydown', function (e) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if (cur.name !== 'today') return;
      if (e.key === ' ') {
        e.preventDefault();
        if ($('#maskHint')) reveal();
        return;
      }
      if (e.key === '1') { var b1 = $('[data-mk="mid"]'); if (b1) b1.click(); }
      if (e.key === '2') { var b2 = $('[data-mk="ok"]'); if (b2) b2.click(); }
      if (e.key === '3') { var b3 = $('[data-mk="skip"]'); if (b3) b3.click(); }
    });

    window.addEventListener('hashchange', onRoute);
    paintBadge();
    onRoute();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
