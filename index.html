0,"t":"交接","s":"full / service","w":132,"h":44,"c":"green"}],"edges":[["cap","mut","再数"],["mut","hs","最后数"]],"cap":"所有 PV 题都能按这三类数一遍：先数容量（几个位置），再数互斥（几台设备），最后数交接（谁等谁）。三样数清，信号量就不会多也不会少。"}},{"h":"第四步　定初值","tag":"写 PV","body":["`empty = 10`（十个座位）、`mutex = 1`（一台取号机）、`full = 0`（一开始没人等）、`service = 0`（还没叫号）。","顺序上，顾客先 `V(full)` 再 `P(service)`，营业员先 `P(full)` 再 `V(service)`——这样一放一取，正好接上。"]},{"h":"第五步　查死锁：不要多加窗口锁","tag":"查死锁","body":["有的同学会想：「营业员一次只能服务一个人，是不是要加个窗口 mutex？」——**不需要**。","`service` 已经保证同一时刻只有一个顾客能走到「接受服务」这一步，营业员本身也只有一个，天然串行。多加一把锁不加分，还可能被判「信号量多余」。"],"note":"判断「要不要加锁」的标准：**同一时刻会不会有两个以上的进程碰同一个东西**。只有一个营业员、一个窗口时，答案是「不会」。"},{"h":"第六步　读题核对","tag":"核对","body":["题目要求「写出完整的过程」——两个函数都要写全，包括顾客离开时的 `V(empty)`。","顾客离开必须还座位，否则第 11 个顾客永远进不来。这是本题最隐蔽的漏点。"]}],"sems":[["empty","10","空座位数"],["mutex","1","取号机互斥"],["full","0","正在等待的顾客数"],["service","0","「叫到你了」这个信号"]],"code":["semaphore empty   = 10;   // 空座位数","semaphore mutex   = 1;    // 取号机互斥","semaphore full    = 0;    // 等待中的顾客数","semaphore service = 0;    // 叫号信号","","顾客 i() {","    P(empty);               // 有空座位才进门","    P(mutex);               // 独占取号机","    从取号机获取一个号码;","    V(mutex);","    V(full);                // 告诉营业员：多了一位等待者","    P(service);             // 等叫号","    接受服务;","    V(empty);               // 离开，空出一个座位","}","","营业员() {","    while (1) {","        P(full);            // 有人等才叫号","        叫号;","        V(service);         // 让被叫到的那位开始接受服务","        为顾客服务;","    }","}"],"traps":["给顾客加 `while(1)` —— 一位顾客只办一次业务，加了就错。","只写 `full` 不写 `service` —— 顾客不知道「轮到自己了」，全都在等一个永远不会来的信号。","再加一个「窗口互斥」信号量 —— 多余的锁，`service` 已经保证了串行。","顾客离开时忘了 `V(empty)` —— 十个座位只进不出。"]},{"id":"pv-2013-45","year":"2013","no":"45","score":"7 分","type":"限人数 · 读懂已有代码","title":"博物馆 500 人：题目已经给了互斥","keys":["K2 划掉已有的","K3 逐动作找 P"],"brief":"博物馆最多容纳 500 人，出入口一次只允许一人通过（题面已用 TSL 指令实现互斥）。要求补上信号量与 P/V。","steps":[{"h":"第一步　先划掉题面已经做的","tag":"读题","body":["这类题的陷阱不在写，而在**多写**。题面给了 `while (TSL(&lock)); … lock = FALSE;`，说明「出入口互斥」这件事已经做完了。","所以本题只剩一件事没做：**限人数**。一个信号量 `empty = 500` 就够了。"],"note":"考场上遇到「题面已给一段伪代码」的题，第一件事永远是：把已有的部分划掉，看还剩什么没做。"},{"h":"第二步　找 P 的位置：进门之前、出门之后","tag":"找前提","body":["`P(empty)` 要放在**进门之前**——名额不够就不该往里走。","`V(empty)` 要放在**真正出门之后**——参观完还没出去就还名额，馆里人数会超。","中间那段 `TSL` 是题面给的，原样保留，不要动它，也不要再包一层信号量。"]},{"h":"第三步　注意出门也要互斥","tag":"查漏","body":["题面的伪代码只画了进门那一次 TSL，但出入口是同一个，**出门也要独占**。所以要在出门处再写一次 `while (TSL(&lock)); … lock = FALSE;`。","这一点不是信号量的问题，是「读懂 TSL 语义」的问题：`lock = FALSE` 是释放，谁释放谁负责再加锁。"]},{"h":"第四步　核对信号量个数","tag":"核对","body":["全题只需要一个信号量。如果你写了两个（empty + 出入口 mutex），说明你没看懂题面已经给了互斥——虽然不算错，但和「定义尽可能少的信号量」的要求相悖。"]}],"sems":[["empty","500","馆内还能容纳的人数"]],"code":["semaphore empty = 500;      // 馆内剩余名额","","参观者 i() {","    do {","        P(empty);               // 名额够才允许进","","        while (TSL(&lock));     // 出入口互斥（题面已有）","        进门;","        lock = FALSE;","","        参观;","","        while (TSL(&lock));     // 出门也要独占出入口","        出门;","        lock = FALSE;","","        V(empty);               // 离开一人，还回一个名额","    } while (TRUE);","}"],"traps":["又加一个出入口互斥信号量 —— 题面 TSL 已经做了，重复。","只在进门加锁、出门不加 —— 出入口是同一个，两个方向都要互斥。","`V(empty)` 写在参观之前 —— 名额要在真正离开后才归还。"]},{"id":"pv-2014-47","year":"2014","no":"47","score":"8 分","type":"生产者—消费者 · 批量约束","title":"取满十件才放手","keys":["K3 闸门套在哪一层","K5 锁的粒度"],"brief":"多个生产者、多个消费者共享 1000 件容量的环形缓冲区；要求一个消费者连续取 10 件后，别的消费者才能取。","steps":[{"h":"第一步　识别骨架：标准生产者—消费者 + 一条额外约束","tag":"定角色","body":["`empty = 1000`、`full = 0`、`mutex = 1` 是骨架，先写上。","额外约束是「连续取 10 件期间不许别人插队」。这句话决定了一切。"]},{"h":"第二步　闸门套在哪一层：这是全题唯一的难点","tag":"找前提","body":["约束说的是「**一整段**」（10 件），所以锁要套在**整段外面**：`P(consumer_mutex)` 写在 `for` 循环之前，`V` 写在循环之后。","而 `mutex` 保护的是「**单次**取用」，所以要套在**循环里面**，每取一件加一次、放一次。","两者一外一内，层次不能搞混。这就是「锁的粒度」——**约束管多大，锁就管多大**。"],"table":[["信号量","管什么","套在哪一层"],["consumer_mutex","「连续 10 件」这段独占权","for 循环**外面**"],["mutex","单次取用的缓冲区互斥","for 循环**里面**"],["full / empty","产品数与空位数","每次取一件各一次"]]},{"h":"第三步　把 PV 摆进去","tag":"写 PV","body":["消费者：`P(consumer_mutex)` → for 10 次 { `P(full)`、`P(mutex)`、get、`V(mutex)`、`V(empty)` } → `V(consumer_mutex)` → consume()。","生产者：`P(empty)`、`P(mutex)`、put、`V(mutex)`、`V(full)`——和标准写法完全一样，**生产者不受这条约束影响**。"]},{"h":"第四步　为什么不能把 mutex 套在 for 外面","tag":"查死锁","body":["如果把 `mutex` 套在 for 外面，一个消费者会锁住缓冲区直到取满 10 件。一旦缓冲区里的产品不足 10 件，他就在 `P(full)` 上睡着，**却还握着 mutex**——生产者进不来放产品，`full` 永远不增加，全体死锁。","这是「持锁等待」的又一个变种，也是本题最值得记的一课：**锁的范围里不能有会阻塞的 P（资源类）**。"],"note":"口诀：**mutex 里只放「立刻能做完」的操作**。任何可能等的 P，都要放在 mutex 外面。"}],"sems":[["empty","1000","空缓冲区数"],["full","0","已有产品数"],["mutex","1","缓冲区互斥（单次）"],["consumer_mutex","1","连续取 10 件的独占权"]],"code":["semaphore empty = 1000;","semaphore full  = 0;","semaphore mutex = 1;            // 保护单次取放","semaphore consumer_mutex = 1;   // 保护「连续取 10 件」这一段","","生产者 i() {","    while (1) {","        produce();","        P(empty);","        P(mutex);","        put();","        V(mutex);","        V(full);","    }","}","","消费者 j() {","    while (1) {","        P(consumer_mutex);       // 抢「连续取 10 件」的权利（在 for 外面）","        for (k = 0; k < 10; k++) {","            P(full);","            P(mutex);            // 只锁单次取用（在 for 里面）","            get();","            V(mutex);","            V(empty);","        }","        V(consumer_mutex);       // 取满 10 件，放开闸门","        consume();               // 处理这 10 件，不碰缓冲区","    }","}"],"traps":["`P(consumer_mutex)` 放进 for 循环里 —— 每取一件就放一次闸门，「连续 10 件」失效。","把 `mutex` 套在 for 外面 —— 一次锁住 10 件的整个过程，生产者被饿死，还可能死锁。","忘记 `V(empty)` —— 缓冲区假满。"]},{"id":"pv-2015-45","year":"2015","no":"45","score":"9 分","type":"生产者—消费者 · 对称双队列","title":"两个信箱互相投递","keys":["K1 先数角色","K4 初值按「已有多少」算"],"brief":"A、B 互相从自己信箱取信、把新邮件放进对方信箱。A 信箱容量 M、初始 x 封；B 信箱容量 N、初始 y 封。","steps":[{"h":"第一步　角色是「交叉」的","tag":"定角色","body":["A 从自己的信箱取（消费 A 信箱），往 B 的信箱放（生产 B 信箱）。B 正好反过来。","所以**每个信箱都需要一对 full/empty**，一共四个信号量。看清单向关系，是本题的关键。"],"table":[["信箱","谁在放","谁在取","需要"],["A 信箱（容量 M）","B","A","fullA、emptyA"],["B 信箱（容量 N）","A","B","fullB、emptyB"]]},{"h":"第二步　初值不是 M、N，而是 M−x、N−y","tag":"定初值","body":["题目说 A 信箱里已经有 x 封，所以 `fullA = x`、`emptyA = M − x`。B 同理 `fullB = y`、`emptyB = N − y`。","这是本题最值钱的一步。很多人一看「容量 M」就写 `empty = M`，直接把「已有 x 封」这个条件丢了。"],"note":"凡是题目给了「初始已有多少个」，就要在初值里减掉。这是 PV 题里最常被忽略的送分点。"},{"h":"第三步　按动作摆 PV","tag":"写 PV","body":["A：`P(fullA)` → 取信 → `V(emptyA)` → 答题 → `P(emptyB)` → 放信 → `V(fullB)`。","B：`P(fullB)` → 取信 → `V(emptyB)` → 答题 → `P(emptyA)` → 放信 → `V(fullA)`。","注意「答题」这一段在两组 PV 之间——它不碰共享资源，应该放在外面，让两个人能并行思考。"]},{"h":"第四步　要不要加全局 mutex","tag":"查死锁","body":["不需要。A 只碰 A 信箱的「取」和 B 信箱的「放」，B 正好相反，两个人不会同时操作同一个信箱的同一个动作。","如果强行加一把全局锁把整段包起来，虽然不会错，但两个人完全串行，违背「尽可能并发」的评分口径。"]},{"h":"第五步　核对四个信号量的方向","tag":"核对","body":["一个自查办法：**每个 V 都应该在「东西变多」之后，每个 P 都应该在「需要东西」之前**。","`V(emptyA)` 出现在 A 取走信之后（A 信箱空出一格），`P(emptyA)` 出现在 B 放信之前（B 需要 A 信箱有空位）——方向就对上了。"]}],"sems":[["fullA","x","A 信箱现有邮件数"],["emptyA","M-x","A 信箱剩余空位"],["fullB","y","B 信箱现有邮件数"],["emptyB","N-y","B 信箱剩余空位"]],"code":["semaphore fullA  = x;        // A 信箱里的邮件数","semaphore emptyA = M - x;    // A 信箱剩余空位","semaphore fullB  = y;","semaphore emptyB = N - y;","","A() {","    while (1) {","        P(fullA);            // 自己的信箱里有信","        从 A 的信箱中取出一个邮件;","        V(emptyA);           // A 信箱空出一格","","        回答问题并提出一个新问题;   // 纯计算，不碰共享资源","","        P(emptyB);           // 对方信箱有空位","        将新邮件放入 B 的信箱;","        V(fullB);","    }","}","","B() {","    while (1) {","        P(fullB);","        从 B 的信箱中取出一个邮件;","        V(emptyB);","","        回答问题并提出一个新问题;","","        P(emptyA);","        将新邮件放入 A 的信箱;","        V(fullA);","    }","}"],"traps":["初值写成 M、N —— 忽略了「已有 x、y 封」，空位是 M−x、N−y。","取完忘 `V(emptyX)` —— 对方永远等不到空位，两边一起卡死。","加一个全局 mutex 把整段锁住 —— 不错但并发度差，且可能被判「信号量多余」。","把「答题」也放进临界区 —— 纯计算不该占锁。"]},{"id":"pv-2019-43","year":"2019","no":"43","score":"8 分","type":"哲学家 · 多资源同时持有","title":"哲学家不吃面，改吃米饭了","keys":["K5 破坏循环等待","K2 数清资源种类"],"brief":"n 位哲学家、m 个碗、相邻两人之间一根筷子。每人要拿两根筷子加一个碗才能就餐，要求实现同步互斥并说明如何避免死锁。","steps":[{"h":"第一步　数资源：两种资源，两种锁","tag":"定角色","body":["筷子是**每根一把锁**（n 个信号量，初值都是 1），碗是**m 个共享**（一个信号量，初值 m）。","这两类不能混：筷子是「哪根归谁」的问题，碗是「还剩几个」的问题。"]},{"h":"第二步　为什么会死锁","tag":"找问题","body":["如果每个人都「拿左筷 → 拿右筷」，一圈人同时拿到左筷后，都在等右边那根——而右边那根正在右邻手里。形成一个环，**人人持有一个、等另一个**，这就是死锁。","四个必要条件里，最容易打破的是「**循环等待**」。方法有三种：一次申请全部、奇偶编号、限制人数。"]},{"h":"第三步　选一种破法：一次申请全部","tag":"写 PV","body":["加一个 `mutex = 1`，把「拿两根筷子」这组动作包成不可分割的一步。这样一个人要么两根都拿到，要么一根都不拿，不可能「持有一根等另一根」。","顺序上，先 `P(bowl)` 再进 mutex：碗拿不到就在外面等，手里没有锁，不会拖累别人。","**千万不能反过来**——先拿锁再等碗，就是新的「持锁等待」。"],"note":"还有两个破法值得知道：奇偶编号（奇数号先左后右、偶数号先右后左）、限制人数（加一个初值 n−1 的信号量）。三种都算对，写一种并说明即可。"},{"h":"第四步　释放顺序","tag":"核对","body":["释放顺序无所谓，但建议**与申请相反**（后拿的先放），读起来更清楚。","别忘了 `V(bowl)`——漏了的话碗只减不增，m 个人吃完就再也没人能吃了。"]}],"sems":[["chopstick[n]","全 1","n 根筷子，每根一把锁"],["bowl","m","m 个碗"],["mutex","1","把「同时拿两根筷子」变成原子操作"]],"code":["semaphore chopstick[n] = {1, 1, ..., 1};   // n 根筷子","semaphore bowl = m;                        // m 个碗","semaphore mutex = 1;                       // 取筷子的原子性","","哲学家 i() {","    while (1) {","        思考;","","        P(bowl);                     // 先拿碗（等不到就在外面等）","","        P(mutex);                    // 独占「取筷子」这一步","        P(chopstick[i]);             // 左筷","        P(chopstick[(i+1) % n]);     // 右筷","        V(mutex);                    // 两根都到手，放开","","        就餐;","","        V(chopstick[i]);             // 放左筷","        V(chopstick[(i+1) % n]);     // 放右筷","        V(bowl);                     // 放碗","    }","}"],"traps":["忘了碗 —— 题目明确说「m 个碗」，漏一个资源就少一个信号量。","把 `P(bowl)` 放进 mutex 里面 —— 持锁等碗，死锁。","不加 mutex 直接拿两根筷子 —— 经典哲学家死锁，题目问「如何避免死锁」就是在提醒你。"]},{"id":"pv-2020-45","year":"2020","no":"45","score":"7 分","type":"前驱图 · 一条边一个信号量","title":"五个操作的前驱图","keys":["K6 一条边一个信号量"],"brief":"五个操作 A~E：C 必须在 A、B 之后，E 必须在 C、D 之后。用信号量实现前驱关系。","steps":[{"h":"第一步　画图：四条边","tag":"读图","body":["A→C、B→C、C→E、D→E，一共四条边。**一条边一个信号量，初值全为 0**。","所以答案是四个信号量，不是两个。这是本题唯一的坑：有人按「有几个汇合点」去数，只设 S_C 和 S_E。"]},{"h":"第二步　方向口诀：箭头从谁出来谁 V，指向谁谁 P","tag":"写 PV","body":["A→C：A 做完 `V(S_AC)`，C 开始前 `P(S_AC)`。","B→C：B 做完 `V(S_BC)`，C 开始前 `P(S_BC)`。","C→E：C 做完 `V(S_CE)`，E 开始前 `P(S_CE)`。D→E 同理。","为什么 A、B 要各一个？因为 C 需要知道「两个都完成了」。共用一个信号量的话，C 连着 P 两次会把信号量减到负数，自己把自己锁死。"]},{"h":"第三步　初值为什么是 0","tag":"定初值","body":["信号量在这里表示「这件事**已经发生了几次**」。一开始谁都没做完，所以是 0。","写完 A 就 `V` 一次变成 1，C 的 `P` 拿到这个 1，才能往下走。写成 1 就等于说「A 一开始就做完了」，前驱关系直接失效。"]},{"h":"第四步　核对","tag":"核对","body":["每个操作函数只写自己的动作加 V/P，不用套 while(1)——前驱图是一次性的。","检查：每条边是否恰好有一个 V（起点）和一个 P（终点）；有没有哪条边漏了。"]}],"sems":[["S_AC","0","A 已完成，C 可以执行"],["S_BC","0","B 已完成，C 可以执行"],["S_CE","0","C 已完成，E 可以执行"],["S_DE","0","D 已完成，E 可以执行"]],"code":["semaphore S_AC = 0, S_BC = 0, S_CE = 0, S_DE = 0;","","A() {  执行 A;  V(S_AC);  }","B() {  执行 B;  V(S_BC);  }","","C() {","    P(S_AC);      // 等 A","    P(S_BC);      // 等 B","    执行 C;","    V(S_CE);      // 通知 E","}","","D() {  执行 D;  V(S_DE);  }","","E() {","    P(S_CE);      // 等 C","    P(S_DE);      // 等 D","    执行 E;","}"],"traps":["初值写成 1 —— 前驱信号量必须是 0（事件还没发生）。","箭头方向搞反（该 P 的写成 V）—— 箭头指向谁谁 P，箭头从谁出来谁 V。","只设两个信号量 —— A 和 B 各要一个，否则分不清是谁完成了。"]},{"id":"pv-2024-46","year":"2024","no":"46","score":"8 分","type":"数锁 · 临界区判断","title":"一个缓冲区，三个操作，几把锁","keys":["K2 数锁：先问几个人碰","K5 最少信号量"],"brief":"缓冲区 B 存一个分组，C1 写入、C2 读出、C3 修改。B 空才能 C1，B 非空才能 C2 和 C3。三小问分别判断临界区、设计 P1/P2 的同步。","steps":[{"h":"第（1）问　两个进程都执行 C1，C1 是不是临界区","tag":"概念","body":["是。判断临界区的标准不是「读还是写」，而是「**这段代码会不会访问共享资源，且并发执行会不会出问题**」。","P1、P2 都往同一个 B 里写，交错执行就会互相覆盖。所以 C1 是临界区，必须互斥。","顺带把另外两个也判了：C2 是临界区（读共享 B），C3 也是（改共享 B）。三个都是。"],"note":"常见错答：「C1 只写不读，不算临界区」。写入共享资源同样要互斥——这正是出题人想抓的。"},{"h":"第（2）问　一写一读：两把锁就够","tag":"写 PV","body":["B 初始为空，P1 写一次、P2 读一次。这是一次性的先后关系，不是循环，所以**用同步信号量而不是互斥锁**。","`empty = 1` 表示「可以写」，`full = 0` 表示「可以读」。P1 先 `P(empty)` 写完 `V(full)`；P2 先 `P(full)` 读完 `V(empty)`。","为什么不再加 mutex？因为一写一读本身已经被 empty/full 排成严格先后，不可能同时发生，再加就是多余。"]},{"h":"第（3）问　两个都改：一把锁就够","tag":"写 PV","body":["B 初始非空，P1、P2 各执行一次 C3（都是修改）。两人都要动 B，**是互斥关系，没有先后**。","所以只需要 `mutex = 1`，两边各自 `P(mutex); C3; V(mutex);`。","这时候不能沿用 empty/full——它们表达的是一前一后，而这里没有先后要求。"]},{"h":"方法总结：数锁的两问","tag":"方法","body":["**第一问：同一时刻有几个人碰这块资源？** 只有一个人 → 不用锁；可能多个 → 要锁。","**第二问：他们是「必须分先后」还是「谁先谁后都行，但不能同时」？** 分先后 → 同步信号量（初值 0）；不能同时 → 互斥锁（初值 1）。","这两问一过，信号量的个数和初值就定了。"]}],"sems":[["（2）empty","1","B 为空，可写"],["（2）full","0","B 非空，可读"],["（3）mutex","1","互斥访问 B"]],"code":["// （2）B 初始为空，P1 写一次、P2 读一次","semaphore empty = 1;    // B 可写","semaphore full  = 0;    // B 可读","","P1() {  P(empty);  C1;  V(full);  }","P2() {  P(full);   C2;  V(empty); }","","","// （3）B 初始非空，P1、P2 各执行一次 C3（都是修改）","semaphore mutex = 1;","","P1() {  P(mutex);  C3;  V(mutex);  }","P2() {  P(mutex);  C3;  V(mutex);  }"],"traps":["（2）多设一个 mutex —— 一读一写已经被 empty/full 排成先后，不需要。","（3）仍设 empty/full —— B 初始非空、两个都是「改」，没有先后问题。","（1）答「不是临界区，因为只写不读」—— 写共享资源同样是临界区。"]},{"id":"pv-2017-46","year":"2017","no":"46","score":"8 分","type":"按变量分锁 · 最大并发","title":"三个线程、三个全局变量，几把锁才够","keys":["K2 数锁","K7 谁读谁写表"],"brief":"三个线程分别做 add(x,y)、add(y,z) 和一组对 z、y 的读写。要求互斥访问临界资源，且最大限度并发。","steps":[{"h":"第一步　画「谁读谁写」表","tag":"分析","body":["thread1 只读 x、y；thread2 只读 y、z；thread3 读 z、读 y，然后写 z、写 y。","**有写且被共享**的变量才需要锁：y 被三个人碰、且有写 → 要锁；z 被 thread2 读、thread3 写 → 要锁；x 只有 thread1 读 → **不用锁**。","w 是每个线程自己的局部变量，天然私有，不用锁。"],"table":[["变量","谁读","谁写","要不要锁"],["x","thread1","无","不要"],["y","thread1、thread2、thread3","thread3","要（mutex_y）"],["z","thread2、thread3","thread3","要（mutex_z）"],["w","各自线程","各自线程","不要（局部变量）"]]},{"h":"第二步　为什么不能只加一把大锁","tag":"评分点","body":["一把大锁能保证正确，但 thread1 读 x、y 的时候会把 thread2 也挡住，三线程完全串行。","题目明写「**最大限度地并发执行**」，这句话就是评分点：必须按变量分别加锁。"]},{"h":"第三步　加锁顺序必须统一","tag":"查死锁","body":["thread2 和 thread3 都要同时持有 mutex_y 和 mutex_z。如果一个人先 y 后 z、另一个人先 z 后 y，就是死锁。","规定**所有人一律先 y 后 z**，释放时逆序。这就是「资源有序分配法」。"],"note":"只要一个进程要同时持有两把以上的锁，就必须规定全局统一的申请顺序。这条规则在 PV、在数据库、在真实系统里都通用。"},{"h":"第四步　核对每个临界区","tag":"核对","body":["thread1：`P(mutex_y); w = add(x,y); V(mutex_y);`——只碰 y，只锁 y。","thread2：`P(mutex_y); P(mutex_z); w = add(y,z); V(mutex_z); V(mutex_y);`","thread3：先算局部 w（不用锁），再 `P(mutex_y); P(mutex_z);` 完成两次赋值，逆序释放。"]}],"sems":[["mutex_y","1","保护全局变量 y"],["mutex_z","1","保护全局变量 z"]],"code":["semaphore mutex_y = 1;   // 保护 y","semaphore mutex_z = 1;   // 保护 z","","thread1 {","    cnum w;","    P(mutex_y);              // x 只有自己读，不用锁","    w = add(x, y);","    V(mutex_y);","}","","thread2 {","    cnum w;","    P(mutex_y);              // 统一先 y","    P(mutex_z);              // 再 z","    w = add(y, z);","    V(mutex_z);              // 逆序释放","    V(mutex_y);","}","","thread3 {","    cnum w;","    w.a = 1;                 // w 是局部变量，不用锁","    w.b = 1;","    P(mutex_y);","    P(mutex_z);","    z = add(z, w);","    y = add(y, w);","    V(mutex_z);","    V(mutex_y);","}"],"traps":["只加一把大锁 —— 正确但并发度最差，题目明确要求「最大限度并发」。","连 x 也加锁 —— x 只有 thread1 读，锁是多余的。","加锁顺序不统一 —— 死锁。","给局部变量 w 加锁 —— 局部变量在各自栈上，不共享。"]},{"id":"pv-2021-45","year":"2021","no":"45","score":"7 分","type":"分析题 · 信号量的实现","title":"关中断能不能实现信号量","keys":["K8 原子性","K9 找那个死等"],"brief":"给出整型信号量 wait/signal 的描述，以及用开/关中断实现互斥的两种方法。问为何要互斥、两种方法是否正确、用户程序能否关中断。","steps":[{"h":"第（1）问　为什么必须互斥","tag":"概念","body":["因为 `wait(S)` 不是一条指令，而是**「检查 S > 0」+「S = S − 1」两步**。","如果两个进程同时通过检查（都看到 S = 1），然后各自减 1，S 会变成 −1，**两个进程都进了临界区**。互斥被破坏。","所以答案的关键词是「**检查与修改是两步，必须原子执行**」，只说「共享变量要保护」拿不到满分。"]},{"h":"第（2）问　方法 1 错在哪：关中断后死等","tag":"找 bug","body":["方法 1 是「关中断 → while(S ≤ 0) 空转 → 开中断」。问题在于：**关中断期间如果 S ≤ 0，进程会一直空转，而且中断是关着的**。","中断关着意味着时钟中断也进不来，这个进程永远不会被剥夺 CPU，其他进程没机会运行，也就没人来 `signal` 把 S 加回去——**死等**。","方法 2（先开中断再让出 CPU，或把「等」放到开中断之后）才是对的：让出 CPU 期间中断必须开着。"],"note":"判断这类题的口诀：**关中断只能保护「几条指令」，绝不能跨越任何可能阻塞的等待**。"},{"h":"第（3）问　用户程序能不能关中断","tag":"概念","body":["不能。开中断、关中断是**特权指令**，只能在内核态执行。用户程序执行它会触发异常（非法指令 / 特权违例）。","如果允许用户关中断，一个恶意程序就能让整个系统失去时钟、永远占着 CPU。","常见错答：「能，但效率低」——不是效率问题，是**根本不允许**。"]},{"h":"这题的方法论","tag":"方法","body":["「看代码找 bug」的题，永远只查两件事：**① 原子性有没有被破坏**（检查+修改能不能被打断）；**② 有没有人在持锁/关中断的状态下睡觉**。","这两条一过，答案就出来了。2023·45 的 swap 题考的是同一件事的硬件版本。"]}],"sems":[],"code":["// 错误示范：关中断后死等","void wait(semaphore S) {","    关中断;","    while (S <= 0);      // ← 中断关着，时钟进不来，谁也救不了它","    S = S - 1;","    开中断;","}","","// 正确思路：让出 CPU 之前必须开中断","void wait(semaphore S) {","    关中断;","    if (S > 0) { S = S - 1; 开中断; return; }","    开中断;               // 先开中断","    阻塞自己，插入等待队列; // 再睡眠，别人才能运行并 signal","}"],"traps":["第（1）问只说「共享变量要保护」—— 要点是「检查 + 修改是两步」。","第（2）问答「两种都对」—— 方法 1 会死等。","第（3）问答「能，但效率低」—— 是根本不能，特权指令。"]},{"id":"pv-2023-45","year":"2023","no":"45","score":"7 分","type":"分析题 · swap 指令实现互斥","title":"swap 指令：改两行就对了","keys":["K8 原子性","K9 找那两处错"],"brief":"给出用 swap 和 bool lock 实现临界区互斥的伪代码，要求改错（不增加语句条数），并判断能否用普通函数 newSwap 代替 swap 指令。","steps":[{"h":"第一处错：if 改成 while","tag":"改错","body":["原代码 `if (key == TRUE) swap key, lock;`——只尝试一次。如果锁被人占着，这次 swap 之后 key = TRUE，`if` 结束，程序就直接往下走进临界区了。","必须改成 `while (key == TRUE) swap key, lock;`：**反复抢，抢到为止**。","注意 swap 的语义：交换后 key 拿到的是 lock 的旧值。旧值是 FALSE 说明抢到了，循环条件不成立，退出；旧值是 TRUE 说明没抢到，继续转。"]},{"h":"第二处错：退出区的 lock = TRUE 改成 FALSE","tag":"改错","body":["本题约定 **FALSE = 空闲、TRUE = 被占**（`lock` 初始为 FALSE）。","所以离开临界区要把锁「还回去」，应该写 `lock = FALSE`。原代码写 `lock = TRUE`，等于出去时又把锁锁上了，**下一个人永远进不来**。","这两处改完，语句条数没变，符合题目「不增加语句条数」的要求。"]},{"h":"第（2）问：newSwap 能不能代替 swap 指令","tag":"概念","body":["不能。`newSwap` 是三条普通语句：`temp = *a; *a = *b; *b = temp;`。这三条之间**可以被中断**。","两个线程可能同时读到 lock = FALSE，各自以为抢到了锁，然后先后写回——**同时进入临界区**。","`swap` 是一条指令，硬件保证它不可分割；`newSwap` 是函数，中间可以切换线程。**逻辑一样，原子性不一样，这就是考点。**"],"note":"这类题的答题模板：先说「不能」，再说「因为 newSwap 由多条指令组成，执行过程中可能被中断」，最后说「破坏互斥」。三句话就满分。"},{"h":"把三次硬件互斥题串起来","tag":"串联","body":["2013·45 用 TSL（测试并设置），2023·45 用 swap（交换），2021·45 用关中断。","三者本质完全相同：**用一个不可分割的动作，一次性完成「检查 + 修改」**。区别只是原子性由谁提供——硬件指令、还是屏蔽中断。"]}],"sems":[],"code":["// 改后的正确版本（两处改动，条数不变）","bool lock = FALSE;          // FALSE = 空闲，TRUE = 被占","bool key = TRUE;","","while (key == TRUE)         // 改 1：if → while（反复抢）","    swap key, lock;         // 原子交换","临界区;","lock = FALSE;               // 改 2：TRUE → FALSE（还锁）","","","// 为什么 newSwap 不行","void newSwap(bool *a, bool *b) {","    bool temp = *a;     // ① 读 a","    *a = *b;            // ② 把 b 写进 a      ← 这中间可以被切换","    *b = temp;          // ③ 把旧 a 写进 b","}","","// 线程 1 读到 lock = FALSE","// 线程 2 也读到 lock = FALSE   ← 两人都以为自己抢到了","// 结果：同时进入临界区，互斥失效"],"traps":["只改 `if` 不改 `lock = TRUE` —— 退出不放锁，别人永远进不来。","把退出改成 `lock = TRUE` 的「反」—— 注意本题 FALSE 才是空闲。","第（2）问答「能，逻辑一样」—— 逻辑一样但原子性不一样，这正是考点。"]},{"id":"pv-2022-46","year":"2022","no":"46","score":"8 分","type":"前驱图 · 跨线程的边才要信号量","title":"两线程六操作：五条边只留两条","keys":["K6 一条边一个信号量","K10 同线程的边可省"],"brief":"T1 执行 A、E、F，T2 执行 B、C、D。约束：C 在 A、B 之后，D、E 在 C 之后，F 在 E 之后。要求用最少的信号量描述。","steps":[{"h":"第一步　先把六条约束画成图","tag":"读图","body":["A→C、B→C、C→D、C→E、E→F，共五条边。如果一条边一个信号量，需要五个。","但题目分了两个线程：T1 做 A、E、F；T2 做 B、C、D。**同一个线程内部，程序顺序本身就保证先后**，不需要信号量。"]},{"h":"第二步　删掉同线程的边","tag":"找前提","body":["E→F：都在 T1，天然先 E 后 F，**删**。C→D：都在 T2，天然先 C 后 D，**删**。","剩下三条跨线程的边：A→C（T1 到 T2）、B→C（T2 内部，但 B 在 C 之前，同线程，也可删）、C→E（T2 到 T1）。","仔细看：B→C 也在同一线程 T2 里，可以删。**真正需要信号量的只有 A→C 和 C→E 两条**。"],"table":[["边","谁到谁","同线程吗","要信号量吗"],["A→C","T1 → T2","否","要（S_AC）"],["B→C","T2 → T2","是","不要"],["C→D","T2 → T2","是","不要"],["C→E","T2 → T1","否","要（S_CE）"],["E→F","T1 → T1","是","不要"]]},{"h":"第三步　写 PV：谁先谁 V，谁后谁 P","tag":"写 PV","body":["T1：`A; V(S_AC); P(S_CE); E; F;`","T2：`B; P(S_AC); C; V(S_CE); D;`","注意 T1 里 `V(S_AC)` 必须在 A 之后、`P(S_CE)` 之前——先告诉别人「我 A 做完了」，再去等别人。顺序反了会自己把自己锁死。"],"note":"前驱图的「最少信号量」问法，答案永远是：**只给跨执行体的边设信号量**。同线程、同进程内部的边，程序顺序已经保证了。"},{"h":"第四步　核对","tag":"核对","body":["两条信号量初值都是 0。执行顺序：A、B 可以先跑（并行），C 等两者都完成，然后 D 和 E 并行，F 最后。","检查有没有给 E 加 `P(S_CD)`——E 只依赖 C，不依赖 D，加了就错。"]}],"sems":[["S_AC","0","A 已完成，C 可以执行"],["S_CE","0","C 已完成，E 可以执行"]],"code":["semaphore S_AC = 0;   // A 完成 → C 可执行","semaphore S_CE = 0;   // C 完成 → E 可执行","","T1() {","    A;","    V(S_AC);          // 告诉 T2：A 做完了","    P(S_CE);          // 等 T2 的 C","    E;","    F;                // 同线程，天然在 E 之后，不用信号量","}","","T2() {","    B;","    P(S_AC);          // 等 T1 的 A","    C;","    V(S_CE);          // 告诉 T1：C 做完了","    D;                // 同线程，天然在 C 之后","}"],"traps":["给 E 加 `P(S_CD)` —— 图上 E 只依赖 C，不依赖 D。","只设一个 S_C 让 A、B 共用 —— 分不清是谁完成，且 P 两次会锁死。","漏掉 S_CE —— E 可能在 C 之前就跑，前驱关系被破坏。","把五条边都设信号量 —— 不算错，但题目问「最少」，同线程的边必须省。"]},{"id":"pv-2025-45","year":"2025","no":"45","score":"8 分","type":"流水线同步 + 工具互斥","title":"三人植树：四把锁管一条流水线","keys":["K1 先数角色","K2 数锁：只给多人用的工具"],"brief":"甲乙丙依次挖坑、放苗填土、浇水。铁锹一把（挖坑和填土共用），水桶一个。坑数小于 3 时甲才能挖。定义尽可能少的信号量。","steps":[{"h":"第一步　画出流水线","tag":"定角色","body":["挖坑 → 放苗 → 填土 → 浇水。注意「放苗」和「填土」都是乙做，所以乙这一段是两步。","三个交接点：坑好了给乙、树种好了给丙、浇完水坑位释放。**每个交接点一个同步信号量**。"]},{"h":"第二步　数工具：只给一个人用的不设锁","tag":"找前提","body":["铁锹：甲挖坑用、乙填土也用 → **两个人共用，要 mutex**。","水桶：只有丙浇水用 → **只一个人用，不要锁**。","这就是「尽可能少」的落点。多设一把水桶锁，直接违背题意。"],"note":"判断要不要锁，只问一句：**同一时刻会不会有两个人想用它？** 只有一个人用，锁就是多余的。"},{"h":"第三步　「坑数小于 3」怎么落地","tag":"写 PV","body":["这是容量约束，用 `empty = 3` 表示「还能挖几个坑」。甲每次挖之前 `P(empty)`。","丙浇完水之后 `V(empty)`——这个坑彻底用完了，空出一个名额。**这一句最容易漏**，漏了甲挖满 3 个就永久停摆。","注意不是乙填完土就 `V(empty)`：树还在坑里，坑还没「用完」。"]},{"h":"第四步　写三个进程","tag":"写 PV","body":["甲：`P(empty); P(mutex); 挖坑; V(mutex); V(full);`","乙：`P(full); 放苗; P(mutex); 填土; V(mutex); V(tree);`","丙：`P(tree); 浇水; V(empty);`","乙的「放苗」不需要铁锹，所以放在 `P(mutex)` 之前，能省一点锁的占用时间。"],"fig":{"kind":"graph","w":660,"h":210,"nodes":[{"id":"a","x":92,"y":80,"t":"甲 挖坑","s":"铁锹","w":104,"h":44,"c":"blue"},{"id":"b","x":330,"y":80,"t":"乙 放苗 + 填土","s":"填土也要铁锹","w":150,"h":44,"c":"gold"},{"id":"c","x":570,"y":80,"t":"丙 浇水","s":"水桶只他用","w":108,"h":44,"c":"green"}],"edges":[["a","b","full"],["b","c","tree"],["c","a","empty（坑位回收）","rust",true]],"cap":"这是一条流水线：每个交接点一个同步信号量，每件「多人共用的工具」一个 mutex。水桶只有丙用，给它加锁就是多余——题目要「尽可能少」。"}},{"h":"第五步　查死锁","tag":"查死锁","body":["甲的 `P(mutex)` 在 `P(empty)` 之后——正确。反过来就是「握着铁锹等坑位」，而丙要浇完水才释放坑位，丙又在等树，乙在等坑……整条链锁死。","乙的 `P(mutex)` 在 `P(full)` 之后——同理。"]}],"sems":[["empty","3","还能挖的坑数（坑 < 3）"],["full","0","已挖好、待放苗的坑数"],["tree","0","已种好、待浇水的树数"],["mutex","1","铁锹（甲、乙共用）"]],"code":["semaphore empty = 3;   // 还能挖几个坑","semaphore full  = 0;   // 已挖好、等放苗的坑","semaphore tree  = 0;   // 已种好、等浇水的树","semaphore mutex = 1;   // 铁锹（甲和乙共用；水桶只有丙用，不设锁）","","甲() {","    while (1) {","        P(empty);          // 坑还不到 3 个","        P(mutex);          // 拿铁锹","        挖树坑;","        V(mutex);          // 放回铁锹","        V(full);           // 多了一个待放苗的坑","    }","}","","乙() {","    while (1) {","        P(full);           // 等一个挖好的坑","        放树苗入坑;         // 不用铁锹","        P(mutex);          // 填土要铁锹","        填土;","        V(mutex);","        V(tree);           // 多了一棵待浇水的树","    }","}","","丙() {","    while (1) {","        P(tree);           // 等一棵种好的树","        浇水;","        V(empty);          // 这个坑用完了，空出一个名额","    }","}"],"traps":["给水桶也设一个 mutex —— 只有丙用，多余的锁要扣分。","忘了 `V(empty)` —— 坑永远是 3 个满的，甲很快停摆。","把 `P(mutex)` 写在 `P(empty)` 前面 —— 死锁。","让乙填完土就 `V(empty)` —— 树还在坑里，坑还没用完。"]},{"id":"sch-2016-46","year":"2016","no":"46","score":"7 分","type":"调度 · 定性分析（饥饿）","title":"静态优先数为什么会饿死进程","keys":["K11 饥饿三招"],"brief":"调度器选优先数最小的进程运行，priority = nice（用户指定、静态）。引入 cpuTime 与 waitTime，问为什么会饥饿、如何设计动态优先数。","steps":[{"h":"第（1）问　为什么会饥饿","tag":"概念","body":["因为 `priority = nice` 是**静态**的：一个进程一旦被用户指定了较大的 nice（优先级低），它永远不会变。","只要系统里不断有 nice 更小的进程到达，这个低优先级进程就永远排不上队——**无限期等待**，这就是饥饿。","答题要点是两个词：**静态**（不随等待改善）+ **不断有新进程到达**。只说「不公平」拿不到分。"]},{"h":"第（2）问　设计动态优先数","tag":"设计","body":["关键：本题**优先数越小越优先**。所以等待时间要让它**变小**，运行时间要让它**变大**。","一个可用的式子：`priority = nice + cpuTime − waitTime`。","含义：跑得越久（cpuTime 大）优先级越低，防止一个进程长期霸占 CPU；等得越久（waitTime 大）优先级越高，这就是 **aging（老化）**。","waitTime 的作用就是**兜底**：无论 nice 多差，只要等得够久，总会被抬到能运行的位置，饥饿被彻底消除。"],"note":"注意方向：如果题目是「优先数越大越优先」，式子就要反过来写成 `nice − cpuTime + waitTime`。先看清题目约定，再写公式。"},{"h":"两条更新规则的意义","tag":"补充","body":["执行态：cpuTime +1、waitTime 清 0；就绪态：cpuTime 清 0、waitTime +1。","这两条是**互斥**的：一个进程要么在跑（积累 cpuTime），要么在等（积累 waitTime），不可能同时。","这样设计的效果是：**刚跑过的进程优先级会降下来，久等的进程优先级会升上去**，系统自动趋向公平。"]}],"sems":[],"code":["// 优先数越小越优先","priority = nice + cpuTime - waitTime;","","// 执行态：cpuTime++ ; waitTime = 0","// 就绪态：cpuTime = 0 ; waitTime++","","// waitTime 的系数越大，老化越快，公平性越好，但响应可能变慢"],"traps":["第（1）问只说「不公平」不说机制 —— 要点是「静态、不随等待改善」。","第（2）问把 waitTime 写成加分（nice + waitTime）—— 本题优先数越小越优先，等待要让它变小。","忘了说明两条更新规则的意义 —— cpuTime 与 waitTime 是互斥的。"]},{"id":"sch-2023-46","year":"2023","no":"46","score":"8 分","type":"系统调用 · 排顺序","title":"一次键盘输入，六个操作的先后","keys":["K12 三态转换"],"brief":"进程 P 通过系统调用从键盘读一个字符。给出六个操作，问正确顺序、何时切换 CPU、哪段属于驱动程序、中断处理时 P 的状态与 CPU 态。","steps":[{"h":"第一步　把六个操作按因果排好","tag":"排序","body":["用户在键盘输入（⑥）→ 键盘控制器把字符读入系统缓冲区（③）→ 启动键盘中断处理程序（④）→ 把 P 插入就绪队列（①）→ 从系统调用返回（⑤）。","还有一个 ②「把 P 插入阻塞队列」，它发生在**用户按键之前**：P 发起系统调用，发现缓冲区没数据，主动阻塞。","所以完整顺序是：**② → ⑥ → ③ → ④ → ① → ⑤**。"],"table":[["序号","操作","位置"],["②","P 插入阻塞队列","最先：请求不到数据，主动让出"],["⑥","用户按键","外部事件"],["③","字符读入系统缓冲区","设备驱动 / 控制器"],["④","启动键盘中断处理程序","中断到来"],["①","P 插入就绪队列","被唤醒"],["⑤","P 从系统调用返回","最后：回到用户态"]]},{"h":"第一问　① 的前后是谁","tag":"排序","body":["① 的前一个是 ④（中断处理程序里唤醒 P），后一个是 ⑤（返回用户态）。","⑥ 的后一个是 ③（按键产生扫描码，控制器把它读进缓冲区）。"]},{"h":"第二问　什么时候一定切走、什么时候才能被选中","tag":"概念","body":["**②之后 CPU 一定切换到其他进程**：P 主动阻塞，必须让出 CPU。","**①之后调度程序才能选中 P**：只有进了就绪队列，才有被调度的资格。注意「进入就绪队列」和「被调度执行」是两件事。","⑤ 是从系统调用返回，不是切走——别搞混。"]},{"h":"第三、四问　驱动与状态","tag":"概念","body":["③（把字符读入系统缓冲区）属于**设备驱动程序**的工作。④ 是中断处理程序，属于内核的中断处理部分。","键盘中断处理程序执行时，P 处于**阻塞态**——它还没被唤醒（唤醒发生在 ④ 里面），更没到就绪。","CPU 处于**内核态**——中断处理一律在内核态执行。"],"note":"这题最容易错的两处：把 P 的状态答成「就绪」（错，还在阻塞）、把 ⑤ 当成切换点（错，⑤ 是返回）。"}],"sems":[],"code":["运行态 ──②──> 阻塞态 ──①──> 就绪态 ──调度──> 运行态","         (主动让出)      (被唤醒)        (⑤ 返回用户态)","","完整顺序：② → ⑥ → ③ → ④ → ① → ⑤"],"traps":["把 ② 排在 ⑥ 之后 —— 进程是先请求、发现没数据才阻塞，阻塞发生在用户按键之前。","第二问答「⑤ 之后切换」—— ⑤ 是返回，不是切走。","第四问答 P 处于就绪态 —— 中断程序还没唤醒它，仍是阻塞态。"]},{"id":"sch-2026-45","year":"2026","no":"45","score":"7 分","type":"调度 · 优先权 + 时间片定量推演","title":"优先权 + 时间片：一次推到底","keys":["K13 画时间轴表"],"brief":"优先权大者优先，时间片 50ms，每 10ms 一次时间中断且只有中断时才能抢占。时间片用完优先权减 1，被抢占则不变。四个进程，求中断次数、调度次数、首次调度时刻。","steps":[{"h":"第一步　先把规则抄成三条","tag":"读题","body":["**① 只有时间中断（每 10ms）那一刻才可能切换**，进程到达本身不能立刻抢占。","**② 优先权大者优先；相等时先到先服务（先进入就绪队列的优先）**。","**③ 时间片用完 → 优先权减 1；被更高优先级抢占 → 优先权不变**。","这三条是全部规则。第三条最容易混——「用完」和「被抢」的结果不一样。"]},{"h":"第二步　画时间轴表","tag":"方法","body":["一行一个中断时刻（10、20、30……），列四栏：**新到达 / 谁时间片用完 / 谁被抢占 / 谁上 CPU**。","每 10ms 填一行，填完再数。不要试图「心算全过程」——这类题 90% 的错都是漏了一个中断点。","填表时随时维护三样东西：就绪队列（按优先权排序）、每个进程剩余时间、当前占用者已运行多久。"],"note":"「优先权 + 时间片」是 2026 年首次出现在大题里的混合调度。做法固定：**画表，不要心算**。"},{"h":"第三步　回答「第一次调度时刻」","tag":"答题","body":["题目问「P1~P4 各自第一次被调度的时刻」。注意是**第一次**，不是完成时刻。","一个进程可能很晚才第一次被调度（一直有更高优先级的在前面），也可能刚到就被调度（当时它优先级最高）。","逐个查表里「谁上 CPU」那一栏，第一次出现该进程的那一行就是答案。"]},{"h":"第四步　第二问：变大还是变小","tag":"分析","body":["**时间片 50 → 100ms**：每个进程一次能跑更久，切换次数自然**减少**，CPU 调度次数减少。","**中断间隔 10 → 1ms**：单位时间内中断次数变成 10 倍，每次中断都要进内核做现场保存、调度判断，**系统开销增大**。","这两问考的是「时间片与开销的权衡」：时间片太小 → 切换太频繁、开销大；时间片太大 → 退化成先来先服务、响应变差。"]}],"sems":[],"code":["规则三条：","  1. 只有时间中断（每 10ms）才能抢占","  2. 优先权大者优先；相等则先进入就绪队列者优先","  3. 时间片用完 → 优先权 -1；被抢占 → 优先权不变","","做法：画表","  时刻 | 新到达 | 时间片用完 | 被抢占 | 上 CPU","  10   |   ...  |     ...    |   ...  |  ...","  20   |   ...  |     ...    |   ...  |  ...","  ...","","数「上 CPU」栏的变化次数 = 调度次数","数表行数（到最后一个进程结束）= 中断次数"],"traps":["以为进程一到达就能抢占 —— 只有时间中断那一刻才能抢。","把「优先权大」记成「优先权小者优先」—— 本题是大者优先。","时间片用完和被抢占的优先权变化搞混 —— 用完减 1，被抢不变。","把「第一次调度时刻」答成「完成时刻」。"]}]},"instr":{"method":[{"n":"1","h":"量字段：先把三个数钉死","q":"指令字长几位？地址码几位？寄存器几个？","body":["指令格式题永远从这三个数开始：**指令字长 L**、**地址码（或立即数）字段宽度 A**、**寄存器编号位数 R**。","它们之间只有一条等式：**L = 操作码位数 + 各字段宽度之和**。题目给三个、留一个空，就是要你解这个等式。","第四个常用关系是「**n 位字段最多表示 2ⁿ 种**」：操作码 4 位 → 16 条指令；寄存器编号 3 位 → 8 个寄存器；地址码 12 位 → 4K 个单元。凡是问「最多多少」，答案一定是 2 的幂。"],"note":"别急着算。先把「字长、编址单位、地址线宽度、数据线宽度」四个词在题干里圈出来，它们各自决定不同的位数。"},{"n":"2","h":"切段：按题目给的格式切开","q":"这条 16 位（或 32 位）从头到尾怎么分？","body":["题干一定会给一张字段表（哪怕是图）。照着它把二进制串从左到右切开，**每段各管一件事**，不要混。","切之前先判格式：看**第一个字段**落在哪。比如 2026·43 里 R 型固定以 0000 开头，所以前 4 位是 0000 就是 R 型，是 0100 就是 I 型，是 1110/1111 就是 M 型。","切完立刻做一件事：**把每段的值写下来**（寄存器号、操作码、立即数），再翻译成「谁加谁、存到哪」。这一步做完，机器码题就变成填空题了。"],"note":"最容易错的是**段序**。题目写「源操作数在前、目的在后」时，Rs 在 Rd 前面；反过来就容易把 Rs 和 Rd 填反。"},{"n":"3","h":"译码：机器码 ⇄ 汇编双向翻译","q":"这串 0/1 在做什么？反过来这条指令的码是什么？","body":["正向（机器码 → 汇编）：切段 → 查操作码表 → 查寄存器号 → 套功能模板（`R[rd] ← R[rs] op R[rt]`）。","反向（汇编 → 机器码）：先确定格式 → 逐段填二进制 → 按 4 位一组写成十六进制。","**两个方向都要练**。408 既考「01B2H 是什么指令」，也考「add (R4),(R5)+ 的机器码是多少」。","写十六进制时按 4 位一组断开再合并，比直接心算可靠得多：`0010 0011 0001 0101` → `2315H`。"],"note":"负数立即数要先转补码：−5 → 1111 1011。写成 0000 0101 就变成 +5 了，这是最高频的低级错误。"},{"n":"4","h":"算地址：相对寻址是重灾区","q":"目标地址到底从哪儿开始加？","body":["所有寻址方式的公式只有一条要背死：**相对寻址 EA = (PC) + 位移量，而这里的 PC 已经指向下一条指令**。","所以「偏移量 = 目标地址 − （本条指令地址 + 本条指令长度）」。**先加长度，再谈偏移**，顺序不能反。","变址寻址是另一套：**EA = 变址寄存器 + 形式地址**，形式地址通常就是数组首地址，变址寄存器里是下标×元素字节数。看到 `[ecx + edx*4 + 0042200H]`，就要能立刻翻译成 `a[i][j]`。","地址算完，别忘了看**编址单位**：按字节编址时相邻 int 差 4，按字编址时差 1。2026·43 的最后一个空就栽在这里。"],"note":"口诀：**相对看下一条，变址看数组，基址看程序，立即数不用算**。"}],"problems":[{"id":"in-2010-43","year":"2010","no":"43","score":"11 分","type":"指令格式 + 寻址方式 + 自增","title":"把一条 add 指令拼成 16 位机器码","brief":"16 位字长、128KB 主存、按字编址，指令分 OP/Ms/Rs/Md/Rd 五段。问指令条数、寄存器个数、MAR/MDR 位数、转移范围，以及 add (R4),(R5)+ 的机器码与执行结果。","given":["字长 16 位，主存 128KB，**按字编址**，单字长指令。","字段划分：OP(15-12) | Ms(11-9) | Rs(8-6) | Md(5-3) | Rd(2-0)。","源操作数在前、目的操作数在后；转移指令用相对寻址，偏移量用补码。","寻址方式：000 寄存器直接、001 寄存器间接、010 寄存器间接自增、011 相对。"],"ask":[{"q":"最多多少条指令？多少通用寄存器？MAR、MDR 各几位","a":["四个数，四个「2 的幂」，但要先看清各自由谁决定。","**指令条数**：OP 占 4 位 → 2⁴ = **16 条**。**通用寄存器**：Rs/Rd 各 3 位 → 2³ = **8 个**。","**MAR**：主存 128KB，但题目说**按字编址**，一个字 16 位 = 2B，所以地址个数 = 128KB ÷ 2B = 64K = 2¹⁶ → **16 位**。","**MDR**：一个存储字就是一个字长 → **16 位**。"],"table":[["问什么","由什么决定","计算","答案"],["最多指令条数","OP 4 位","2⁴","16 条"],["通用寄存器个数","编号 3 位","2³","8 个"],["MAR 位数","128KB、按字编址","128KB ÷ 2B = 64K = 2¹⁶","16 位"],["MDR 位数","存储字 = 字长","—","16 位"]],"note":"MAR 这问是全题最容易翻车的地方：按字节编址才是 128K = 2¹⁷，按字编址只有 64K。题目明写了「按字编址」。"},{"q":"转移指令的目标地址范围","a":["先找**偏移量存在哪里**。看格式：OP/Ms/Rs/Md/Rd，**根本没有 OFFSET 字段**——偏移量整个放在 Rn 里。","而 Rn 是 16 位寄存器，存补码，所以范围由寄存器的位宽决定，**不由指令字长决定**。","16 位补码：−32768 ~ +32767。所以目标地址范围是 **(PC) − 32768 ~ (PC) + 32767**（按字编址，单位是字）。"],"note":"对比：2013·44 的偏移量是指令里的 8 位字段，范围就是 −128~+127。**先找偏移量在哪，再谈范围。**"},{"q":"add (R4),(R5)+ 的机器码","a":["逐段填：OP = 0010（题目说 0010 是 add）；源是 (R4) → 寄存器间接 → Ms = 001，Rs = 100；目的是 (R5)+ → 寄存器间接自增 → Md = 010，Rd = 101。","按 4+3+3+3+3 拼：`0010 001 100 010 101` = `0010 0011 0001 0101` = **2315H**。"],"code":["OP    Ms   Rs   Md   Rd","0010  001  100  010  101","└─4─┘└3┘ └3┘ └3┘ └3┘","0010 0011 0001 0101  =  2315H"],"note":"Md 在 Rd 前面。把目的操作数的寻址方式 010 填到 Rd 那一格，就会拼出 2313H 之类的错答案。","fig":{"kind":"bits","w":660,"showBits":true,"unit":26,"segs":[{"t":"OP","bits":4,"v":"0010","c":"rust"},{"t":"Ms","bits":3,"v":"001","c":"blue"},{"t":"Rs","bits":3,"v":"100","c":"blue"},{"t":"Md","bits":3,"v":"010","c":"green"},{"t":"Rd","bits":3,"v":"101","c":"green"}],"foot":"add (R4), (R5)+ → 0010 001 100 010 101 = 2315H","cap":"源在前、目的在后：Ms/Rs 是源，Md/Rd 是目的。Md 填 010（间接自增）而不是 001，填错这一格整条机器码就废了。"}},{"q":"执行后哪些寄存器和单元会变？变成什么","a":["先把两个操作数取出来：源 (R4) = ((R4)) = (1234H) = **5678H**；目的 (R5)+ = ((R5)) = (5678H) = **1234H**。","相加：5678H + 1234H = **68ACH**，写回**目的操作数所在的存储单元**，即地址 5678H。","再处理自增：目的寄存器 R5 加 1 → 5678H + 1 = **5679H**。","所以一共两处变化：**R5：5678H → 5679H**；**存储单元 5678H：1234H → 68ACH**。","注意源操作数 (R4) 只是读了一下，R4 和 1234H 单元都不变——自增是**目的寄存器**的动作。"],"note":"执行顺序：**先取数 → 再运算 → 再自增 → 最后写回**。自增不影响本次取到的值。"}],"traps":["MAR 算成 17 位 —— 按字编址，128KB ÷ 2B = 64K 字，16 位就够。","机器码拼成 2314H 或 2715H —— 段序是 OP-Ms-Rs-Md-Rd，Md=010 别填到 Rd 上。","忘了 R5 自增 —— (Rn)+ 的「+」就是题目给的提示，漏答扣一半分。","把 68ACH 写回 R5 —— 结果写回的是**目的操作数所在单元**（5678H），不是寄存器。"]},{"id":"in-2013-44","year":"2013","no":"44","score":"11 分","type":"标志位 + PC 计算 + 数据通路","title":"条件转移：C、Z、N 三个检测位怎么用","brief":"16 位定长指令、格式为 OP(5)|C|Z|N|OFFSET(8)。检测位为 1 表示要检测对应标志，任一为 1 则转移。问编址方式、最大后跳条数、两次 PC 计算、无符号小于等于的检测位、数据通路部件。","given":["16 位定长指令字，标志寄存器含 CF、ZF、NF。","格式：OP(15-11)=00000 | C | Z | N | OFFSET(7-0，补码)。","转移条件：被检测的标志位中只要有一个为 1 就转移。","转移时 目标 = (PC) + 2 + 2×OFFSET；顺序执行时下一条 = (PC) + 2。"],"ask":[{"q":"按字节还是按字编址？向后最多跳多少条指令","a":["从公式反推：顺序执行时「下一条指令地址 = (PC) + 2」，而指令字是 16 位 = 2B。PC 一次加 2 个**地址单位**，正好等于一条指令的字节数 → **按字节编址**。","OFFSET 是 8 位补码，范围 −128 ~ +127。目标 = (PC) + 2 + 2×OFFSET。","取 OFFSET = −128：目标 = (PC) + 2 − 256 = (PC) − 254。从下一条指令 (PC)+2 到 (PC)−254，跨度 256B = 128 条指令的位置，扣掉目标自身，**最多跳过 127 条**。"],"note":"「跳多少条」和「跳多少字节」是两个问法。问条数就要除以指令长度（2B），并把目标自身扣掉。"},{"q":"两次 PC 计算：CF=0,ZF=0,NF=1 与 CF=1,ZF=0,NF=0","a":["指令的检测位是 C=0、Z=1、N=1 → **只检测 ZF 和 NF**，CF 不参与。","OFFSET = 11100011B，最高位 1 是负数，取反加一：00011100 + 1 = 00011101 = 29，所以 OFFSET = **−29**。","**情况一**：ZF=0、NF=1 → 有一个为 1 → **转移**。PC = 200CH + 2 + 2×(−29) = 200EH − 3AH = **1FD4H**。","**情况二**：ZF=0、NF=0 → 都不为 1 → **不转移**，顺序执行：PC = 200CH + 2 = **200EH**。"],"code":["情况一：","PC = 200CH + 2 + 2 * (-29)","   = 200CH + 2 - 58","   = 200EH - 003AH","   = 1FD4H","","情况二：不转移","PC = 200CH + 2 = 200EH"],"note":"「不转移」也是一种答案，而且很多人只算转移那一种，白白丢一半分。","fig":{"kind":"bits","w":660,"showBits":true,"unit":28,"segs":[{"t":"OP","bits":5,"v":"00000","c":"rust"},{"t":"C","bits":1,"v":"0","c":"blue"},{"t":"Z","bits":1,"v":"1","c":"blue"},{"t":"N","bits":1,"v":"1","c":"blue"},{"t":"OFFSET","bits":8,"v":"1110 0011","c":"green"}],"foot":"检测位 C=0、Z=1、N=1 → 只检测 ZF 与 NF；OFFSET = 1110 0011B = −29","cap":"检测位为 1 表示「要检测这个标志」，任一被检测的标志为 1 就转移。所以先看检测位挑标志，再看标志决定转不转，最后才代公式算 PC。"}},{"q":"无符号数「小于等于」时转移，C/Z/N 各是什么","a":["无符号比较 a ≤ b 只有两种情况：**a < b**（做 a−b 有借位 → CF=1）或 **a = b**（结果为零 → ZF=1）。","所以条件就是「CF = 1 **或** ZF = 1」，正好匹配「被检测位中有一个为 1 就转移」的规则。","答案：**C = 1、Z = 1、N = 0**。","N（符号标志）在无符号比较里毫无用处——无符号数没有「负」的概念。凡是「无符号」比较，NF 一律不检测。"],"table":[["情况","哪个标志","为什么"],["a < b","CF = 1","a−b 有借位"],["a = b","ZF = 1","结果为零"],["a ≤ b","CF = 1 或 ZF = 1","上面两种取并"]]},{"q":"数据通路上 ①~③ 是什么部件","a":["顺着信号流走：指令取出后先放进 ①；OFFSET 字段送符号扩展器；扩展结果存进 ②；因为公式里有 2×OFFSET，② 的内容要经过 ③ 再进加法器；加法器另一个输入是 PC。","① **指令寄存器 IR**（存放整条指令，C/Z/N 送检测电路、OFFSET 送扩展）。","② **偏移量寄存器**（存符号扩展后的 OFFSET）。","③ **移位器（左移 1 位）**，实现 2×OFFSET。"],"note":"判断技巧：加法器前面多出来的那个框，一定在做「×2」——硬件乘 2 就是左移一位。公式里写着什么，图上就有什么。"}],"traps":["编址方式答「按字」—— (PC)+2 是按字节加的，16 位指令占 2 字节。","把 11100011B 当 227 直接乘 2 —— 必须先按补码还原成 −29。","无符号比较把 N 也设成 1 —— 符号位与无符号比较无关。","只算「转移」那一种情况 —— 题目问的是「两次 PC 值」。"]},{"id":"in-2021-43","year":"2021","no":"43","score":"10 分","type":"指令格式 + 溢出 + 扩展","title":"R/I/J 三种格式，一套 16 位怎么分","brief":"16 位字长、按字节编址、地址线 20 位、数据线 8 位、16 位定长指令。R 型为 000000 + rs + rt + rd + op1，I 型为 op2 + rs + rt + imm6，J 型为 op3 + target10。问 ALU 宽度、寻址空间、IR/MAR/MDR、可定义操作数、01B2H 的功能与结果、imm 扩展方式、无条件转移用哪种格式。","given":["字长 16 位，按字节编址，地址线 20 位，数据线 8 位，16 位定长指令字。","R 型：000000(6) | rs(2) | rt(2) | rd(2) | op1(4)。","I 型：op2(6) | rs(2) | rt(2) | imm(6)。","J 型：op3(6) | target(10)。"],"ask":[{"q":"ALU 宽度、可寻址空间、IR/MAR/MDR 各几位","a":["**ALU 宽度 = 字长 = 16 位**（一次运算处理一个字的位数）。","**可寻址空间**由地址线决定：2²⁰ = **1MB**。","**IR** = 定长指令字长 = **16 位**；**MAR** = 地址线条数 = **20 位**。","**MDR = 数据线条数 = 8 位**，不是 16 位！虽然字长 16 位，但总线一次只送 8 位，取一条指令要两次。"],"note":"MDR 跟数据线走，不跟字长走。这题给了数据线 8 位就答 8 位；2010·43 没给总线宽度，才按存储字（16 位）算。**题目给谁就听谁的。**"},{"q":"R 型最多几种操作？I 型和 J 型合计多少种？寄存器几个","a":["R 型的前 6 位被 000000 占了，**操作码只剩 op1 的 4 位** → 2⁴ = **16 种**。","I 型的 op2 是 6 位 → 64 种；J 型的 op3 也是 6 位 → 64 种。两者前 6 位不重叠，合计 **128 种**。","寄存器编号 2 位 → 2² = **4 个**。"],"note":"R 型那 6 位 000000 是「格式标志」，不是操作码的一部分。把它算进操作码就会答成 2¹⁰ = 1024 种。","fig":{"kind":"bits","w":660,"showBits":true,"unit":26,"segs":[{"t":"格式","bits":6,"v":"000000","c":"gray"},{"t":"rs","bits":2,"v":"2 位","c":"blue"},{"t":"rt","bits":2,"v":"2 位","c":"blue"},{"t":"rd","bits":2,"v":"2 位","c":"green"},{"t":"op1","bits":4,"v":"操作码","c":"rust"}],"foot":"R 型：前 6 位固定 000000，真正的操作码只剩 op1 的 4 位 → 最多 16 种操作","cap":"最容易错的一问：R 型能定义多少种操作？不是 2¹⁰，而是 2⁴——那 6 位 000000 是格式标志，不参与操作码。寄存器编号 2 位 → 只有 4 个寄存器。"}},{"q":"01B2H 是什么指令？R3 变成什么？溢出吗","a":["01B2H = `0000 0001 1011 0010B`。前 6 位 = 000000 → **R 型**。按 6+2+2+2+4 切：","`000000 | 01 | 10 | 11 | 0010` → rs=1、rt=2、rd=3、op1=0010（减法）。功能：**R[3] ← R[1] − R[2]**。","R1 = B052H：最高位 1 是负数，取反加一得 4FADH = 20397，所以真值 = **−20398**。R2 = 8。","减法：−20398 − 8 = **−20406**，在 −32768~32767 内，**不溢出**。机器数 = 65536 − 20406 = 45130 = **B04AH**。","换成 01B3H 时 op1 = 0011 是乘法：−20398 × 8 = **−163184**，远超 16 位范围，**溢出**；寄存器里只剩低 16 位 **8270H**。"],"code":["01B2H = 000000 01 10 11 0010","        └ 6 ┘ └2┘└2┘└2┘└4┘","        格式  rs rt rd  op1","             =1 =2 =3 =0010(减法)","","R1 = B052H = -20398","R1 - 8 = -20406      → 不溢出，结果 B04AH","R1 * 8 = -163184     → 溢出，低 16 位 8270H"],"note":"溢出看**真值**装不装得下，不看寄存器里剩下什么。乘法的低 16 位看起来「很正常」，但真值早就飞出去了。"},{"q":"imm 应该零扩展还是符号扩展","a":["题目说 imm 是**带符号整数**，意味着它可能是负数（往低地址访问）。","6 位扩展成 16 位时，必须**符号扩展**：负数高位补 1、正数高位补 0，这样**数值不变**。","零扩展会把 111111B（真值 −1）变成 63，地址直接算错。","一句话：**有符号 → 符号扩展；无符号/逻辑值 → 零扩展。**"]},{"q":"无条件转移用哪种格式","a":["**J 型**。它的功能就是「PC 的低 10 位 ← target」，不需要检测任何标志位——这正是「无条件」的含义。","I 型的条件转移必须依赖标志位；R 型是 ALU 运算，与转移无关。所以只能选 J 型。"]}],"traps":["MDR 答 16 位 —— 数据线 8 位就答 8 位。","R 型操作数算成 1024 —— 前 6 位 000000 是格式标志，操作码只有 4 位。","乘法答 8270H 并说不溢出 —— 先看真值 −163184 装不装得下。","imm 答零扩展 —— 带符号偏移量必须符号扩展。"]},{"id":"in-2026-43","year":"2026","no":"43","score":"10 分","type":"用指令格式反推代码","title":"R/I/M 三种格式，四个空怎么填","brief":"16 位计算机、按字编址、R0~R15、地址 16 位。R 型 0000|rt|rs|op1，I 型 op2|rt|imm8，M 型 op3|offset12。问存储单元与寄存器宽度、操作码能否相同、一条 R 型指令的执行结果、y=16x−5 的四个空。","given":["按字编址，通用寄存器 R0~R15（编号 0~15），存储器地址 16 位，定长指令字。","R 型：0000(4) | rt(4) | rs/num(4) | op1(4)。","I 型：op2(4) | rt(4) | imm8(8)。","M 型：op3(4) | offset(12)。","op1：0001 加、0010 左移；op2：0100 加立即数；op3：1110 取数、1111 存数。"],"ask":[{"q":"主存单元和通用寄存器各多少位","a":["**主存单元宽度 = 字长 = 16 位**。按字编址意味着一个地址对应一个 16 位的字。","**通用寄存器宽度 = 16 位**。寄存器要能装下一个字（参与运算、存取都整字进出），宽度与字长一致。","顺带：R0~R15 共 16 个，编号正好 4 位，和格式里的 rt/rs 字段宽度对得上。"]},{"q":"op1 与 op2 能否相同？op2 与 op3 能否相同","a":["判据只有一个：**这两个操作码是不是占同一个位置**。","op1 在 R 型的**最低 4 位**，op2 在 I 型的**最高 4 位**——位置不同，同一串 0001 在两种格式里含义不冲突，**可以相同**。","op2 与 op3 **都在最高 4 位**——若相同，译码器无法判断这条是 I 型还是 M 型，**不可以相同**。","再补一句能加分：**op2 也不能等于 0000**，否则会被当成 R 型指令。"],"table":[["比较","各自位置","能否相同","理由"],["op1 vs op2","最低 4 位 / 最高 4 位","可以","位置不同，互不干扰"],["op2 vs op3","都在最高 4 位","不可以","无法区分 I 型与 M 型"]]},{"q":"0000 0010 1001 0001 执行后 R2、R9 是多少","a":["第 1 段是 0000 → **R 型**，按 4+4+4+4 切：`0000 | 0010 | 1001 | 0001` → rt=2、rs=9、op1=0001（加）。","功能：**R[2] ← R[2] + R[9]**。","ABCDH + F001H = **1 9BCEH**，16 位寄存器丢掉最高位进位 → **9BCEH**。","所以 **R2 = 9BCEH**；**R9 不变，仍是 F001H**（它是源操作数，只读不写）。"],"note":"R 型的功能写的是 R[rt] ← R[rt] op1 R[rs]，rt 既是源又是目的。看错成 rd 就会答错寄存器。"},{"q":"填出 y = 16x − 5 的四个空 ①~④","a":["先把算式拆成机器会做的四步：**取 x → 左移 4 位（×16）→ 加 (−5) → 存 y**。","x、y 连续存放且**按字编址**，所以 y 的地址 = x 的地址 + **1**（不是 +2）。x 的地址在 R15 里。","第 21 行：M 型取数，`R[0] ← M[R15+0]` → ① = **1110**。","第 22 行：R 型左移，rt=0、num=4、op1=0010 → `0000 0000 0100 0010`，② 占 8 位 = **0000 0100**。","第 23 行：I 型加立即数，imm8 = −5 的补码 = **1111 1011**。","第 24 行：M 型存数，offset = 1 → **0000 0000 0001**。"],"code":["21: 1110 0000 0000 0000   取数  offset=0","22: 0000 0000 0100 0010   R型 rt=0 num=4 op1=0010(左移)","23: 0100 0000 1111 1011   加立即数 imm8=-5","24: 1111 0000 0000 0001   存数  offset=1"],"note":"三个必错点：② 是「rt + num」共 8 位，不是单独 num；③ 是 −5 的补码不是 +5；④ 的 offset 是 1 不是 2。"}],"traps":["第（2）问只答「可以/不可以」不说位置 —— 判据是字段位置。","第（3）问保留进位写成 19BCEH —— 16 位寄存器装不下，进位必须丢。","③ 写成 +5 的补码 0000 0101 —— 是 −5，要取反加一。","④ 的 offset 写成 2 —— 按字编址，y 与 x 差 1 个字。"]},{"id":"in-2017-44","year":"2017","no":"44","score":"10 分","type":"从机器码读出体系结构","title":"一段 CISC 代码：字节数、借位标志、能不能左移","brief":"给出 x86 机器级代码清单（push ebp 在 00401020H，ret 在 0040107FH）。问 RISC 还是 CISC、代码共几字节、f1(0) 时 cmp 的 CF、float 能否用 shl 实现 ×2。","given":["按字节编址。首条指令 push ebp 在 0040 1020H，占 1 字节。","第 20 条 cmp dword ptr[ebp-0Ch], ecx 在 0040 105EH，机器码 39 4D F4（3 字节）。","第 23 条 shl edx, 1 机器码 D1 E2（2 字节）。","末条 ret 在 0040 107FH，机器码 C3（1 字节）。"],"ask":[{"q":"M 是 RISC 还是 CISC？为什么","a":["看指令长度：清单里同时出现 **55（1 字节）、39 4D F4（3 字节）、D1 E2（2 字节）、C3（1 字节）**——**长度不固定**。","指令长度可变、寻址方式多、单条指令能干复杂的事，这是 **CISC** 的典型特征。","RISC 相反：指令长度固定（常见 4B）、寻址方式少、只有 load/store 访存。"]},{"q":"f1 的机器指令代码共占多少字节","a":["首地址 0040 1020H；末条 ret 在 0040 107FH 且占 1 字节，所以代码结束于 **0040 1080H**。","长度 = 0040 1080H − 0040 1020H = 60H = **96 字节**。","**不能**用「35 条指令 = 35 字节」——那是假设每条 1 字节，而 cmp、shl 都不是 1 字节。变长指令只能靠地址差算。"],"code":["首地址 = 00401020H","末地址 = 0040107FH + 1 = 00401080H","长度   = 00401080H - 00401020H = 60H = 96 字节"]},{"q":"f1(0) 且 i=0 时，cmp 执行后 CF 是多少","a":["题目已经把语义定死了：cmp 实现的是「**i 减 (n−1)**」，不是反过来。","f1(0)：n = 0，n 是 unsigned，n − 1 = **0FFFFFFFFH**（32 个 1，无符号下溢的最大值）。i = 0。","所以做的是 **0 − 0FFFFFFFFH**：0 减一个巨大的正数，显然不够减，**必须借位 → CF = 1**。","这正是 2017·43 那道题死循环的机器级原因：无符号比较下「i ≤ n−1」永远成立。"],"note":"「不够减」就是借位。别被「0 减什么都还是 0」的直觉骗了——借位标志看的是「够不够减」，不是结果。"},{"q":"f2 里能否用 shl 实现 power*2","a":["**不能。** 整数的位权是「每一位 × 2ⁱ」，整体左移就是把每个权值抬高一档，所以整数左移一位 = ×2。","但 float 是 **1 位符号 + 8 位阶码 + 23 位尾数**，左移会把三段全部破坏：符号位被顶掉、阶码被尾数高位污染、尾数丢精度。","float 乘 2 的正确做法是 **阶码加 1**（尾数不变），并且要处理阶码加到 255 的上溢。","一句话：**移位是「按位权缩放」，只对定点整数成立；浮点的缩放是「改指数」。**"],"table":[["字段","左移会怎样","后果"],["符号位","被邻居的位顶掉","正负号错乱"],["阶码 8 位","尾数高位挤进来","数量级完全错"],["尾数 23 位","最高位丢进阶码","精度被破坏"]]}],"traps":["第（2）问答 35 字节 —— 变长指令必须用地址差算。","第（3）问把 CF 判成 0 —— 0 减全 1 是不够减，CF=1。","第（4）问只说「float 不能移位」不解释 —— 要落在「符号/阶码/尾数被破坏，正确做法是阶码加 1」。"]},{"id":"in-2019-45","year":"2019","no":"45","score":"13 分","type":"递归 + 相对寻址 + 字节序","title":"递归阶乘：call 的偏移量怎么算","brief":"32 位机上递归阶乘的机器级代码。call 在 00401025H、机器码 E8 D6 FF FF FF，目标 00401000H。问调用次数、转移指令、下一条地址与偏移量、大小端、13! 为何溢出、imul 何时置 OF。","given":["32 位计算机，按字节编址，int 占 32 位。","第 12 行 jle 在 0040101CH，机器码 7E 17，目标 00401035H。","第 16 行 call 在 00401025H，机器码 E8 D6 FF FF FF，目标 00401000H。","第 20 行 jmp 在 00401033H，机器码 EB 05。第 30 行 ret 在 0040104AH。"],"ask":[{"q":"f(10) 要调用 f1 多少次？哪条指令递归","a":["调用链 f(10) → f(9) → … → f(1)，一共 **10 次**（含最外层那次）。","递归发生在第 16 行的 **call f1**——它把返回地址压栈、跳到 f1 入口，等于把自己又调了一遍。"],"note":"答 9 次是最常见的错——忘了 f(10) 本身也算一次调用。"},{"q":"哪条是条件转移？哪几条一定会跳","a":["**条件转移**：第 12 行 **jle**（n ≤ 1 时才跳到 else 分支）。","**必跳**：第 20 行 **jmp**（无条件跳过 else 分支）、第 16 行 **call**、第 30 行 **ret**——后两个通过改变 PC 实现调用与返回。","第 11 行的 **cmp 不是转移指令**：它只做减法并设置标志位，不改 PC。「设置标志」和「根据标志转移」是两条不同的指令。"]},{"q":"第 17 行地址、call 的偏移量、大端还是小端","a":["call 的机器码是 E8 + 4 字节偏移 = **5 字节**，所以下一条指令地址 = 0040 1025H + 5 = **0040 102AH**。","偏移量 = 目标 − 下一条 = 0040 1000H − 0040 102AH = **−2AH = −42**，32 位补码是 **FFFFFFD6H**。","指令里存的 4 个字节是 **D6 FF FF FF**——最低字节 D6 排在最前面，**小端方式**。大端应该写成 FF FF FF D6。"],"code":["call 在 00401025H，长 5 字节","下一条 = 00401025H + 5 = 0040102AH","偏移量 = 00401000H - 0040102AH = -2AH = -42","       = FFFFFFD6H","校验：0040102AH + (-42) = 00401000H"],"note":"相对寻址的基准是**下一条指令**。直接用「目标 − call 地址」会差 5，这是本题最集中的失分点。"},{"q":"13! 为什么不等于返回值？怎么改","a":["13! = **6227020800**，而 32 位 int 最大是 2³¹−1 = **2147483647**，装不下。","6227020800 − 2³² = 6227020800 − 4294967296 = **1932053504**，正是 f1 实际返回的值——溢出后只留低 32 位。","改法：把 f1 的**返回类型改成 64 位**（`long long`），中间结果也用 64 位保存。这样 20! 都能装下。"]},{"q":"imul 什么时候置 OF？编译器要加什么指令","a":["带符号乘法需要 2n 位才装得下，imul 只留低 32 位。判据是：**高 32 位是不是低 32 位的符号扩展**。","换句话说，**高 32 位必须全等于低 32 位的符号位**；只要出现不同的位，真值就超出 32 位 → **OF = 1**。","要让 CPU 溢出时转异常处理，编译器应在 imul 后加一条 **jo（溢出则转移）**，或用 **into（溢出中断）**。"],"note":"这条判据和 2020·43、2026·43 完全一致：**高 n 位不为符号扩展 = 装不下**。无符号看「高 n 位是否全 0」。"}],"traps":["第（1）问答 9 次 —— 别忘了 f(10) 本身。","第（3）问偏移量算成「目标 − call 地址」—— 基准是下一条，call 长 5 字节。","第（4）问只说「溢出了」不说怎么改 —— 题目要的是「返回类型改 64 位」。","把 cmp 当成条件转移指令 —— 它只设标志，不跳。"]},{"id":"in-2023-44","year":"2023","no":"44","score":"9 分","type":"变址寻址 + 相对转移 + 大小端","title":"一条 11 字节的 mov 指令，藏着五个考点","brief":"给出一段 for 循环的机器级代码。第 19 条 mov 的机器码是 C7 84 82 00 20 42 00 0A 00 00 00。问第 20 条地址、jmp/jge 的寻址方式、源操作数寻址方式与 ecx 的含义、大小端、取指是否缺页。","given":["第 1 条在 00401072H；第 2 条 jmp 在 00401079H（EB 09）；第 7 条 jge 在 00401088H（7D 32）。","第 19 条 mov 在 004010AEH，机器码 11 字节：C7 84 82 00 20 42 00 0A 00 00 00。","汇编形式 mov [ecx+edx*4+0042200H], 0Ah；a 的首地址 0042200H；edx 存 j。","数组 a 初始不在内存；页大小与 2023·43 同。"],"ask":[{"q":"第 20 条指令的虚拟地址","a":["数第 19 条机器码的字节数：`C7 84 82 00 20 42 00 0A 00 00 00` 共 **11 字节**。","第 20 条地址 = 0040 10AEH + 0BH = **0040 10B9H**。"],"note":"加 0BH 不是 0AH。11 个字节 = 0BH，差一位就全错。"},{"q":"jmp 和 jge 各是什么寻址方式？给出 jmp 的计算","a":["两条指令都只有 **2 字节**（EB 09、7D 32），而目标地址是 32 位——2 字节装不下完整地址，**只能存偏移量**，运行时再加到 PC 上。所以都是**相对寻址**。","jmp：下一条 = 0040 1079H + 2 = 0040 107BH；目标 = 0040 107BH + 09H = **0040 1084H**，与题给一致。","jge 验证：0040 1088H + 2 = 0040 108AH，加 32H 得 0040 10BCH ✓。"],"note":"jge 是**带符号**比较转移，和 2013·44 的「无符号用 CF/ZF」正好配成一对。"},{"q":"源操作数寻址方式？ecx 里是什么？大端还是小端","a":["源操作数是 **0Ah**，一个常数直接写在指令里 → **立即（数）寻址**。","把地址表达式和 a[i][j] 的地址公式对上：`a[i][j] 地址 = 0042200H + i×256 + j×4`（一行 64 个元素 × 4B = 256B）。","已知 edx = j，所以 **ecx 里存的是 i × 256**。","编译器这么做是优化：内层 j 变得快，让它走 edx*4 变址；外层 i 变得慢，提前算成 i*256 存进 ecx。","大小端：地址字段 4 字节是 `00 20 42 00`，真值 00422000H 的低字节 00 排在最前 → **小端**。"],"code":["指令算的地址   = ecx + edx*4 + 0042200H","a[i][j] 的地址 = 0042200H + (i*64 + j)*4","               = 0042200H + i*256 + j*4","已知 edx = j  →  ecx = i*256"],"note":"ecx 答成 i 是最常见错——一行 64 个 int，占 256 字节，必须乘 256。"},{"q":"第 1 次执行第 19 条时，取指会不会缺页","a":["**不会。** 题目问的是**取指令**，第 19 条地址 0040 10AEH 属于代码段。","2023·43 给的条件是「数组 a 初始不在内存」，说的是**数据**不在内存，不是代码。程序能跑到第 19 条，说明代码页早就调进来了。","反过来想：如果取指就缺页，第 1 条指令就会缺页，根本到不了第 19 条。","所以：**取指不缺页，随后的取数（访问 a[0][0]）才缺页。**"],"note":"「缺页」要分清是取指缺页还是取数缺页。这是本题最容易被题干带偏的一问。"}],"traps":["第（1）问数错字节 —— 11 个字节，地址加 0BH。","第（2）问答「直接寻址」—— 2 字节装不下 32 位地址，只能是相对。","第（3）问 ecx 答成 i —— 要乘 256。","第（4）问答「会缺页，因为数组不在内存」—— 取指和取数是两回事。"]},{"id":"in-2024-44","year":"2024","no":"44","score":"10 分","type":"寄存器分工 + 小端取数","title":"四条 RISC 指令，把 sum += a[i] 走完","brief":"给 slli/add/lw/add 四条指令，问 a、i、sum 各在哪个寄存器；i=5、r1=00001332H、r3=0013DFF0H，页大小 4KB，问 a[i] 地址、a[i] 与 sum 的机器数、页号、数组至少占几页；再问 slli 机器码与 short 版的写法。","given":["1 slli r4, r2, 2；2 add r4, r3, r4；3 lw r5, 0(r4)；4 add r1, r1, r5。","i、sum、a 都是 int 型；r1~r5 编号 01H~05H。","小端方式，页式管理，页大小 4KB。i=5，r1=00001332H，r3=0013DFF0H。","从 0013DFF0H 起的内容：FF FF FF 7C 70 FE FF FF / 00 00 00 0C 3C 02 01 FF / F0 F1 00 00 DC EC FF FF / …","slli 编码：31-25=0000000，24-20=shamt，19-15=rs1，14-12=010，11-7=rd，6-0=0010011。"],"ask":[{"q":"a、i、sum 各在哪个寄存器","a":["不用算，**看指令在干什么**：哪条在「×4」、哪条在「加基址」、哪条在「累加」。","`slli r4, r2, 2`：把某个变量左移 2 位 = ×4，正好是 int 的下标偏移 → **r2 = i**。","`add r4, r3, r4`：偏移量加基址 → **r3 = a 的首地址**。","`lw r5, 0(r4)`：从算出的地址取一个 int → r5 暂存 a[i]。","`add r1, r1, r5`：把 a[i] 累加到某个变量 → **r1 = sum**。","答案：**a 的首地址在 r3（03H）、i 在 r2（02H）、sum 在 r1（01H）**。"],"note":"推导顺序：先找「×4」的那条（下标 i），再找「加基址」的那条（数组），最后找「累加」的那条（sum）。"},{"q":"a[i] 的地址是多少","a":["a[i] 地址 = 基址 + i×4 = 0013 DFF0H + 5×4 = 0013 DFF0H + 14H = **0013 E004H**。","注意 5×4 = 20 = **14H**，别把十进制的 20 当十六进制写进地址。"]},{"q":"a[i] 与 sum 的机器数、a[i] 的页号、数组至少占几页","a":["从表里 0013 E000 行往后数偏移 4~7 的 4 个字节：**DC、EC、FF、FF**。","小端 = 低地址放低字节，所以 E004 的 DC 是最低字节，E007 的 FF 是最高字节，拼成 **FFFF ECDCH**（真值 −4900）。","sum = 0000 1332H + FFFF ECDCH = 1 0000 000EH，丢掉进位 → **0000 000EH**（真值 4914 − 4900 = 14 = 0EH ✓）。","页号 = 地址 ÷ 1000H（去掉低 12 位）：0013 E004H ÷ 1000H = **0013EH**。","数组首地址 0013 DFF0H 落在页 **0013DH**，本次访问的 a[5] 在 0013 E004H 落在页 **0013EH** → 跨两页，至少 **2 页**。"],"code":["地址     E004  E005  E006  E007","内容     DC    EC    FF    FF","字节序   最低 ──────────→ 最高","拼成     FFFF ECDCH","","sum = 00001332H + FFFFECDCH = 1 0000 000EH","    = 0000 000EH","","页号 = 0013E004H >> 12 = 0013EH"],"note":"小端取数要「倒着拼」：按地址从低到高读到的 4 个字节，拼成 32 位数时要把最后一个字节放最高位。"},{"q":"slli 的机器码；a 改为 short 后怎么写","a":["按编码表逐段填：shamt=2 → 00010；rs1=r2=2 → 00010；funct3=010；rd=r4=4 → 00100；opcode=0010011。","拼起来：`0000000 00010 00010 010 00100 0010011` = `0000 0000 0010 0001 0010 0010 0001 0011` = **0021 2213H**。","若 a 改为 short（2 字节），下标乘数从 4 变成 2，左移位数从 2 变成 1 → **slli r4, r2, 1**。"],"note":"一句话：**slli 的第二个立即数 = log₂(元素字节数)**。int→2、short→1、char→0。"}],"traps":["把 DC EC FF FF 按大端拼成 DCECFFFFH —— 小端要倒着拼。","页号算成 0013E004H —— 页号 = 地址 ÷ 1000H，去掉低 12 位。","funct3 写成 001 —— 表里 slli 是 010，add 才是 000。","short 版仍写 slli r4, r2, 2 —— 元素 2 字节，只移 1 位。"]}]},"flows":[{"id":"os-pf","sub":"OS","t":"缺页处理全流程","intro":"从 CPU 给出一个虚拟地址，到数据真正取回来，中间可能踩空一次。这一次踩空就是缺页。","freq":["2010·46","2014·46","2020·45","2022·45"],"chain":["访问虚地址","查 TLB","查页表","缺页异常","调页","重新执行"],"steps":[{"t":"CPU 送出虚拟地址，先查 TLB","who":"MMU","d":["MMU 把虚拟地址拆成「虚页号 + 页内偏移」。虚页号先拿去查 **TLB（快表）**——它是页表项的硬件缓存。","TLB 命中：直接拿到物理页框号，和页内偏移拼成物理地址，**不访问内存中的页表**。整个过程 0 次访存（页表部分）。"],"note":"TLB 命中与否，只影响「查页表」这一步的访存次数，不影响最终数据访问。"},{"t":"TLB 未命中，查内存中的页表","who":"MMU","d":["用虚页号作下标去查页表（多级页表要逐级查，每级一次访存）。","查到页表项后看**有效位（存在位）**：为 1 说明页面在内存，取出页框号，同时**把这行填入 TLB**（可能淘汰一行）。","为 0 说明页面不在内存——**触发缺页异常**。"],"note":"有效位是「在不在内存」，保护位是「能不能读/写」，别混。修改位（脏位）只在置换时才用得上。"},{"t":"缺页异常：陷入内核","who":"硬件 + 内核","d":["CPU 把当前指令的地址（PC）保存到内核栈，切换到**内核态**，跳转到缺页异常处理程序。","注意：缺页是**故障（fault）**，不是终止。保存的返回地址是**当前这条指令**，不是下一条——处理完要重新执行它。","这一点是选择题高频：**缺页处理后重新执行的是同一条指令**。"],"note":"对比：除数为 0 是「终止」，非法指令是「终止」，只有缺页、缺段这类是「故障」，可以恢复。"},{"t":"缺页处理程序：先判地址合不合法","who":"内核","d":["取出发生缺页的虚地址，检查它是否在进程的地址空间内、访问权限是否允许。","不合法 → **段错误（SIGSEGV）**，进程被终止。合法 → 继续调页。","合法性检查这一步很多同学会漏写，但它是「缺页」和「越界」的分水岭。"],"note":"缺页 ≠ 越界。缺页是「页不在内存但地址合法」，越界是「地址根本不属于你」。"},{"t":"选一个牺牲页","who":"内核","d":["内存没有空闲页框时，按**页面置换算法**（OPT / FIFO / LRU / CLOCK）选一个页面换出。","看它的**修改位（脏位）**：为 1 说明被改过，必须**先写回磁盘**；为 0 说明和磁盘一致，直接丢弃即可。","这一步的代价差别巨大：脏页要写磁盘，干净页不用——所以「写回」是缺页处理中最慢的一环。"],"note":"被换出的页要把页表项有效位清 0、TLB 中对应项作废（或整表刷新）。"},{"t":"从磁盘把所需页面读入","who":"内核 + 磁盘","d":["在磁盘上找到该页的位置（可能要先读 inode / 索引块），发起磁盘读。","进程进入**阻塞态**，让出 CPU。等磁盘中断到来，数据已经进了页框。","这一步的时间是**毫秒级**，而访存是纳秒级——差六个数量级，这就是「缺页代价高」的全部原因。"],"note":"如果内存里连一个空闲页框都没有、且所有页都在忙，还要先唤醒页框回收进程——这就是「抖动」的前兆。"},{"t":"更新页表与 TLB，返回并重新执行","who":"内核","d":["把新页框号写进页表项，有效位置 1，修改位清 0；同时更新 TLB。","进程从阻塞态转**就绪态**，被调度后**重新执行那条触发缺页的指令**——这次就能正常命中了。","整个过程对用户程序**完全透明**，它只知道「这次访存慢了一点」。"],"note":"答题时最后一句一定要写「重新执行该指令」，这是缺页作为 fault 的标志。"}],"trap":["问「缺页处理过程中可能发生几次访存」——要分开算：查页表 n 次（n 级页表）、读页表项、读数据各算一次，TLB 命中则页表那几次全省。","问「缺页率与哪些因素有关」——页面大小、置换算法、分配给进程的页框数、程序的局部性，四个都要答。","问「缺页中断属于内中断还是外中断」——**内中断（异常）**，由 CPU 执行指令引起，不是外部设备。"],"fig":{"kind":"flow","w":660,"cols":3,"nodes":[{"t":"访问虚地址","s":"拆成页号 + 偏移","c":"blue"},{"t":"查 TLB","s":"命中直接拼物理地址","c":"gold"},{"t":"查页表","s":"看有效位","c":"blue"},{"t":"缺页异常","s":"陷入内核","c":"rust"},{"t":"调页","s":"选牺牲页 → 脏则写回 → 读入","c":"rust"},{"t":"重新执行该指令","s":"这次就命中了","c":"green"}],"cap":"缺页是「故障（fault）」不是终止：保存的返回地址是当前这条指令，处理完要重新执行它。这一步写错，整道大题的顺序就全乱了。"}},{"id":"os-int","sub":"OS","t":"中断处理全流程","intro":"从设备发出中断请求，到进程恢复执行。这条链在 408 里可以拆成「响应」和「处理」两段来考。","freq":["2015·46","2021·44","2023·46"],"chain":["中断请求","中断判优","中断响应","保护现场","中断服务","中断返回"],"steps":[{"t":"中断请求：设备拉高 INTR","who":"外设","d":["设备完成一次传输（或出错、或按下键盘），通过中断控制器向 CPU 发出**中断请求**。","CPU 在**每条指令执行结束时**采样中断请求线——注意不是任意时刻，是「指令边界」。","所以一条指令执行期间不会被打断（除了 DMA 抢总线那种情况）。"],"note":"「什么时候检查中断」是常考点：**每条指令结束时**。不是每个时钟周期，也不是每条微指令。"},{"t":"中断判优：谁先被服务","who":"中断控制器","d":["多个中断同时到达时，按**优先级**排队。硬件优先级由中断控制器（如 8259A）的排队电路决定。","软件上还有「中断屏蔽字」：屏蔽字某位为 1 表示屏蔽该级中断，可以人为改变实际优先级。","**不可屏蔽中断（NMI）** 优先级最高，通常用于电源故障等紧急事件。"],"note":"「屏蔽」和「禁止」是两个层次：屏蔽字是软件可改的，中断允许标志 IF 是总开关。"},{"t":"中断响应：一条隐指令","who":"硬件","d":["CPU 响应中断时执行的操作由**硬件自动完成**，不是程序指令，所以叫**中断隐指令**。三件事：","**① 关中断**（把 IF 清 0），防止响应过程被打断；**② 保存断点**（把 PC 压栈，有的机器连 PSW 一起压）；**③ 取中断服务程序入口**（根据中断类型号查中断向量表，送到 PC）。","这三件事顺序固定，考试常问「哪些由硬件完成」——答案是**这三件**，保护通用寄存器是软件做的。"],"note":"隐指令「不存在于指令系统中」，但它确实执行了。这个措辞是选择题的标准陷阱。"},{"t":"保护现场：保存通用寄存器","who":"中断服务程序","d":["进入服务程序后，先把会用到的通用寄存器压栈（保护现场），再开中断（允许更高级中断嵌套）。","注意区分：**保存断点**（PC）是硬件做的，**保护现场**（通用寄存器）是软件做的。","如果允许多重中断，开中断的时机很关键——太早会丢数据，太晚嵌套没意义。"],"note":"答题模板：断点由硬件保存，现场由软件保存，恢复顺序与保存相反。"},{"t":"执行中断服务程序","who":"内核","d":["真正干活：从设备读数据、清中断标志、把数据放到缓冲区、唤醒等待的进程。","**必须清中断标志**，否则退出后设备会一直认为中断没被处理，反复请求。","处理期间 CPU 处于**内核态**——中断处理一律在内核态执行。"],"note":"2023·46 就问了「中断处理程序执行时进程处于什么态」——是**阻塞态**（还没被唤醒），CPU 是**内核态**。"},{"t":"恢复现场、中断返回","who":"硬件 + 软件","d":["先关中断，弹出通用寄存器（恢复现场），再执行 **IRET** 指令：弹出 PC 和 PSW，开中断，回到被中断的指令继续执行。","如果中断处理唤醒了更高优先级的进程，**返回时可能不回到原进程**，而是触发一次调度——这叫「抢占式调度发生在中断返回处」。"],"note":"「中断返回后一定回到原进程吗」——不一定。这是理解抢占式调度的关键。"}],"trap":["问「中断响应的时间」——是**一条指令执行结束**时，不是立即。","问「中断向量表存的是什么」——存的是**中断服务程序的入口地址**（有的机器存的是入口的首地址+PSW），不是中断处理代码本身。","问「中断与异常的区别」——中断是**外部的、异步的**；异常是**执行指令引起的、同步的**（缺页、除零、越界）。"],"fig":{"kind":"flow","w":660,"cols":3,"nodes":[{"t":"中断请求","s":"设备拉高 INTR","c":"blue"},{"t":"中断判优","s":"硬件排队 + 屏蔽字","c":"gold"},{"t":"中断响应","s":"关中断 · 存断点 · 取入口","c":"rust"},{"t":"保护现场","s":"通用寄存器压栈（软件）","c":"gold"},{"t":"执行服务程序","s":"搬数据 · 清中断标志","c":"green"},{"t":"恢复现场并返回","s":"IRET，可能触发调度","c":"green"}],"cap":"「断点由硬件保存、现场由软件保存」是最高频的判断题。中断只在指令边界发生，一条指令执行中间不会被打断。"}},{"id":"os-state","sub":"OS","t":"进程状态转换与上下文切换","intro":"三态图是送分题，但「谁触发哪条边」经常考倒人。再加上一次上下文切换的完整动作。","freq":["2016·45","2023·46","2026·45"],"chain":["创建","就绪","运行","阻塞","唤醒","终止"],"steps":[{"t":"创建 → 就绪","who":"内核","d":["分配 PCB、分配资源、装入程序和数据，状态置为**就绪**，插入就绪队列。","注意：创建完成后不是直接运行，而是进就绪队列等调度。","有的系统有「创建态」，等资源分配完才转就绪。"],"note":"「进程创建后一定立即运行吗」——不一定，取决于调度。"},{"t":"就绪 → 运行","who":"调度程序","d":["调度程序按某种算法从就绪队列里选一个，分配 CPU。","**这是唯一由「别人」决定的转换**——进程自己不能把自己变成运行态，必须被选中。","触发时机：当前进程结束、阻塞、时间片用完、被更高优先级抢占。"],"note":"「就绪 → 运行」是调度；「运行 → 就绪」是剥夺。方向相反，原因不同。"},{"t":"运行 → 阻塞","who":"进程自己","d":["进程执行系统调用或等待某事件（等 I/O、等信号量、等消息），**主动**放弃 CPU。","关键词是「主动」：这是进程自己做的决定，不是别人抢走的。","转换后进入对应事件的等待队列，**不占 CPU**。"],"note":"阻塞是主动的，就绪是被动的。这个区分能解决一大半判断题。"},{"t":"阻塞 → 就绪","who":"其他进程 / 中断","d":["等待的事件发生了（I/O 完成、信号量被 V、消息到达），由**别的进程或中断处理程序**把它唤醒。","唤醒只是「有资格运行」，不是「立刻运行」——还要排队等调度。","所以 2023·46 里「插入就绪队列」发生在中断处理程序中，而「被调度执行」还要再等。"],"note":"「阻塞 → 运行」这条边**不存在**。任何教材都没有这条边，出现了就是错的。"},{"t":"运行 → 终止","who":"进程自己 / 父进程","d":["正常结束（exit）、异常终止（越界、除零）、被杀死（kill）。","终止后回收资源、撤销 PCB，但**不立即回收**——父进程可能要读它的退出状态（僵尸态）。"],"note":"僵尸进程：已终止但 PCB 未回收；孤儿进程：父进程先死，被 init 收养。"},{"t":"一次上下文切换做了什么","who":"内核","d":["**① 保存当前进程的现场**：PC、通用寄存器、PSW 存进它的 PCB。","**② 更新 PCB 中的状态与统计信息**：运行 → 就绪/阻塞，累加 CPU 时间。","**③ 把当前进程的 PCB 插入相应队列**（就绪队列或某事件的等待队列）。","**④ 调度程序选出新进程**，从它的 PCB 恢复现场，切换到它的页表（更新页表基址寄存器，可能还要刷 TLB）。","**⑤ 返回用户态**，从新进程的 PC 继续执行。"],"note":"上下文切换是有开销的（保存/恢复寄存器、刷 TLB、Cache 失效），所以时间片不能太小。"}],"trap":["「阻塞 → 运行」不存在；「就绪 → 阻塞」也不存在（没运行怎么阻塞）。","「时间片用完」是运行 → 就绪；「等待 I/O」是运行 → 阻塞。两者都是离开 CPU，但去向不同。","「进程被唤醒」后是就绪态，不是运行态。"]},{"id":"os-file","sub":"OS","t":"从打开文件到读出数据","intro":"open 和 read 是两个系统调用，中间隔着一整套目录检索、权限检查、缓存查找。这条链是文件管理大题的骨架。","freq":["2017·47","2019·47","2022·47"],"chain":["open","查目录","建文件表项","read","查页缓存","读磁盘","拷贝到用户区"],"steps":[{"t":"open(\"/a/b.txt\")：逐级解析路径","who":"内核","d":["从**根目录**（或当前工作目录）开始，把路径按 `/` 切开，一段一段查目录文件。","每一段都要读目录文件、在其中线性（或哈希）查找同名目录项，取出对应的 **inode 号**。","所以路径越深，open 越慢——**每多一级目录，就多一次（或多次）磁盘访问**，除非目录项已在 Cache 中。"],"note":"目录项里存的是「文件名 → inode 号」的映射，**文件名不在 inode 里**。这是高频选择题。"},{"t":"权限检查","who":"内核","d":["读出 inode，检查它的权限位与当前进程的 uid/gid 是否匹配（读/写/执行）。","不通过 → 返回 -1，errno = EACCES。通过 → 继续。"],"note":"权限检查发生在 open 时；每次 read 不再重复检查（除非用了特殊标志）。"},{"t":"建立「打开文件表」的两级结构","who":"内核","d":["**系统打开文件表**（全局一张）：每个打开的文件一项，含 inode 指针、引用计数、读写偏移、打开模式。","**进程打开文件表**（每进程一张）：fd 作下标，指向系统表中的某一项。","`open` 返回的整数就是**进程表的下标**，也就是 fd。**fd 是小整数，不是地址**。"],"note":"fork 之后子进程继承父进程的 fd 表，**共享同一个系统表项**，所以共享文件偏移——这是常考细节。"},{"t":"read(fd, buf, n)：先查页高速缓存","who":"内核","d":["用 fd 找到系统表项 → 找到 inode → 按 inode 里的索引结构（直接块/一级间接/二级间接）算出要读的逻辑块号。","先查**页高速缓存（page cache）**：这个块是不是已经在内存里了？","命中：直接从内核缓冲区把数据拷到用户 buf，**完全不碰磁盘**。这就是「第二次读同一个文件很快」的原因。"],"note":"页缓存是「按页」缓存的，不是按文件。不同文件共享同一页的情况也存在。"},{"t":"未命中：发起磁盘读","who":"内核 + 磁盘","d":["构造块 I/O 请求，交给块设备层，进入 I/O 调度队列。","进程进入**阻塞态**，等磁盘中断。磁盘控制器用 DMA 把整个块传进内存。","传输完成发中断，驱动唤醒进程，数据已经在页缓存里了。"],"note":"「读一个字节要读一整块」——块大小 4KB 时，读 1B 也要传 4KB，这是 I/O 放大。"},{"t":"拷贝到用户空间，更新偏移","who":"内核","d":["从页缓存（内核空间）把 n 个字节拷到用户 buf——**这次拷贝不可避免**，因为用户不能直接访问内核地址。","更新系统表项里的文件偏移 += n（这也是为什么两个进程共享同一表项时会互相影响偏移）。","返回实际读到的字节数；到文件末尾返回 0。"],"note":"整个过程数据要走「磁盘 → 内核页缓存 → 用户缓冲区」两趟，这就是「读文件要两次拷贝」的说法来源。"}],"trap":["「open 返回的是什么」——进程打开文件表的下标（fd），不是 inode 号，也不是地址。","「inode 里有文件名吗」——没有。文件名在目录项里。","「read 一定要访问磁盘吗」——不一定，页缓存命中就不访问。"]},{"id":"os-io","sub":"OS","t":"一次磁盘 I/O 的完整链路","intro":"从进程调用 read 到数据回来，中间要过文件系统、块设备层、I/O 调度、磁盘控制器。时间都花在「寻道」和「旋转」上。","freq":["2012·46","2016·47","2019·47"],"chain":["系统调用","查缓存","构造请求","I/O 调度","寻道","旋转","传输","中断唤醒"],"steps":[{"t":"系统调用进入内核","who":"进程 → 内核","d":["用户进程执行 `read`，触发**陷入（trap）**，CPU 从用户态切到内核态。","这一步本身就是一次「异常」，所以系统调用的开销里包含一次模式切换。"],"note":"系统调用属于**内中断（异常）** 中的「陷入」，不是外中断。"},{"t":"文件系统把「字节偏移」翻译成「柱面/磁头/扇区」","who":"文件系统","d":["按 inode 的索引结构找到逻辑块号，再按磁盘布局换算成物理地址（柱面号 C、磁头号 H、扇区号 S）。","如果是连续分配，一次可以算出一大片；如果是链接分配，必须一个块一个块顺着走——**这就是链接分配慢的原因**。"],"note":"「逻辑块号 → 物理地址」的换算，是文件系统大题里最爱考的一步。"},{"t":"进入 I/O 调度队列","who":"块设备层","d":["多个进程的请求排成队列，由**磁盘调度算法**决定服务顺序：FCFS、SSTF、SCAN、C-SCAN、LOOK。","算法的目标都是**减少总寻道时间**。SSTF 可能饿死远端请求，SCAN 用「单向扫描」解决饥饿。"],"note":"算平均寻道距离时，别忘了把「当前磁头位置」作为起点，且**每次移动都要累加绝对值**。"},{"t":"寻道：磁头移动到目标柱面","who":"磁盘控制器","d":["机械臂带动磁头径向移动。**寻道时间是三者中最长的**（毫秒级）。","这也是为什么调度算法只优化寻道——旋转和传输基本没法优化。"],"note":"磁盘访问时间 = 寻道时间 + 旋转延迟 + 传输时间。旋转延迟平均 = 半圈时间 = 60/(2r) 秒。"},{"t":"旋转延迟：等目标扇区转到磁头下","who":"磁盘","d":["盘片匀速旋转，平均要等**半圈**。转速 r 转/分时，一圈 60/r 秒，平均延迟 = 30/r 秒。","比如 7200 r/min → 一圈 8.33ms → 平均旋转延迟 4.17ms。"],"note":"「平均」两个字不能丢。最好情况 0，最坏一圈，平均半圈。"},{"t":"传输：读出一个或多个扇区","who":"磁盘 + DMA","d":["磁头读出数据，通过 DMA 直接写入内存，**不经过 CPU 寄存器**。","传输时间 = 要传的字节数 ÷ 传输速率。数据量大时才显著。"],"note":"DMA 与中断的区别：DMA 传的是**数据块**，中断传的是**一个字节/字**并需要 CPU 搬运。"},{"t":"中断到来，唤醒进程","who":"驱动 → 内核","d":["DMA 完成后发中断，驱动在中断处理程序里标记 I/O 完成、唤醒阻塞的进程。","进程从阻塞态转就绪态，等调度。数据此时已在页缓存，拷贝到用户区后 read 返回。","如果是**虚拟存储**下的缺页读，还要更新页表和 TLB——那就接上「缺页处理」那条链了。"],"note":"「阻塞的进程被唤醒后立刻运行吗」——不，先进就绪队列。"}],"trap":["把「旋转延迟」算成一整圈 —— 平均是半圈。","算寻道距离时忘了从当前磁头位置起算。","把 DMA 说成「不需要中断」——DMA 传完**仍然要发中断**通知 CPU。"]},{"id":"os-sched","sub":"OS","t":"时间片轮转的一次调度","intro":"时钟中断 → 时间片判断 → 换人 → 上下文切换。这条链在 2026·45 那种定量题里要一步步数。","freq":["2019·45","2022·45","2026·45"],"chain":["时钟中断","时间片减 1","用完？","置就绪入队尾","选新进程","上下文切换"],"steps":[{"t":"时钟中断到来","who":"硬件","d":["每隔一个**时钟周期（tick）** 产生一次时钟中断，比如每 10ms 一次。","这是操作系统夺回 CPU 控制权的唯一手段——没有时钟中断，一个死循环就能霸占整台机器。"],"note":"「时间片」通常是 tick 的整数倍，比如时间片 50ms、tick 10ms，就是 5 个 tick。"},{"t":"更新时间片计数","who":"内核","d":["当前进程的剩余时间片减 1（或减一个 tick）。","如果还有剩余 → 直接中断返回，继续执行原进程，**不发生调度**。","如果减到 0 → 进入「时间片用完」分支。"],"note":"很多题问「中断了几次、调度了几次」——**中断次数 ≠ 调度次数**，大部分中断是空跑。"},{"t":"时间片用完：置就绪、插队尾","who":"内核","d":["把当前进程状态改为**就绪**，插入就绪队列**队尾**。","注意：这不是「阻塞」，进程没有任何等待事件，只是被剥夺了 CPU。","如果题目用「优先权 + 时间片」，这里还要按规则改优先权（2026·45：用完减 1，被抢不变）。"],"note":"区分「时间片用完 → 就绪」与「等 I/O → 阻塞」，这是调度题的第一道分水岭。"},{"t":"调度程序选下一个","who":"调度程序","d":["按算法从就绪队列取一个：FCFS 取队头、SJF 取最短、优先级取最高、RR 取队头。","优先级相同的时候，一般按「先进入就绪队列的优先」——题目若写了这句，就必须严格遵守。","如果新进程优先级更高且系统允许抢占，这里会发生**抢占**：原进程回就绪队列但**优先权不变**。"],"note":"「只有时间中断时才能抢占」这类限定，决定了新进程到达的那一刻**不能**立刻换人。"},{"t":"上下文切换","who":"内核","d":["保存原进程的 PC、寄存器、PSW 到它的 PCB；恢复新进程的现场；切换页表基址寄存器（可能刷 TLB）。","这部分是**纯开销**，不干任何有用的事。时间片越小，这部分占比越高。"],"note":"所以「时间片太小 → 开销大；时间片太大 → 退化成 FCFS，响应变慢」。"},{"t":"返回用户态，新进程开始跑","who":"硬件","d":["执行中断返回指令，CPU 从新进程的 PC 继续执行。","从这一刻起，调度「完成」了一次——统计调度次数时，算的是这里。"],"note":"画时间轴表时，「谁上 CPU」这一栏每变一次，调度次数就加 1。"}],"trap":["把「中断次数」当成「调度次数」——大部分时钟中断只是减计数，不换人。","以为进程一到达就能抢占——题目限定「只有时间中断才能抢占」时不行。","忘记「优先权相等时先来先服务」这条 tie-break 规则。"],"fig":{"kind":"grid","w":660,"ch":32,"head":["时刻","0","10","20","30","40","50","60"],"rows":[["中断","","★","★","★","★","★","★"],["调度","★P1","","","★P2","","★P1",""],["说明","上 CPU","时间片−1","时间片−1","P1 用完","P2 跑","轮转","结束"]],"cap":"中断次数 ≠ 调度次数：每个 tick 都中断，但只有时间片真的用完时才换人。2026·45 那种题就是靠这张表数出来的。"}},{"id":"co-cycle","sub":"CO","t":"一条指令的执行周期","intro":"取指 → 译码 → 取数 → 执行 → 存结果 → 查中断。所有指令都走这个骨架，区别只在「取数」和「执行」两步做什么。","freq":["2016·44","2020·44","2024·45"],"chain":["取指","译码","计算EA","取操作数","执行","存结果","查中断"],"steps":[{"t":"取指：PC → MAR → 主存 → MDR → IR","who":"CPU","d":["把 PC 的内容送 **MAR**，发读命令；主存把该单元内容送到 **MDR**；MDR 送 **IR**；同时 **PC + 1（或 + 指令长度）**。","这一串是**取指周期**的固定动作，任何指令都一样。","注意 PC 的「+1」是「加一个指令字长」，按字节编址时要加字节数。"],"note":"「取指后 PC 指向哪里」——指向**下一条指令**。相对寻址正是以这个值为基准。"},{"t":"译码：IR 的操作码送控制器","who":"控制单元","d":["IR 中的操作码字段送 **ID（指令译码器）**，译出这条指令要做什么。","同时判断寻址方式字段，决定后面要不要「计算有效地址」这一步。","寄存器寻址不需要访存；直接/间接/变址/相对都需要算 EA。"],"note":"「哪条指令不需要访存」——寄存器寻址和立即寻址都不需要（除了取指本身）。"},{"t":"计算有效地址 EA（间址周期）","who":"CPU","d":["按寻址方式算：直接 EA=A；间接 EA=(A)（还要再访存一次）；变址 EA=(IX)+A；相对 EA=(PC)+A。","一次间接寻址多一次访存，两次间接多两次——**访存次数是这类题的必考点**。","算出的 EA 送 MAR，准备取操作数。"],"note":"「指令执行共访存几次」= 取指 1 次 + 间址 n 次 + 取操作数 1 次 + （写结果 1 次）。"},{"t":"取操作数","who":"CPU","d":["按 EA 读主存，数据送 MDR，再送 ALU 的输入端（或通用寄存器）。","如果是寄存器操作数，直接从寄存器堆读，**不访存**。"],"note":"RISC 只有 load/store 能访存，其余指令全在寄存器之间做，这是 RISC 快的原因之一。"},{"t":"执行：ALU 运算","who":"ALU","d":["按操作码做加/减/与/或/移位等，结果送暂存寄存器。","同时产生**标志位**：ZF（结果为零）、SF（符号）、CF（进位/借位）、OF（溢出）。","标志位供后续的条件转移指令使用——这是「cmp + jle」能配合工作的原因。"],"note":"「cmp 指令做什么」——做减法但不保存结果，只置标志位。"},{"t":"存结果","who":"CPU","d":["结果写回通用寄存器，或按 EA 写回主存。","写主存时要发写命令，占用一个存储器周期。"],"note":"「写回」也是访存，算访存次数时别漏。"},{"t":"检查中断","who":"CPU","d":["在指令结束时采样中断请求线，有请求且允许中断就进入中断响应周期。","所以**中断只发生在指令边界**，一条指令内部不会被打断。"],"note":"这也是「指令周期 = 取指 + 间址 + 执行 + 中断」四个机器周期的由来。"}],"trap":["把「取指」算成不访存——取指本身就是一次访存。","间接寻址忘了多算访存次数。","以为中断可以在指令执行中间发生——只在指令结束时。"]},{"id":"co-cache","sub":"CO","t":"Cache 访问：命中与缺失","intro":"CPU 给出一个主存地址，先在 Cache 里找。找到就快，找不到就要去主存取一整块，还可能要先换出一块。","freq":["2010·44","2017·45","2022·44","2024·45"],"chain":["拆分地址","查标记","命中/缺失","读主存块","替换","写回脏块"],"steps":[{"t":"把主存地址拆成三段","who":"硬件","d":["**标记 tag | 组号/行号 index | 块内地址 offset**。","直接映射：index 位数 = log₂(行数)；全相联：没有 index；组相联：index = log₂(组数)。","块内地址位数 = log₂(块大小)。三段加起来必须等于主存地址位数。"],"note":"拆错段是这类题的第一大错。先算块内地址（块大小），再算 index（行数/组数），剩下的全是 tag。"},{"t":"用 index 定位到 Cache 行（或组）","who":"硬件","d":["直接映射：index 直接就是行号，只有一行可查。","组相联：index 定位到组，组内有 k 行，要**并行比较 k 个 tag**。","全相联：没有 index，要和**所有行**的 tag 并行比较（成本最高，命中率也最高）。"],"note":"「组相联是直接映射和全相联的折中」——组间直接映射，组内全相联。"},{"t":"比较 tag 与有效位","who":"硬件","d":["取出该行的 tag，与地址中的 tag 比较；同时看**有效位**是否为 1。","tag 相等 **且** 有效位为 1 → **命中**。任一不满足 → **缺失**。","有效位为 0 表示这行是空的（刚上电或刚被换出），tag 相同也不能用。"],"note":"「有效位是干什么的」——区分「这行有数据」和「这行的 tag 恰好相同但内容无效」。"},{"t":"命中：直接读出数据","who":"硬件","d":["按块内地址从该行中取出需要的字节/字，送到 CPU。","整个过程不需要访问主存，所以快。","如果是写操作，还要按**写策略**处理：写直达（同时写 Cache 和主存）或写回（只写 Cache，置脏位）。"],"note":"「写命中用写回，写不命中用写分配」是最常见的组合，但题目若指定 write-through，就照题目来。"},{"t":"缺失：向主存申请整块","who":"硬件","d":["**注意：读的是整个块，不是那一个字节。** 块大小 64B 时，读 1B 也要传 64B。","主存按块地址读出整块，送入 Cache 的空闲行（或替换掉某行）。","这一块的传输时间就是「缺失代价」，通常是命中时间的几十倍。"],"note":"「Cache 缺失时读多少」——读一整块。这是计算缺失代价的关键。"},{"t":"替换：选一个牺牲行","who":"硬件","d":["直接映射：没得选，只能替换那一行（所以冲突缺失最多）。","组相联/全相联：按 **LRU / FIFO / 随机** 选一行换出。LRU 需要额外的位记录访问历史。","如果被换出的行**脏位为 1**，必须先写回主存——这次写回会让缺失代价翻倍。"],"note":"「写回法的缺失代价为什么更高」——因为可能要多一次写主存。"},{"t":"更新 tag、有效位，返回数据","who":"硬件","d":["把新块的 tag 写入该行，有效位置 1，脏位清 0（刚读进来的和主存一致）。","然后把 CPU 要的那个字节送出去。","如果是写缺失 + 写分配：先把块读进来，再按写策略修改。"],"note":"「写不命中」有两种处理：写分配（先读块再写）和非写分配（直接写主存，不占 Cache）。"}],"trap":["地址分段时把「块内地址」算错——块大小 64B → 6 位，不是 8 位。","算命中率时把「读块」的次数算成「读字节」的次数。","忘了有效位，认为 tag 相同就是命中。"]},{"id":"co-dma","sub":"CO","t":"DMA 传输全过程","intro":"CPU 只负责「下命令」和「收尾」，中间搬数据全由 DMA 控制器完成。这是它与中断方式最本质的区别。","freq":["2011·44","2015·44","2021·44"],"chain":["CPU 初始化","启动","DMA 请求总线","直接读写主存","计数归零","发中断"],"steps":[{"t":"CPU 初始化 DMA 控制器","who":"CPU","d":["往 DMA 控制器写三个东西：**主存起始地址**、**传送字节数（计数初值）**、**传送方向**（读设备/写设备）。","再写控制寄存器：是否允许中断、通道优先级、传送方式（单字节/成组/透明）。","这一步是纯软件/端口写操作，很快。"],"note":"「DMA 控制器里有哪些寄存器」——地址、计数、控制/状态，三个是必答的。"},{"t":"CPU 启动 DMA，然后继续干自己的活","who":"CPU","d":["CPU 发一条「启动 DMA」命令后**立即返回**，继续执行其他程序。","这就是 DMA 快的根本原因：**CPU 不参与数据搬运**，只出一个初始化。"],"note":"对比程序查询方式：CPU 要一直轮询状态寄存器，什么也干不了。"},{"t":"设备准备好一个数据，DMA 发总线请求","who":"DMA 控制器","d":["设备把数据送到 DMA 控制器的数据缓冲寄存器，DMA 向 CPU 发 **总线请求（HOLD/BR）**。","CPU 在当前**总线周期结束后**响应，发出**总线允许（HLDA/BG）**，让出总线控制权。","注意：DMA 抢的是**总线**，不是 CPU 执行权。CPU 可以让出总线但继续用 Cache 里的数据。"],"note":"「DMA 期间 CPU 完全停止吗」——不一定。CPU 可以用 Cache 里的指令和数据继续跑（周期挪用）。"},{"t":"DMA 直接在主存和设备间搬数据","who":"DMA 控制器","d":["DMA 控制器把地址送上地址总线、数据送上数据总线，**直接写主存或从主存读**，全程不经过 CPU 寄存器。","每传一个数据，**地址寄存器 +1、计数寄存器 −1**。","传输方式有三种：**停止 CPU 访存**（成块传，最快但 CPU 停）、**周期挪用**（偷一个周期）、**交替访问**（分时）。"],"note":"「周期挪用」是考试最爱问的：DMA 偷走一个存储周期，CPU 延迟一个周期，影响最小。"},{"t":"计数归零，传输结束","who":"DMA 控制器","d":["计数寄存器减到 0，DMA 知道这一批传完了，**撤销总线请求**，把总线还给 CPU。","同时把状态寄存器的「完成」位置 1。"],"note":"「DMA 传完后 CPU 怎么知道」——靠中断。所以 DMA **仍然需要中断**，只是从「每个字节一次」变成「每批一次」。"},{"t":"发中断，CPU 做收尾","who":"DMA → CPU","d":["DMA 控制器向 CPU 发中断请求，CPU 执行中断服务程序：检查状态、处理数据、唤醒等待的进程。","一次传输只中断一次，这是 DMA 效率高的第二个原因。"],"note":"「DMA 与中断的区别」标准答案三条：① 数据不经过 CPU；② 传的是数据块不是字；③ 只在结束时中断一次。"}],"trap":["说「DMA 不需要中断」——错，结束时仍要中断。","说「DMA 期间 CPU 一定停机」——不一定，取决于传送方式。","把 DMA 的「周期挪用」说成「抢 CPU」——抢的是总线/存储周期。"],"fig":{"kind":"flow","w":660,"cols":4,"nodes":[{"t":"CPU 初始化","s":"地址 / 计数 / 方向","c":"gold"},{"t":"启动 DMA","s":"CPU 随即返回","c":"blue"},{"t":"设备就绪","s":"数据进缓冲寄存器","c":"gray"},{"t":"总线请求","s":"HOLD / HLDA","c":"rust"},{"t":"直接读写主存","s":"不经 CPU 寄存器","c":"green"},{"t":"地址 +1 计数 −1","s":"循环直到归零","c":"green"},{"t":"发中断","s":"整批只中断一次","c":"gold"}],"cap":"DMA 快的两个原因：数据不经过 CPU；整批只中断一次。但初始化和收尾仍要 CPU，「DMA 完全不需要 CPU」是错的。"}},{"id":"co-pipe","sub":"CO","t":"指令流水线一次执行","intro":"五段流水，理想情况下每个周期完成一条指令。但冲突会让它停顿——三种冲突是必考点。","freq":["2011·44","2014·44","2020·44","2023·45"],"chain":["IF","ID","EX","MEM","WB"],"steps":[{"t":"IF：取指","who":"取指部件","d":["用 PC 取指令送 IR，PC 加指令长度。","多条指令同时在流水线上时，PC 要能「提前」给出后面几条的地址——所以需要指令预取。"],"note":"结构冲突常发生在这里：取指要访存，MEM 段也要访存，两者争同一个存储器。"},{"t":"ID：译码 + 取寄存器","who":"译码部件","d":["译出操作码，同时从寄存器堆读出源操作数。","**数据冲突**最常在这里暴露：后面这条要读的寄存器，正是前面那条还没写回的。"],"note":"解决数据冲突的办法：**转发/旁路**（提前把结果送过来）、**停顿**、**编译调度**。"},{"t":"EX：执行","who":"ALU","d":["算术逻辑运算，或计算访存地址。","**控制冲突**（转移指令）在这里产生：转移是否发生要等条件码算出来，而取指已经取了后面的指令。"],"note":"解决控制冲突：**延迟槽**、**分支预测**（静态/动态）、**提前算转移条件**。"},{"t":"MEM：访存","who":"存储器","d":["load 读数据，store 写数据。只有 load/store 走这一段（RISC）。","与 IF 段争存储器 → **结构冲突**。解决办法：指令 Cache 与数据 Cache 分开（哈佛结构）。"],"note":"「为什么要把 I-Cache 和 D-Cache 分开」——就是为了消除 IF 与 MEM 的结构冲突。"},{"t":"WB：写回","who":"寄存器堆","d":["把结果写回目标寄存器。","写回发生在周期末尾，而 ID 段读寄存器在周期开始——**「前半周期写、后半周期读」** 可以让相邻指令免于停顿。"],"note":"这个「读写错开半拍」的技巧叫寄存器堆的内部分时，是流水线设计的基本功。"},{"t":"算加速比与吞吐率","who":"—","d":["理想情况：k 段流水线执行 n 条指令需 **k + (n−1)** 个周期，不用流水线要 **k×n** 个周期。","加速比 S = k×n / (k + n − 1)，当 n → ∞ 时 S → k。**所以加速比不可能超过段数 k。**","吞吐率 = n / (k + n − 1) 条/周期。"],"note":"「流水线段数越多越好吗」——不是。段数多，每段做的事少，但寄存器开销和冲突概率上升。"}],"trap":["加速比算成 k —— 那是 n→∞ 的极限，实际要按公式算。","把「结构冲突」和「数据冲突」搞混：争同一个部件是结构，读写同一个寄存器是数据。","忘记「流水线充满需要 k 个周期」这个启动开销。"],"fig":{"kind":"grid","w":660,"ch":30,"head":["指令","1","2","3","4","5","6","7"],"rows":[["I1","★IF","★ID","★EX","★MEM","★WB","",""],["I2","","★IF","★ID","★EX","★MEM","★WB",""],["I3","","","★IF","★ID","★EX","★MEM","★WB"]],"cap":"三条指令占 7 个周期：k + (n−1) = 5 + 2。流水线的启动开销就是「灌满」的那 k−1 个周期，所以短程序用流水线反而可能更慢。"}},{"id":"co-iomode","sub":"CO","t":"三种 I/O 方式：查询 / 中断 / DMA","intro":"同一件事——把设备数据搬进内存——三种做法，效率差几十倍。对比着记最省力。","freq":["2012·44","2018·44","2021·44"],"chain":["程序查询","程序中断","DMA"],"steps":[{"t":"程序查询：CPU 死等","who":"CPU","d":["CPU 反复读设备状态寄存器，直到「就绪」为止，然后自己把数据从设备寄存器搬到内存。","**CPU 全程被占用**，什么也干不了。优点是硬件最简单，不需要中断机制。","适合：设备很少、CPU 很闲的嵌入式场景。"],"note":"「查询方式的 CPU 利用率」——极低，等于设备速度决定一切。"},{"t":"程序中断：CPU 先干别的","who":"CPU + 设备","d":["CPU 发启动命令后返回；设备准备好后**发中断**，CPU 停下当前工作去搬运**一个字**。","每传一个字就中断一次，中断次数 = 数据量。所以数据量大时，中断开销仍然很大。","优点：CPU 利用率大幅提高；缺点：频繁中断，上下文切换开销大。"],"note":"「中断方式下 CPU 还要搬数据吗」——要。数据仍要经过 CPU 寄存器。"},{"t":"DMA：CPU 只下命令","who":"DMA 控制器","d":["CPU 初始化地址、计数、方向后返回；DMA 控制器直接在主存与设备间搬**整块**数据，全程不经 CPU。","只在整批传完时中断一次。","优点：CPU 几乎不参与，适合高速块设备（磁盘、网卡）；缺点：硬件复杂，需要总线仲裁。"],"note":"三种方式的数据通路：查询/中断都过 CPU；DMA 不过 CPU。"},{"t":"通道 / IOP：更进一步","who":"通道处理器","d":["通道是一台**专用的 I/O 处理机**，能执行自己的通道程序，管理多台设备。","CPU 只需发一条「启动通道」指令，通道自己去取通道程序、控制设备、组织数据块。","大型机常用，408 只需知道「通道 = 更强的 DMA，能执行通道程序」。"],"note":"四级演进：查询 → 中断 → DMA → 通道。每一步都是「让 CPU 少管一点」。"}],"trap":["把「中断方式」说成 CPU 不搬数据——仍然要搬，只是不用等。","把「DMA」说成完全不需要 CPU——初始化和收尾都要 CPU。","问「哪种方式 CPU 利用率最高」——通道 > DMA > 中断 > 查询。"]},{"id":"ds-quick","sub":"DS","t":"快速排序的一趟划分","intro":"快排的全部难点在「一趟划分」：两个指针从两头往中间走，把比枢轴小的甩到左边、大的甩到右边。","freq":["2011·41","2019·41","2023·41"],"chain":["选枢轴","挖坑","右指针左移","左指针右移","填坑","递归"],"steps":[{"t":"选枢轴，挖坑","who":"算法","d":["取第一个元素 `pivot = A[low]`，此时 `A[low]` 位置空出来，形成一个**坑**。","用「挖坑填数法」比「交换法」写得清楚，也不容易错。","枢轴的选择影响性能：取首元素在有序数据上会退化成 O(n²)。"],"note":"「快排最坏情况」——数据已有序或逆序，每次划分只减少一个元素，退化为 O(n²)。"},{"t":"右指针左移，找比枢轴小的","who":"指针 high","d":["`high` 从右往左扫，跳过所有 ≥ pivot 的元素，停在第一个 < pivot 的位置。","把这个元素填进左边的坑，`high` 位置变成新坑。","**必须先动 high 再动 low**（以首元素为枢轴时），否则最后相遇点不是正确位置。"],"note":"这个「先动哪个指针」的顺序，是快排手写题最高频的错误。"},{"t":"左指针右移，找比枢轴大的","who":"指针 low","d":["`low` 从左往右扫，跳过所有 ≤ pivot 的元素，停在第一个 > pivot 的位置。","把它填进右边的坑，`low` 位置变成新坑。","重复「右移左、左移右」，直到 `low == high`。"],"note":"每一步都要判断 `low < high`，否则指针会越界。"},{"t":"相遇处填回枢轴","who":"算法","d":["`low == high` 时，这个位置就是枢轴的最终位置，把 pivot 填进去。","此时**左边全部 ≤ pivot，右边全部 ≥ pivot**，枢轴到位，且不会再动。"],"note":"「一趟划分后枢轴的位置」——就是它的**最终位置**，这是快排题常问的一句。"},{"t":"递归两半","who":"算法","d":["对 `[low, pivotpos−1]` 和 `[pivotpos+1, high]` 分别递归。","递归深度平均 O(log n)，最坏 O(n)——所以最坏空间复杂度是 O(n)，来自递归栈。"],"note":"「快排的空间复杂度」——O(log n) 平均，O(n) 最坏，来自递归工作栈，不是来自数组。"},{"t":"复杂度与稳定性","who":"—","d":["时间：平均 O(n log n)，最坏 O(n²)；空间：O(log n)。","**不稳定**：划分时的跳跃交换会打乱相同关键字的相对次序。","「快排什么时候最慢」——基本有序时最慢，此时选中间元素作枢轴可以缓解。"],"note":"四个不稳定排序：**快排、希尔、堆排、选择**。記住这四个，其余都稳定。"}],"trap":["先动 low 后动 high —— 相遇点会错，枢轴填进去后左边不满足「全部 ≤」。","把空间复杂度说成 O(1) —— 递归栈要算进去。","认为快排稳定 —— 不稳定。"]},{"id":"ds-avl","sub":"DS","t":"AVL 树插入与四种旋转","intro":"插入一个结点后，从插入点往上找第一个不平衡的结点，看它哪边高，决定用哪种旋转。","freq":["2013·41","2019·41","2022·41"],"chain":["插入","回溯找失衡点","判断型","旋转","更新高度"],"steps":[{"t":"按 BST 规则插入，挂在叶子上","who":"算法","d":["比当前结点小往左、大往右，一直走到空位置，把新结点挂上。","新结点一定是叶子，且它的**平衡因子 = 0**。","插入只会让祖先的平衡因子变化（±1），不会影响其他子树。"],"note":"「插入后可能失衡的结点」——只可能是插入点到根这条路径上的结点。"},{"t":"往上回溯，找第一个失衡点","who":"算法","d":["平衡因子 BF = 左子树高 − 右子树高。|BF| ≤ 1 才算平衡。","从插入点往上走，第一个 |BF| = 2 的结点记作 **A**，它就是最小失衡子树的根。","**只需要调整 A 这一棵子树**，上面的结点会自然恢复平衡。"],"note":"「最少调整几次」——一次。这是 AVL 比普通 BST 好维护的关键。"},{"t":"判断类型：看 A 的哪边高、孩子哪边高","who":"算法","d":["看 A 的**较高子树**在哪边（左/右），再看那个孩子的**较高子树**在哪边（左/右）。","LL（左左）→ 右单旋；RR（右右）→ 左单旋；LR（左右）→ 先左后右双旋；RL（右左）→ 先右后左双旋。","记忆法：**名字里的两个字母，就是「从 A 往下走两步」的方向**。"],"note":"「LR 是先左旋还是先右旋」——先对 A 的左孩子左旋，再对 A 右旋。顺序反了就转不回来。"},{"t":"执行旋转","who":"算法","d":["**右单旋（LL）**：A 的左孩子 B 上位，A 变成 B 的右孩子，B 原来的右子树挂到 A 的左边。","**左单旋（RR）**：对称操作。","**双旋（LR）**：先对 B 左旋变成 LL 型，再对 A 右旋。"],"note":"旋转只改指针，不改中序序列——所以旋转后仍是 BST。"},{"t":"更新高度与平衡因子","who":"算法","d":["旋转后要**自底向上**重算受影响结点的高度（取左右子树高的较大者 +1）。","BF 随之更新。别忘了这一步——很多手写题因为没更新高度而被扣分。"],"note":"「旋转后树高变了吗」——最小失衡子树的高度恢复到插入前，所以整体高度不变。"}],"trap":["把 LR 写成「先右后左」——LR 是左孩子的右子树上，先左旋再右旋。","旋转后忘记更新高度/平衡因子。","以为插入后可能要调整多个结点——一次旋转即可。"]},{"id":"ds-kmp","sub":"DS","t":"KMP：next 数组怎么算，怎么滑","intro":"暴力匹配失配后主串指针要回退，KMP 让主串指针永不回退，只滑模式串。滑多远由 next 数组决定。","freq":["2015·41","2019·41","2024·41"],"chain":["求 next","比较","失配","按 next 滑动","继续比较"],"steps":[{"t":"next 数组的含义","who":"—","d":["`next[j]` = 模式串前 j 个字符组成的子串中，**最长相等前后缀的长度**（有的教材定义为这个长度 +1，注意题目用哪种）。","它的作用是：失配时，模式串前面已经匹配的那一段里，有一段前缀等于后缀，可以直接挪过去，不用从头比。","`next[1] = 0`（或 −1），这是人为规定的哨兵。"],"note":"两种定义（0 起始 / 1 起始）数值差 1，答题时**先看题目怎么定义**，别硬套。"},{"t":"手算 next：找最长相等前后缀","who":"—","d":["以 `ababaa` 为例：`next` = 0,0,0,1,2,3（1 起始、长度为值）。","做法：对每个前缀，从长到短试「前缀 == 后缀」，第一个成立的长度就是答案。","更快的办法是递推：`next[j] = next[j−1] + 1`（若 P[j−1] == P[next[j−1]]），否则继续往前跳。"],"note":"「aba」的最长相等前后缀是「a」，长度 1，不是 3——前后缀不能是整个串本身。"},{"t":"匹配：逐字符比较","who":"算法","d":["主串指针 i、模式串指针 j 都从 1 开始，相等就同时 +1。","**不相等时，i 不动，j 回退到 next[j]**。这就是 KMP 与暴力的唯一区别。","j 退到 0 时，说明模式串第一个字符都不匹配，i 前进一步，j 回到 1。"],"note":"「主串指针会回退吗」——不会。这是 KMP 是 O(n+m) 的根本原因。"},{"t":"滑动而不是重比","who":"算法","d":["j 回退到 next[j]，等价于「把模式串向右滑 j − next[j] 位」。","前面 next[j] 个字符已经确认匹配（因为它们是已匹配部分的后缀，等于前缀），不用再比。","这就是「利用已匹配信息」的含义。"],"note":"「KMP 的比较次数与什么有关」——只与主串和模式串的内容有关，与主串长度线性相关。"},{"t":"nextval：再优化一步","who":"—","d":["如果 `P[j] == P[next[j]]`，那么回退到 next[j] 后一定会再次失配，这一趟白退。","于是令 `nextval[j] = nextval[next[j]]`，直接跳到更前面。","`nextval` 只在「回退后的字符和当前字符相同」时才和 next 不同。"],"note":"「next 和 nextval 什么时候相同」——模式串没有连续重复字符时相同。"}],"trap":["把 next 定义搞混（长度 vs 长度+1），整张表差 1。","以为失配时主串指针也要回退——那是暴力算法。","求 next 时把整个串本身当成前后缀。"]},{"id":"cn-hand","sub":"CN","t":"TCP 三次握手","intro":"三次不是为了「打招呼」，是为了让双方都确认「我能发、你能收」并且同步初始序号。","freq":["2011·47","2016·47","2020·47","2024·47"],"chain":["SYN","SYN+ACK","ACK","ESTABLISHED"],"steps":[{"t":"第一次：客户端发 SYN","who":"客户端","d":["客户端选一个初始序号 `seq = x`，置 **SYN = 1**，发送 SYN 报文段。","**SYN 报文不携带数据，但消耗一个序号**——所以下次发数据时 seq = x+1。","客户端进入 **SYN-SENT** 状态。"],"note":"「SYN 占不占序号」——占。FIN 也占。这是计算确认号时最常错的地方。"},{"t":"第二次：服务端回 SYN+ACK","who":"服务端","d":["服务端选自己的初始序号 `seq = y`，置 **SYN = 1、ACK = 1**，`ack = x + 1`。","含义有两层：**我收到你的 SYN 了（ack=x+1）**，**我也想和你建连接（SYN=1）**。","服务端进入 **SYN-RCVD** 状态。"],"note":"「为什么第二次要合并」——因为一个报文段可以同时携带 SYN 和 ACK，省一次往返。"},{"t":"第三次：客户端回 ACK","who":"客户端","d":["客户端置 **ACK = 1**，`seq = x + 1`，`ack = y + 1`。","这个报文**可以携带数据**（有些实现是这样的），也可以不带。","双方进入 **ESTABLISHED**，连接建立。"],"note":"「第三次握手的报文能带数据吗」——能。前两次不能。"},{"t":"为什么必须是三次，两次不行","who":"—","d":["两次的话，服务端无法确认「客户端收到了我的 SYN」。","更实际的原因：**防止旧的、失效的连接请求报文突然到达服务端**，导致服务端白白建立连接、浪费资源。","三次之后，双方都确认了「对方的发送能力和自己的接收能力都正常」，且序号已同步。"],"note":"「三次握手能防什么」——防历史失效连接请求，不是防攻击。SYN Flood 恰恰是利用半连接。"},{"t":"SYN Flood 与半连接队列","who":"—","d":["攻击者大量发 SYN 但不回第三次 ACK，服务端维护大量 **SYN-RCVD** 的半连接，队列被占满。","防御手段：SYN Cookie（不立即分配资源）、缩短超时、增大队列。","这条常作为「三次握手的副作用」出现在选择题里。"],"note":"「半连接队列满会怎样」——新的 SYN 被丢弃，正常用户连不上。"}],"trap":["把第二次握手写成只回 ACK——必须是 SYN+ACK。","算 ack 号时忘了 SYN 占一个序号（应为 x+1 而不是 x）。","说三次握手是为了「可靠性」——真正的原因是同步序号 + 防失效连接。"],"fig":{"kind":"seq","w":660,"actors":["客户端","服务端"],"msgs":[[0,1,"SYN = 1，seq = x"],[1,0,"SYN = 1，ACK = 1，seq = y，ack = x+1"],[0,1,"ACK = 1，seq = x+1，ack = y+1"],[0,1,"可以开始发数据了",{"dash":true,"c":"green"}]],"cap":"SYN 和 FIN 各占一个序号，所以确认号要 +1。两次不够，是因为服务端无法确认「客户端收到了我的 SYN」，也防不住历史失效的连接请求。"}},{"id":"cn-close","sub":"CN","t":"TCP 四次挥手与 TIME_WAIT","intro":"建立是三次，释放是四次——因为 TCP 是全双工，两个方向要各自关闭。","freq":["2012·47","2018·47","2021·47","2025·47"],"chain":["FIN","ACK","FIN","ACK","TIME_WAIT","CLOSED"],"steps":[{"t":"第一次：主动关闭方发 FIN","who":"客户端","d":["客户端发 `FIN = 1`，`seq = u`，表示「我没有数据要发了」。","客户端进入 **FIN-WAIT-1**。","**FIN 报文也占一个序号**，所以对方确认号是 u+1。"],"note":"「FIN 之后还能发数据吗」——不能。但**还能接收**数据，因为连接是半关闭的。"},{"t":"第二次：服务端回 ACK","who":"服务端","d":["服务端回 `ACK = 1`，`ack = u + 1`，`seq = v`。","服务端进入 **CLOSE-WAIT**，客户端进入 **FIN-WAIT-2**。","此时连接处于**半关闭**状态：客户端不再发数据，但服务端还能继续发。"],"note":"「为什么第二次和第三次不能合并」——服务端可能还有数据没发完，必须先确认再发 FIN。"},{"t":"第三次：服务端发 FIN","who":"服务端","d":["服务端把剩余数据发完，再发 `FIN = 1`，`ack = u + 1`，`seq = w`。","服务端进入 **LAST-ACK**。","如果在收到 FIN 后没有数据要发，第二、三次可以合并成一个报文——这就是「四次变三次」的情况。"],"note":"「什么时候挥手只有三次」——服务端收到 FIN 时正好没有数据要发。"},{"t":"第四次：客户端回 ACK","who":"客户端","d":["客户端回 `ACK = 1`，`ack = w + 1`，`seq = u + 1`。","客户端进入 **TIME-WAIT**，等待 **2MSL** 后才能真正关闭。","服务端收到 ACK 后进入 **CLOSED**。"],"note":"「谁先关闭谁进 TIME_WAIT」——主动关闭方。所以服务端主动关闭时，TIME_WAIT 在服务端。"},{"t":"TIME_WAIT 为什么要等 2MSL","who":"—","d":["**① 保证最后一个 ACK 能到达对方。** 如果 ACK 丢了，对方会重发 FIN，此时还在 TIME_WAIT 的这一方还能再回一次 ACK。","**② 让本次连接的所有报文在网络中消失。** 防止它们干扰下一次用相同四元组建立的新连接。","MSL 是报文最大生存时间，一来一回就是 2MSL。"],"note":"「大量 TIME_WAIT 有什么危害」——占用端口和内存，高并发短连接服务器上很常见。"}],"trap":["把四次挥手说成「因为要可靠」——原因是全双工，两个方向各关一次。","以为 TIME_WAIT 是被动关闭方的事——是主动关闭方。","算确认号时忘了 FIN 占一个序号。"]},{"id":"cn-cc","sub":"CN","t":"TCP 拥塞控制四阶段","intro":"慢开始、拥塞避免、快重传、快恢复。四个阶段靠 ssthresh 和三个重复 ACK 串联起来。","freq":["2013·47","2017·47","2022·47","2025·47"],"chain":["慢开始","到阈值","拥塞避免","超时/三重复ACK","快重传","快恢复"],"steps":[{"t":"慢开始：拥塞窗口指数增长","who":"发送方","d":["初始 `cwnd = 1 MSS`，每收到一个 ACK 就 +1，**每经过一个 RTT，cwnd 翻倍**。","增长很快：1→2→4→8→16……","直到 `cwnd ≥ ssthresh`，切换到拥塞避免。"],"note":"「慢开始慢吗」——名字骗人，它是指数增长，一点都不慢。"},{"t":"拥塞避免：每个 RTT 只加 1","who":"发送方","d":["从指数增长改成**线性增长**：每个 RTT `cwnd` 只加 1 个 MSS。","这就是「加法增大（AI）」。目的是逼近网络容量时不要太猛，避免一下子把网络压垮。"],"note":"「拥塞避免阶段 cwnd 会下降吗」——不会，只会涨，直到超时或三个重复 ACK。"},{"t":"超时：乘法减小 + 回到慢开始","who":"发送方","d":["发生**超时重传**（说明网络严重拥塞）：`ssthresh = cwnd / 2`，`cwnd = 1`，重新慢开始。","这是「乘法减小（MD）」。阈值减半、窗口归 1，惩罚最重。"],"note":"「超时后 cwnd 变成多少」——1 个 MSS，不是 ssthresh。"},{"t":"三个重复 ACK：快重传","who":"接收方 + 发送方","d":["接收方收到失序报文段时，**立即重复发送上一个已确认的 ACK**，不要等自己的发送窗口。","发送方连续收到 **3 个重复 ACK**，就知道某个报文段丢了，**立刻重传**，不等超时计时器。","这就是「快重传」——比等超时快得多。"],"note":"「为什么是 3 个」——偶然的乱序也可能产生 1~2 个重复 ACK，3 个才能较可靠地判定丢包。"},{"t":"快恢复：不回到 1","who":"发送方","d":["既然只是单个报文段丢失、网络还没严重拥塞，就不必把 cwnd 打回 1。","做法：`ssthresh = cwnd / 2`，`cwnd = ssthresh`，然后**直接进入拥塞避免**（线性增长）。","这就是「快恢复」——跳过慢开始。"],"note":"「快恢复和慢开始的区别」——快恢复把 cwnd 设为 ssthresh，不归 1。"},{"t":"把四个阶段串成一条曲线","who":"—","d":["画图时：慢开始是指数上升的曲线，到 ssthresh 后变直线（拥塞避免），超时后垂直掉到 1，三重复 ACK 后掉到一半。","题目常给「第 n 个 RTT 时 cwnd 是多少」，就是让你按段套规则算。","**画图时横轴是 RTT（传输轮次），纵轴是 cwnd**，别把时间当横轴。"],"note":"「发送窗口取谁的最小值」——`min(拥塞窗口, 接收窗口)`。这是流量控制与拥塞控制的分界。"}],"trap":["超时后把 cwnd 设成 ssthresh —— 应该设成 1，重新慢开始。","快恢复时把 cwnd 设成 1 —— 应该设成 ssthresh，直接进拥塞避免。","把「流量控制」和「拥塞控制」混为一谈：前者看接收方，后者看网络。"],"fig":{"kind":"curve","w":660,"h":260,"xmax":14,"ymax":26,"xlab":"传输轮次 RTT","ylab":"拥塞窗口 cwnd","xticks":[[0,"0"],[4,"4"],[8,"8"],[12,"12"]],"yticks":[[0,"0"],[8,"8"],[16,"16"],[24,"24"]],"series":[{"pts":[[0,1],[1,2],[2,4],[3,8],[4,16],[5,17],[6,18],[7,19],[8,20],[8,1],[9,2],[10,4],[11,8],[12,9],[13,10]],"c":"blue","label":"cwnd","dots":false}],"vlines":[[4,"ssthresh = 16"],[8,"超时"]],"cap":"慢开始是指数涨（1→2→4→8→16），到阈值转线性；超时后阈值减半、窗口归 1，重新慢开始。如果是三个重复 ACK，走快恢复：窗口设为阈值一半，直接线性。"}},{"id":"cn-web","sub":"CN","t":"一次 Web 请求的完整旅程","intro":"在地址栏敲一个网址到页面出现，中间跨了五层协议、四种协议、两次握手。这条链是所有计网大题的底稿。","freq":["2013·47","2019·47","2023·47"],"chain":["DNS 解析","ARP 找网关","TCP 握手","HTTP 请求","路由转发","HTTP 响应","渲染"],"steps":[{"t":"① DNS 解析：域名 → IP","who":"应用层","d":["先查**浏览器缓存** → 系统 hosts → 本地 DNS 服务器。","本地 DNS 没有就问**根域名服务器**（返回顶级域服务器地址）→ **顶级域服务器**（返回权威服务器地址）→ **权威服务器**（返回 IP）。","这个过程通常是**递归查询 + 迭代查询**的组合：主机到本地 DNS 是递归，本地 DNS 向上是迭代。"],"note":"「DNS 默认用 UDP 还是 TCP」——UDP 53；区域传送和响应超过 512B 时用 TCP。"},{"t":"② ARP：把网关 IP 换成 MAC","who":"链路层","d":["本机发现目的 IP 不在同一网段，于是要把包发给**默认网关**。","查 ARP 缓存有没有网关的 MAC；没有就**广播 ARP 请求**（目的 MAC 全 F），网关单播回复。","拿到网关 MAC 后，以太网帧的目的地址填网关，**目的 IP 仍是服务器的 IP**。"],"note":"「跨网段通信时，目的 MAC 是谁」——网关的 MAC，不是服务器的。这是最高频的选择题之一。"},{"t":"③ TCP 三次握手","who":"传输层","d":["与服务器 443 端口建立连接：SYN → SYN+ACK → ACK。","如果是 HTTPS，握手之后还有 **TLS 握手**（证书验证、密钥协商），再多 2 个 RTT。","HTTP/1.1 默认长连接，后续请求复用这条连接。"],"note":"「HTTPS 比 HTTP 慢多少」——多出 TLS 握手的往返，通常 2 个 RTT 左右。"},{"t":"④ 发送 HTTP 请求","who":"应用层","d":["构造请求行（方法 + URL + 版本）、请求头（Host、User-Agent、Cookie、Accept）、请求体（POST 时）。","经 TCP 分段、IP 分组、以太网成帧，逐层封装下送。","**每一层都加自己的首部**，这就是「封装」。"],"note":"「MTU 1500 时一个 TCP 段最多多少数据」——1500 − 20(IP) − 20(TCP) = 1460 字节。"},{"t":"⑤ 路由转发：逐跳走","who":"网络层","d":["每个路由器收到包，查**转发表**（按最长前缀匹配），把包从相应端口转发出去。","**源 IP 和目的 IP 全程不变**；**源 MAC 和目的 MAC 每跳都变**。","TTL 每经过一个路由器减 1，减到 0 就丢弃并回 ICMP 超时。"],"note":"「哪些地址变、哪些不变」——IP 不变、MAC 每跳变、端口不变。这条必背。"},{"t":"⑥ 服务器处理并回 HTTP 响应","who":"服务端","d":["服务器解析请求，查缓存/查数据库/执行后端逻辑，生成 HTML。","回响应：状态行（200 OK）、响应头（Content-Type、Content-Length、Cache-Control）、响应体。","如果开了 CDN，这一步可能由离用户最近的边缘节点完成。"],"note":"「状态码 301 和 302 的区别」——301 永久重定向（会被缓存），302 临时。"},{"t":"⑦ 浏览器解析渲染","who":"浏览器","d":["解析 HTML 构建 DOM 树，解析 CSS 构建 CSSOM，合并成渲染树，布局（reflow），绘制（repaint）。","遇到 `<img>`、`<script>` 等资源，**再次发起上述全部流程**（可能复用连接）。","这就是「一个网页几十个请求」的来源。"],"note":"「为什么把 CSS 放头部、JS 放底部」——CSS 阻塞渲染，JS 阻塞解析。"}],"trap":["以为跨网段时目的 MAC 是服务器 MAC —— 是网关 MAC。","以为 IP 会随跳数变化 —— 只有 MAC 变，IP 不变（NAT 除外）。","把 DNS 的递归/迭代搞反 —— 主机→本地是递归，本地→上级是迭代。"],"fig":{"kind":"flow","w":660,"cols":4,"nodes":[{"t":"DNS 解析","s":"域名 → IP","c":"blue"},{"t":"ARP","s":"IP → 网关 MAC","c":"gold"},{"t":"TCP 握手","s":"443 端口","c":"rust"},{"t":"HTTP 请求","s":"GET /index.html","c":"green"},{"t":"逐跳转发","s":"查表 · TTL−1 · 换 MAC","c":"gray"},{"t":"服务器响应","s":"200 OK + HTML","c":"green"},{"t":"解析渲染","s":"DOM + CSSOM → 绘制","c":"gold"},{"t":"遇到资源","s":"再来一遍","c":"gray"}],"cap":"这条链能串起几乎所有考点：DNS 的递归迭代、ARP 跨网段、TCP 握手、HTTP 报文、IP 转发时哪些地址变哪些不变、MTU 与分片。大题问「描述访问过程」就按这八步写。"}},{"id":"cn-dhcp","sub":"CN","t":"DHCP 四步：DISCOVER/OFFER/REQUEST/ACK","intro":"一台刚插上网线的机器，什么都不知道——连自己的 IP 都没有。它怎么开口说话？靠广播。","freq":["2012·47","2018·47","2024·47"],"chain":["DISCOVER","OFFER","REQUEST","ACK"],"steps":[{"t":"DISCOVER：客户端广播找服务器","who":"客户端","d":["源 IP **0.0.0.0**，目的 IP **255.255.255.255**（受限广播），源 MAC 是自己的，目的 MAC 全 F。","用 **UDP**，客户端端口 68，服务器端口 67。","报文里可以带「我希望的 IP」，也可以不带。"],"note":"「为什么用广播」——客户端还不知道服务器在哪，也不知道自己在哪个网段。"},{"t":"OFFER：服务器回应可提供的地址","who":"服务器","d":["服务器从地址池里挑一个没被占用的 IP，连同**子网掩码、默认网关、DNS 服务器、租期**一起发回。","仍然是广播（因为客户端还没有 IP），或者按请求里的 MAC 单播。","可能有多个服务器同时 OFFER，客户端选一个。"],"note":"「DHCP 分配的不只是 IP」——还有掩码、网关、DNS，这四个是标配。"},{"t":"REQUEST：客户端广播确认选择","who":"客户端","d":["客户端**仍然用广播**，说「我选了这个服务器给的地址」。","为什么广播而不是单播？因为要让**其他也给过 OFFER 的服务器知道**：你们提供的地址可以回收了。","报文里带上服务器标识。"],"note":"「REQUEST 为什么是广播」——这是 DHCP 四步里最爱考的一问。"},{"t":"ACK：服务器最终确认","who":"服务器","d":["服务器回 ACK，正式把地址租给客户端，租期开始计时。","客户端收到 ACK 后，还要做一件重要的事：**用 ARP 检测这个 IP 有没有被别人占用**（免费 ARP）。","如果发现冲突，客户端会发 DECLINE，重新申请。"],"note":"「租期到了怎么办」——续租：租期过半时单播发 REQUEST 给原服务器。"},{"t":"跨网段时的中继","who":"DHCP 中继","d":["DHCP 广播不会跨路由器。如果服务器在别的网段，需要**DHCP 中继代理**把广播转成单播发给服务器。","中继在转发时会填入「客户端所在网段」，服务器据此分配对应网段的地址。","这就是「一个 DHCP 服务器管多个网段」的实现方式。"],"note":"「DHCP 能跨网段吗」——能，但要中继。"}],"trap":["把第二步写成 ACK —— 第二步是 OFFER。","以为 REQUEST 是单播 —— 是广播。","以为 DHCP 只给 IP —— 还有掩码、网关、DNS。"]}]};
</script>
<script>
/* ==========================================================================
   图解引擎：把声明式的图数据渲染成内联 SVG
   支持的 kind：
     bits   位段条（指令格式 / IEEE754 / 地址切分 / 子网）
     flow   流程框 + 箭头（封装 / 缺页 / 中断 / 请求链路）
     seq    时序图（握手 / 挥手 / 缓冲）
     graph  有向图 / 状态机 / 树（节点 + 边）
     curve  坐标曲线（拥塞窗口 / 复杂度增长）
     stack  层叠条（存储层次 / 协议栈）
     bars   横向条形对比
     array  数组格子（快排划分 / 大小端字节序）
     grid   二维表（流水线时空图 / 邻接矩阵）
   ========================================================================== */
(function () {
  'use strict';

  var CM = {
    blue: '--ink-blue', green: '--green', rust: '--rust', gold: '--gold',
    red: '--red', gray: '--muted', ink: '--ink'
  };
  function C(n) { return 'var(' + (CM[n] || CM.ink) + ')'; }
  function X(s) {
